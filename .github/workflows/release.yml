name: "Publish"

on:
  push:
    branches: ["master"] # Run tests on every push to main
    tags: ["v*"] # Run tests AND publish on tags
  pull_request:
    branches: ["master"] # Run tests on PRs

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Parallelize tests across your supported versions
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Without this, MuJoCo's renderer falls back to GLFW, which needs a
      # real display and aborts the process on this headless runner.
      MUJOCO_GL: egl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install EGL/Mesa libraries for headless rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libglx-mesa0

      - name: Install ffmpeg for video recording tests
        run: sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        # Explicitly tells uv which python version to use for the test environment;
        # --locked fails the job if uv.lock is out of date with pyproject.toml
        run: uv run --locked --python ${{ matrix.python-version }} --group dev --extra all pytest
  frontend:
    name: "Frontend (types, lint, tests, build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        # the Dojo's frontend is its own npm project, apart from the Python package
        working-directory: src/mujoco_mojo/utils/layers/dojo/templates/static/ts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/mujoco_mojo/utils/layers/dojo/templates/static/ts/package-lock.json

      - name: Install dependencies
        # installs exactly what package-lock.json says, and fails if it is out of date with package.json
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the committed build is current
        # static/dist is committed, so it is what ships: a change to the TypeScript
        # without a rebuilt dist would release the old code
        run: |
          if [ -n "$(git status --porcelain -- ../dist)" ]; then
            git status --short -- ../dist
            echo "::error::static/dist is out of date with the TypeScript sources. Run 'npm run build' in the ts directory and commit the result."
            exit 1
          fi
  publish:
    name: "Build and Publish"
    needs: [test, frontend]
    # ONLY run this job if the push was actually a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # Required for PyPI Trusted Publishing
      contents: write # Required to create GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all history so we can see other branches
          fetch-depth: 0

      - name: Verify Tag is on Master
        # Only perform this check if we were triggered by a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Check if 'master' branch contains the current commit
          if ! git branch -r --contains ${{ github.sha }} | grep -q "origin/master"; then
            echo "::error::Tag ${{ github.ref_name }} was pushed on a non-master branch. Skipping workflow."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
