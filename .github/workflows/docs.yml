name: Documentation
on:
  push:
    tags: ["v*"] # publish the docs only when a version is released, like the PyPI publish job
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          # fetch all history so the master check below can see other branches
          fetch-depth: 0
      - name: Verify tag is on master
        run: |
          # same guard as the publish job: a tag pushed from another branch must not deploy its docs
          if ! git branch -r --contains ${{ github.sha }} | grep -q "origin/master"; then
            echo "::error::Tag ${{ github.ref_name }} was pushed on a non-master branch. Skipping the docs deploy."
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - run: uv run --locked --python 3.14 --group dev --extra all --extra docs zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
