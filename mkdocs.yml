site_name: MuJoCo Mojo
site_url: https://hydrowelder.github.io/mujoco-mojo/
copyright: <a href="https://www.david-gable.com">Copyright &copy; 2026 David Gable</a>
repo_url: https://github.com/Hydrowelder/mujoco-mojo
repo_name: mujoco-mojo
remote_branch: gh-pages
remote_name: origin

watch:
  - docs
  - src
  - scripts

nav:
  - Home: index.md
  - User Guide:
      - Workflow:
          - Getting Started: user-guides/getting-started.md
          - Initializing a Project: user-guides/init.md
          - Generate Script: user-guides/generate-script.md
          - Runtime Script: user-guides/runtime-script.md
          - Running Jobs:
              - user-guides/running-jobs.md
              - Example Report: user-guides/MOJO_RUNTIME_REPORT.md
      - Features:
          - Dojo Dashboard:
              - user-guides/dojo.md
              - Monitor: user-guides/monitor.md
              - Mosaic: user-guides/mosaic.md
          - Optimization: user-guides/optimization.md
          - Reloaded: user-guides/reloaded.md
          - Pose Context: user-guides/pose-context.md
  - Code Reference:
      - mujoco_mojo:
          - MojoModel: reference/mujoco_mojo/mojo_model.md
          - Base: reference/mujoco_mojo/base.md
          - Visualization: reference/mujoco_mojo/visualization.md
          - Typing: reference/mujoco_mojo/typing.md
          # - Stochas: reference/mujoco_mojo/stochas.md
          - MJCF: reference/mujoco_mojo/mjcf.md
      - Runtime:
          - reference/mujoco_mojo/runtime/index.md
          - Load: reference/mujoco_mojo/runtime/load.md
          - RuntimeManager: reference/mujoco_mojo/runtime/runtime_manager.md
          - SignalManager: reference/mujoco_mojo/runtime/signal_manager.md
          - VideoRecorder: reference/mujoco_mojo/runtime/video_recorder.md
      - Utils:
          - reference/mujoco_mojo/utils/index.md
          - Color: reference/mujoco_mojo/utils/color.md
          - Runner: reference/mujoco_mojo/utils/runner.md
          - Proximity: reference/mujoco_mojo/utils/proximity.md
          - Filters: reference/mujoco_mojo/utils/filters.md
          - Interp: reference/mujoco_mojo/utils/interp.md
          - Dataframe: reference/mujoco_mojo/utils/dataframe.md
  - About: about.md

theme:
  name: material
  logo: assets/dark-logo.svg
  favicon: assets/dark-logo.svg
  font: false

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/lightbulb-on
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.instant
    # - navigation.instant.preview
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.sections
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.footnote.tooltips

plugins:
  - search
  - open-in-new-tab:
      add_icon: true
  # gen-files and literate-nav are MkDocs-only plugins; zensical ignores them.
  # Reference pages are pre-generated by scripts/gen_ref_pages.py instead.
  # - gen-files:
  #     scripts:
  #       - scripts/gen_ref_pages.py
  # - literate-nav:
  #     nav_file: SUMMARY.md
  # - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            modernize_annotations: true
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_bases: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            summary: false # set to true to get summary tables
            inherited_members: true
            # inheritance_diagram_direction: TD
            # show_inheritance_diagram: true
            show_attribute_values: true
            signature_crossrefs: true
            extensions:
              - pydantic: { schema: true }
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://mkdocstrings.github.io/griffe/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://numpy.org/doc/stable/objects.inv

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      # auto_title_map:
      #   "Python": ":simple-python: Python"
      #   "Bash": "`:material-bash:` Bash"
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.blocks.caption
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - zensical.extensions.glightbox:
      auto_themed: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mujoco-mojo/
      name: PyPI
    - icon: fontawesome/brands/github
      link: https://github.com/Hydrowelder
      name: My GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/david-gable/
      name: My LinkedIn

extra_javascript:
  - https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/favicon-switcher.js
  - javascripts/mojo-highlighter.js

extra_css:
  - stylesheets/extra.css
