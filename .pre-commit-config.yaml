repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: local
    hooks:
      - id: fix-smart-quotes
        name: Replace smart quotes
        entry: python scripts/fix_smart_quotes.py
        language: python
        files: ^src/
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: copy-docs-examples
        name: Copy Docs Examples to Examples
        entry: python scripts/copy_docs_examples_to_examples.py
        language: python
        files: ^docs/user-guides/.*\.py$
        additional_dependencies: [ruff==0.14.14]
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.14
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.27
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.27
    hooks:
      - id: uv-export
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
      - id: pyright
        name: Pyright (docs examples)
        args: [docs/user-guides]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-test
        name: Run GitHub Actions locally (act)
        entry: act -j test
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml|uv\.lock)
