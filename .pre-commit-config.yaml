repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: local
    hooks:
      - id: fix-smart-quotes
        name: Replace smart quotes
        entry: python scripts/fix_smart_quotes.py
        language: python
        files: ^src/
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: dojo-eslint
        name: Lint the Dojo frontend (ESLint)
        # system, not node: it needs the npm dependencies installed in the ts
        # directory (`npm install` there, see CLAUDE.md), the same as the type check
        # and the tests, and only runs when the frontend's sources change
        entry: npm --prefix src/mujoco_mojo/utils/layers/dojo/templates/static/ts run lint
        language: system
        files: ^src/mujoco_mojo/utils/layers/dojo/templates/static/ts/(src/.*\.ts|eslint\.config\.js|tsconfig\.json|package-lock\.json)$
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: dojo-tsc
        name: Type-check the Dojo frontend (tsc)
        # system, not node, for the same reason as dojo-eslint
        entry: npm --prefix src/mujoco_mojo/utils/layers/dojo/templates/static/ts run typecheck
        language: system
        files: ^src/mujoco_mojo/utils/layers/dojo/templates/static/ts/(src/.*\.ts|tsconfig\.json|package-lock\.json)$
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: dojo-build
        name: Rebuild the committed Dojo frontend (static/dist)
        # static/dist is committed and is what ships, so a source change needs its rebuild
        # in the same commit. Tailwind scans the templates for classes, so a template edit
        # can change main.css. Like gen-docs-source, it fails when it changed something:
        # stage the result and commit again. Listed after dojo-eslint and dojo-tsc so a
        # lint or type error shows before a build, and system for the same reason as them
        entry: npm --prefix src/mujoco_mojo/utils/layers/dojo/templates/static/ts run build
        language: system
        files: ^src/mujoco_mojo/utils/layers/dojo/templates/
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: dojo-vitest
        name: Test the Dojo frontend (Vitest)
        # before a push, not a commit, like the Python tests (act-test below). The
        # tests also read the Jinja templates, so a template change runs them too
        entry: npm --prefix src/mujoco_mojo/utils/layers/dojo/templates/static/ts test
        language: system
        files: ^src/mujoco_mojo/utils/layers/dojo/templates/(static/ts/(src/.*\.ts|vitest\.config\.ts|tsconfig\.json|package-lock\.json)|[^/]+\.html|partials/.*\.html)$
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: gen-docs-models
        name: Update the docs example models linked to MuJoCo Live
        entry: uv run --no-project --with-editable . python scripts/gen_docs_models.py
        # system, not python, for the same reason as gen-mjcf-tags above. This one runs
        # before a push rather than a commit: it builds the example models (a few seconds)
        # and the push is what publishes them to the branch the docs link to. A push stops
        # when the hook rewrote a model, so commit the new file and push again
        language: system
        files: ^(src/mujoco_mojo/.*\.py|docs/user-guides/examples/vlr/vlr_example\.py|scripts/gen_docs_models\.py)$
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: copy-docs-examples
        name: Copy Docs Examples to Examples
        entry: python scripts/copy_docs_examples_to_examples.py
        language: python
        files: ^docs/user-guides/.*\.py$
        additional_dependencies: [ruff==0.15.17]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: gen-cli-reference
        name: Update the command line reference page
        # system, not python, for the same reason as gen-mjcf-tags below: it imports
        # mujoco_mojo. It writes docs/reference/cli.md from the
        # command line itself, so it is listed before gen-docs-source, which bundles it
        entry: uv run --no-project --with-editable . python scripts/gen_cli_reference.py
        language: system
        files: ^(src/mujoco_mojo/utils/layers/cli\.py|scripts/gen_cli_reference\.py)$
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: gen-mjcf-tags
        name: Update the implemented MJCF tags checklist
        entry: uv run --no-project --with-editable . python scripts/gen_mjcf_tags.py
        # system, not python: this imports mujoco_mojo, which pre-commit's own isolated
        # venv does not have. A bare `python` is no better, since it is whatever the commit
        # was started from (a git GUI has no project venv), so uv builds a throwaway
        # environment holding this package and its dependencies instead (a couple of
        # seconds once cached). `--no-project` keeps it away from the project's own
        # environment and uv.lock.
        language: system
        files: ^(src/mujoco_mojo/mjcf/.*\.py|scripts/(gen_mjcf_tags\.py|mjcf_python_tree\.py|mjcf_schema_ignore\.txt))$
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: gen-docs-source
        name: Update the docs source bundled in the package
        # stdlib only, so pre-commit's own python is enough. It rewrites
        # src/mujoco_mojo/docs_source/ (mkdocs.yml and the pages without their images,
        # which `mujoco-mojo docs build` builds the site from), and a commit stops when it
        # did, so stage the result and commit again. It is listed after gen-cli-reference
        # and gen-mjcf-tags because it copies what they write (the command line reference
        # page and the MJCF tags checklist), and the command line is in the pattern
        # because only a staged file starts a hook. SensAI and `mujoco-mojo docs path`
        # read the guides from this bundle
        entry: python scripts/gen_docs_source.py
        language: python
        files: ^(docs/.*\.(md|py|js|css|svg)|mkdocs\.yml|CHANGELOG\.md|scripts/(generated/implemented_mjcf_tags\.md|gen_docs_source\.py|fix_smart_quotes\.py)|src/mujoco_mojo/utils/layers/cli\.py)$
        pass_filenames: false
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.17
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.21
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.21
    hooks:
      - id: uv-export
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.89
    hooks:
      - id: ty
        # ty checks against the project environment that `uv check` syncs from uv.lock, not
        # pre-commit's own, so the optional extras must be installed for their imports to
        # resolve (pydantic_ai, mjviser, viser); --frozen keeps uv.lock from being updated
        args: [--frozen, --all-extras]
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.411
  #   hooks:
  #     - id: pyright
  #     - id: pyright
  #       name: Pyright (docs examples)
  #       args: [docs/user-guides]
  #       pass_filenames: false
  #       always_run: true
  #       stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-test
        name: Run GitHub Actions locally (act)
        # --concurrent-jobs 1: the matrix jobs share one uv cache dir, and
        # griffe/beartype are pure-Python wheels with no per-Python-version
        # distinction, so running them in parallel races uv's cache
        # hardlink-or-copy step and can hand one container a half-written
        # package file. Real GitHub Actions runners don't hit this since
        # each matrix job gets its own isolated VM.
        entry: act -j test --concurrent-jobs 1
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml|uv\.lock)
  - repo: local
    hooks:
      - id: requirements-no-local-paths
        name: requirements.txt must not point at local paths
        # Dependabot rejects `-e ./something` here: the path has to exist in this
        # repo. It shows up when uv runs inside a parent uv workspace and exports
        # that workspace's members. `-e .` (this project) is fine.
        language: pygrep
        entry: '^-e \.\S'
        files: ^requirements\.txt$
      - id: verify-changelog-tag
        name: Verify CHANGELOG.md entry and date for current tag push
        entry: python scripts/verify_changelog_by_tag.py
        # system, not python: this now imports mujoco_mojo.utils.changelog, and
        # `language: python` would run it in pre-commit's own isolated venv,
        # which doesn't have the package installed - same reasoning as the
        # `act -j test` hook above, which needs the real project environment
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
