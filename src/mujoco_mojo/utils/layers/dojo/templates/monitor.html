{% extends "base.html" %} {% block title %}Monitor | MuJoCo Mojo{% endblock %}
{% block content %}
<div x-data="monitor()"
     x-init="init()">
  <!-- progress bar -->
  <section class="mb-12">
    <div class="flex justify-between mb-2 items-center">
      <span class="text-slate-500 dark:text-slate-400 text-xl font-bold">Overall Progress</span>
      <span class="text-3xl font-black text-cyan-500"
            x-text="status.progress.toFixed(1) + '%'"></span>
    </div>

    <div class="w-full bg-white dark:bg-slate-800 rounded-full h-8 overflow-hidden border border-slate-400 dark:border-slate-700 shadow-md transition-all duration-300 hover:scale-[1.02] hover:shadow-lg cursor-default">
      <div class="h-full transition-all duration-500 shadow-[0_0_20px_rgba(16,185,129,0.25)]"
           :style="`width: ${status.progress}%; background: ${progressGradient()}`"
           :title="`${status.n_success} succeeded · ${status.n_failed} failed requirements · ${status.n_error} errored`"></div>
    </div>
  </section>

  <!-- statistic cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
    <template x-for="(stat, index) in stats"
              :key="index">
      <div class="card card-hover p-6 flex flex-col justify-between">

        <div>
          <div class="flex items-start justify-between mb-2">
            <p class="text-slate-500 dark:text-slate-400 text-xs font-black uppercase tracking-widest"
               x-text="stat.label"></p>
            <div class="relative group">
              <svg class="w-4 h-4 text-slate-400 dark:text-slate-500 hover:text-cyan-500 dark:hover:text-cyan-400 cursor-help transition-colors duration-150"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="2"
                   viewBox="0 0 24 24">
                <circle cx="12"
                        cy="12"
                        r="10" />
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 16v-4m0-4h.01" />
              </svg>
              <div class="tooltip-panel right-0 w-64 text-xs font-normal normal-case tracking-normal text-slate-600 dark:text-slate-300 leading-relaxed"
                   x-text="stat.tooltip"></div>
            </div>
          </div>
          <p class="text-3xl font-black transition-colors duration-300"
             :class="stat.color"
             x-text="stat.value"></p>
        </div>

        <div class="mt-4 border-t border-slate-100 dark:border-slate-700/50 pt-3 flex flex-col gap-1">
          <template x-if="stat.subValue">
            <p class="text-xs font-mono uppercase tracking-tighter text-slate-400 dark:text-slate-500 leading-tight"
               x-text="stat.subValue"></p>
          </template>
        </div>

      </div>
    </template>
  </div>

  <!-- progress-over-time stacked histogram -->
  <section class="mb-12"
           x-show="status.timeline && status.timeline.length > 0"
           x-cloak>
    <div class="flex justify-between mb-2 items-center">
      <span class="text-slate-500 dark:text-slate-400 text-xl font-bold">Progress Over Time</span>
    </div>

    <div class="card p-4">
      <div id="timeline-chart"
           class="w-full h-64"></div>
    </div>
  </section>

  <!-- success trials list -->
  <section class="mt-8"
           x-show="status.success_tns && status.success_tns.length > 0"
           x-cloak>
    <h2 class="text-xl font-bold text-emerald-500 mb-4 flex items-center">
      <svg class="w-6 h-6 mr-2 stroke-current"
           fill="none"
           viewBox="0 0 24 24"
           stroke-width="2.5">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M22.9 3.7l-15.2 16.6-6.6-7.1" />
      </svg>
      Success Trials
    </h2>

    <div class="card p-4 max-h-60 overflow-y-auto custom-scrollbar">
      <div class="grid grid-cols-[repeat(auto-fill,minmax(4rem,1fr))] gap-3">
        <template x-for="tn in status.success_tns"
                  :key="tn">
          <a :href="`/mosaic/trial_${String(tn).padStart(parseInt(status.padding_style) || 0, '0')}`"
             class="badge-success"
             x-text="String(tn).padStart(parseInt(status.padding_style) || 0, '0')">
          </a>
        </template>
      </div>
    </div>
  </section>

  <!-- failed trials list -->
  <section class="mt-8"
           x-show="status.failure_tns && status.failure_tns.length > 0"
           x-cloak>
    <h2 class="text-xl font-bold text-rose-500 mb-4 flex items-center">
      <svg class="w-6 h-6 mr-2 stroke-current"
           fill="none"
           viewBox="0 0 24 24"
           stroke-width="2.5">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12" />
      </svg>
      Failed Trials
    </h2>

    <div class="card p-4 max-h-60 overflow-y-auto custom-scrollbar">
      <div class="grid grid-cols-[repeat(auto-fill,minmax(4rem,1fr))] gap-3">
        <template x-for="tn in status.failure_tns"
                  :key="tn">
          <div class="contents">
            <template x-if="status.failure_tns_with_db.includes(tn)">
              <a :href="`/mosaic/trial_${String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')}`"
                 class="badge-failure"
                 x-text="String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')">
              </a>
            </template>

            <template x-if="!status.failure_tns_with_db.includes(tn)">
              <span class="badge-disabled"
                    title="No telemetry data available"
                    x-text="String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')">
              </span>
            </template>
          </div>
        </template>
      </div>
    </div>
  </section>

  <!-- error trials list -->
  <section class="mt-8"
           x-show="status.error_tns && status.error_tns.length > 0"
           x-cloak>
    <h2 class="text-xl font-bold text-amber-500 mb-4 flex items-center">
      <svg class="w-6 h-6 mr-2 stroke-current"
           fill="none"
           viewBox="0 0 24 24"
           stroke-width="2.5">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
      </svg>
      Error Trials
    </h2>

    <div class="card p-4 max-h-60 overflow-y-auto custom-scrollbar">
      <div class="grid grid-cols-[repeat(auto-fill,minmax(4rem,1fr))] gap-3">
        <template x-for="tn in status.error_tns"
                  :key="tn">
          <div class="contents">
            <template x-if="status.error_tns_with_db.includes(tn)">
              <a :href="`/mosaic/trial_${String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')}`"
                 class="badge-error"
                 x-text="String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')">
              </a>
            </template>

            <template x-if="!status.error_tns_with_db.includes(tn)">
              <span class="badge-disabled"
                    title="No telemetry data available"
                    x-text="String(tn).padStart(status.padding_style.match(/\d+/)[0], '0')">
              </span>
            </template>
          </div>
        </template>
      </div>
    </div>
  </section>

  <!-- sound the bell -->
  <audio id="chime"
         src="{{ chime_src }}"></audio>
</div>
{% endblock %} {% block scripts %}
<script src="/mojo-static/vendored/plotly-3.4.0.min.js"></script>
<script src="/mojo-static/vendored/confetti.browser.min.js"></script>
<script src="/mojo-static/js/monitor.js"></script>
{% endblock %}
