<!-- ══════════════════════════════════════════════════════════════════
         DISTRIBUTIONS  ·  _distributions.html
         Collapsible sortable / filterable / resizable table of stochas
         distributions with per-trial sampled values and a PDF/PMF hover chart.
         ══════════════════════════════════════════════════════════════════ -->

<div class="mt-8 space-y-2"
     x-data="{
         open: localStorage.getItem('mojo:dists:open') !== '0',
         toggle() {
             this.open = !this.open;
             try { localStorage.setItem('mojo:dists:open', this.open ? '1' : '0'); } catch {}
         }
     }"
     x-show="dists.length > 0">

    <!-- section header -->
    <div class="flex items-center justify-between px-2">
        <button @mousedown.prevent="toggle()"
                @keydown.enter.prevent="toggle()"
                @keydown.space.prevent="toggle()"
                class="flex items-center gap-2 text-base font-black uppercase text-ink-muted tracking-widest hover:text-ink-body transition-colors active:scale-100">
            <svg class="w-4 h-4 transition-transform duration-150 pointer-events-none"
                 :class="open ? '' : '-rotate-90'"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 9l-7 7-7-7" />
            </svg>
            Distributions
        </button>
        <span class="text-sm font-bold font-mono px-2 py-0.5 rounded-full bg-chip text-ink-secondary"
              x-text="filteredDists.length === dists.length
                  ? `${dists.length} parameter${dists.length === 1 ? '' : 's'}`
                  : `${filteredDists.length}/${dists.length} parameters`"></span>
    </div>

    <!-- collapsible body -->
    <div x-show="open"
         x-transition:enter="transition-opacity duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="overflow-hidden">

        <div x-ref="distTable"
             class="rounded-lg border border-subtle bg-surface dark:bg-surface/50 text-sm font-mono overflow-x-auto min-w-0">

            <!-- column headers -->
            <div
                 class="flex items-stretch border-b border-subtle bg-well dark:bg-well/50 text-xs font-black tracking-wider text-ink-muted min-w-max w-full">

                <button data-distcol-header="name"
                        @click="toggleDistSort('name')"
                        :style="{ width: distColWidths.name + 'px' }"
                        class="shrink-0 flex items-center gap-1 text-left px-3 py-1.5 hover:text-ink-body transition-colors">
                    Name
                    <svg x-show="distSortKey === 'name'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'name')"
                     @dblclick="autoFitDistColumn('name')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button data-distcol-header="category"
                        @click="toggleDistSort('category')"
                        :style="{ width: distColWidths.category + 'px' }"
                        class="shrink-0 flex items-center gap-1 text-left px-3 py-1.5 hover:text-ink-body transition-colors">
                    Category
                    <svg x-show="distSortKey === 'category'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'category')"
                     @dblclick="autoFitDistColumn('category')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button data-distcol-header="dist_type"
                        @click="toggleDistSort('dist_type')"
                        :style="{ width: distColWidths.dist_type + 'px' }"
                        class="shrink-0 flex items-center gap-1 text-left px-3 py-1.5 hover:text-ink-body transition-colors">
                    Type
                    <svg x-show="distSortKey === 'dist_type'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'dist_type')"
                     @dblclick="autoFitDistColumn('dist_type')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button data-distcol-header="units"
                        :style="{ width: distColWidths.units + 'px' }"
                        class="shrink-0 flex items-center gap-1 text-left px-3 py-1.5">
                    Units
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'units')"
                     @dblclick="autoFitDistColumn('units')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button data-distcol-header="nominal"
                        @click="toggleDistSort('nominal')"
                        :style="{ width: distColWidths.nominal + 'px' }"
                        class="shrink-0 flex items-center text-left gap-1 px-3 py-1.5 hover:text-ink-body transition-colors">
                    Nominal
                    <svg x-show="distSortKey === 'nominal'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'nominal')"
                     @dblclick="autoFitDistColumn('nominal')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button data-distcol-header="sampled"
                        @click="toggleDistSort('sampled_value')"
                        :style="{ width: distColWidths.sampled + 'px' }"
                        class="shrink-0 flex items-center text-left gap-1 px-3 py-1.5 hover:text-ink-body transition-colors">
                    Sampled
                    <svg x-show="distSortKey === 'sampled_value'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="w-1.5 shrink-0 cursor-col-resize relative group"
                     @mousedown="startDistColResize($event, 'sampled')"
                     @dblclick="autoFitDistColumn('sampled')">
                    <div
                         class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px group-hover:w-0.5 bg-track group-hover:bg-accent-500 transition-colors">
                    </div>
                </div>

                <button @click="toggleDistSort('stat')"
                        class="flex-1 min-w-0 flex items-center text-left gap-1 px-3 py-1.5 hover:text-ink-body transition-colors">
                    Stat
                    <svg x-show="distSortKey === 'stat'"
                         class="w-3 h-3 transition-transform shrink-0"
                         :class="distSortAsc ? '' : 'rotate-180'"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="3"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <!-- filter row (aligned to columns) -->
            <div
                 class="flex items-stretch border-b border-subtle bg-well/50 dark:bg-well/30 min-w-max w-full">

                <!-- name text filter -->
                <div :style="{ width: distColWidths.name + 'px' }"
                     class="shrink-0 px-1 py-1">
                    <input type="text"
                           x-model="distFilterName"
                           placeholder="Filter name…"
                           class="w-full bg-well border border-control rounded-md px-2 py-1 text-xs font-mono text-ink-strong focus:outline-none focus:border-accent-400 dark:focus:border-accent-600" />
                </div>
                <div class="w-1.5 shrink-0"></div>

                <!-- category multiselect -->
                <div :style="{ width: distColWidths.category + 'px' }"
                     class="shrink-0 overflow-hidden">
                    <div class="w-full px-1 py-1 relative"
                         x-data="{ open: false, coords: { top: 0, left: 0 } }"
                         @click.away="open = false">
                        <button x-ref="catBtn"
                                @click="const r = $refs.catBtn.getBoundingClientRect(); coords = { top: r.bottom + window.scrollY + 4, left: r.left + window.scrollX }; open = !open"
                                class="w-full inline-flex items-center justify-between gap-1 bg-well border border-control rounded-md px-1.5 py-1 text-xs font-mono text-ink-strong">
                            <span class="truncate"
                                  x-text="distFilterCategories === null
                                  ? distCategories.length + ' categories'
                                  : distFilterCategories.length === 1 ? distFilterCategories[0]
                                  : distFilterCategories.length + ' / ' + distCategories.length"></span>
                            <svg class="w-2.5 h-2.5 shrink-0 transition-transform"
                                 :class="open ? 'rotate-180' : ''"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="3"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <template x-teleport="body">
                            <div x-show="open"
                                 @click.stop
                                 @click.away="open = false"
                                 :style="`position:absolute; top:${coords.top}px; left:${coords.left}px;`"
                                 class="bg-surface border border-line rounded-lg shadow-2xl overflow-hidden z-350 w-44"
                                 style="display:none;">
                                <div
                                     class="flex items-center gap-1 px-2 py-1 border-b border-subtle">
                                    <button @click.stop="selectAllDistCategories()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-accent-600 dark:text-accent-400 hover:bg-accent-500/10">
                                        All
                                    </button>
                                    <button @click.stop="deselectAllDistCategories()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-danger-500 hover:bg-danger-500/10">
                                        None
                                    </button>
                                </div>
                                <div class="max-h-56 overflow-y-auto custom-scrollbar">
                                    <template x-for="cat in distCategories"
                                              :key="cat">
                                        <label
                                               class="flex items-center gap-2 cursor-pointer px-3 py-1.5 text-sm font-mono text-ink-strong hover:bg-chip">
                                            <input type="checkbox"
                                                   :checked="distFilterCategories === null || distFilterCategories.includes(cat)"
                                                   @click.stop="toggleDistCategoryFilter(cat)"
                                                   class="rounded w-3 h-3 border-control accent-accent-500" />
                                            <span class="flex-1 truncate"
                                                  x-text="cat"></span>
                                            <span class="text-xs text-ink-muted tabular-nums"
                                                  x-text="distCategoryCounts[cat] ?? 0"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="w-1.5 shrink-0"></div>

                <!-- type multiselect -->
                <div :style="{ width: distColWidths.dist_type + 'px' }"
                     class="shrink-0 overflow-hidden">
                    <div class="w-full px-1 py-1 relative"
                         x-data="{ open: false, coords: { top: 0, left: 0 } }"
                         @click.away="open = false">
                        <button x-ref="typeBtn"
                                @click="const r = $refs.typeBtn.getBoundingClientRect(); coords = { top: r.bottom + window.scrollY + 4, left: r.left + window.scrollX }; open = !open"
                                class="w-full inline-flex items-center justify-between gap-1 bg-well border border-control rounded-md px-1.5 py-1 text-xs font-mono text-ink-strong">
                            <span class="truncate"
                                  x-text="distFilterTypes === null
                                  ? distTypes.length + ' types'
                                  : distFilterTypes.length === 1 ? distFilterTypes[0].replace(/_/g, ' ')
                                  : distFilterTypes.length + ' / ' + distTypes.length"></span>
                            <svg class="w-2.5 h-2.5 shrink-0 transition-transform"
                                 :class="open ? 'rotate-180' : ''"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="3"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <template x-teleport="body">
                            <div x-show="open"
                                 @click.stop
                                 @click.away="open = false"
                                 :style="`position:absolute; top:${coords.top}px; left:${coords.left}px;`"
                                 class="bg-surface border border-line rounded-lg shadow-2xl overflow-hidden z-350 w-52"
                                 style="display:none;">
                                <div
                                     class="flex items-center gap-1 px-2 py-1 border-b border-subtle">
                                    <button @click.stop="selectAllDistTypes()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-accent-600 dark:text-accent-400 hover:bg-accent-500/10">
                                        All
                                    </button>
                                    <button @click.stop="deselectAllDistTypes()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-danger-500 hover:bg-danger-500/10">
                                        None
                                    </button>
                                </div>
                                <div class="max-h-56 overflow-y-auto custom-scrollbar">
                                    <template x-for="type in distTypes"
                                              :key="type">
                                        <label
                                               class="flex items-center gap-2 cursor-pointer px-3 py-1.5 text-sm font-mono text-ink-strong hover:bg-chip">
                                            <input type="checkbox"
                                                   :checked="distFilterTypes === null || distFilterTypes.includes(type)"
                                                   @click.stop="toggleDistTypeFilter(type)"
                                                   class="rounded w-3 h-3 border-control accent-accent-500" />
                                            <span class="flex-1 truncate"
                                                  x-text="type.replace(/_/g, ' ')"></span>
                                            <span class="text-xs text-ink-muted tabular-nums"
                                                  x-text="distTypeCounts[type] ?? 0"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="w-1.5 shrink-0"></div>

                <!-- units multiselect -->
                <div :style="{ width: distColWidths.units + 'px' }"
                     class="shrink-0 overflow-hidden">
                    <div class="w-full px-1 py-1 relative"
                         x-data="{ open: false, coords: { top: 0, left: 0 } }"
                         @click.away="open = false">
                        <button x-ref="unitsBtn"
                                @click="const r = $refs.unitsBtn.getBoundingClientRect(); coords = { top: r.bottom + window.scrollY + 4, left: r.left + window.scrollX }; open = !open"
                                class="w-full inline-flex items-center justify-between gap-1 bg-well border border-control rounded-md px-1.5 py-1 text-xs font-mono text-ink-strong">
                            <span class="truncate"
                                  x-text="distFilterUnits === null
                                  ? distUnits.length + ' units'
                                  : distFilterUnits.length === 1 ? (distFilterUnits[0] === 'unset' ? '—' : distFilterUnits[0])
                                  : distFilterUnits.length + ' / ' + distUnits.length"></span>
                            <svg class="w-2.5 h-2.5 shrink-0 transition-transform"
                                 :class="open ? 'rotate-180' : ''"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="3"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <template x-teleport="body">
                            <div x-show="open"
                                 @click.stop
                                 @click.away="open = false"
                                 :style="`position:absolute; top:${coords.top}px; left:${coords.left}px;`"
                                 class="bg-surface border border-line rounded-lg shadow-2xl overflow-hidden z-350 w-36"
                                 style="display:none;">
                                <div
                                     class="flex items-center gap-1 px-2 py-1 border-b border-subtle">
                                    <button @click.stop="selectAllDistUnits()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-accent-600 dark:text-accent-400 hover:bg-accent-500/10">
                                        All
                                    </button>
                                    <button @click.stop="deselectAllDistUnits()"
                                            class="flex-1 px-1.5 py-0.5 rounded text-xs font-bold uppercase tracking-wide text-danger-500 hover:bg-danger-500/10">
                                        None
                                    </button>
                                </div>
                                <div class="max-h-56 overflow-y-auto custom-scrollbar">
                                    <template x-for="unit in distUnits"
                                              :key="unit">
                                        <label
                                               class="flex items-center gap-2 cursor-pointer px-3 py-1.5 text-sm font-mono text-ink-strong hover:bg-chip">
                                            <input type="checkbox"
                                                   :checked="distFilterUnits === null || distFilterUnits.includes(unit)"
                                                   @click.stop="toggleDistUnitFilter(unit)"
                                                   class="rounded w-3 h-3 border-control accent-accent-500" />
                                            <span class="flex-1 truncate"
                                                  x-text="unit === 'unset' ? '—' : unit"></span>
                                            <span class="text-xs text-ink-muted tabular-nums"
                                                  x-text="distUnitCounts[unit] ?? 0"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="w-1.5 shrink-0"></div>

                <!-- nominal, sampled, stat: empty spacers -->
                <div :style="{ width: distColWidths.nominal + 'px' }"
                     class="shrink-0"></div>
                <div class="w-1.5 shrink-0"></div>
                <div :style="{ width: distColWidths.sampled + 'px' }"
                     class="shrink-0"></div>
                <div class="w-1.5 shrink-0"></div>
                <div class="flex-1 min-w-0"></div>
            </div>

            <!-- rows -->
            <div
                 class="divide-y divide-subtle dark:divide-subtle/60 max-h-96 overflow-y-auto custom-scrollbar min-w-max">
                <template x-for="entry in filteredDists"
                          :key="entry.name">
                    <div class="flex items-center hover:bg-chip dark:hover:bg-chip/40 transition-colors cursor-default min-w-max"
                         @mouseenter="showDistTooltip($event, entry)"
                         @mouseleave="hideDistTooltip()">

                        <!-- name -->
                        <span data-distcol-content="name"
                              :style="{ width: distColWidths.name + 'px' }"
                              class="shrink-0 px-3 py-2 text-ink-strong truncate"
                              :title="entry.name"
                              x-text="entry.name"></span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- category -->
                        <span data-distcol-content="category"
                              :style="{ width: distColWidths.category + 'px' }"
                              class="shrink-0 px-3 py-2 text-ink-secondary truncate"
                              x-text="entry.category"></span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- type badge -->
                        <span :style="{ width: distColWidths.dist_type + 'px' }"
                              class="shrink-0 px-3 py-2 overflow-hidden">
                            <span data-distcol-content="dist_type"
                                  class="px-1.5 py-0.5 rounded text-xs font-semibold uppercase tracking-wide whitespace-nowrap"
                                  :class="entry.is_discrete
                                      ? 'bg-secondary-100 dark:bg-secondary-900/40 text-secondary-700 dark:text-secondary-300'
                                      : 'bg-accent-100 dark:bg-accent-900/40 text-accent-700 dark:text-accent-300'"
                                  x-text="entry.dist_type.replace(/_/g, ' ')"></span>
                        </span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- units -->
                        <span data-distcol-content="units"
                              :style="{ width: distColWidths.units + 'px' }"
                              class="shrink-0 px-3 py-2 text-ink-muted truncate"
                              x-text="entry.units === 'unset' ? '—' : entry.units"></span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- nominal -->
                        <span data-distcol-content="nominal"
                              :style="{ width: distColWidths.nominal + 'px' }"
                              class="shrink-0 px-3 py-2 text-right text-ink-secondary"
                              x-text="entry.nominal !== null ? fmtSigFig(entry.nominal) : (entry.nominal_label ?? '—')"></span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- sampled -->
                        <span data-distcol-content="sampled"
                              :style="{ width: distColWidths.sampled + 'px' }"
                              class="shrink-0 px-3 py-2 text-right font-semibold truncate"
                              :title="fmtSampled(entry)"
                              :class="(entry.sampled_values || entry.sampled_labels || entry.sampled_permutations)
                                  ? 'text-icon-strong'
                                  : 'text-ink-disabled'"
                              x-text="fmtSampled(entry)"></span>
                        <div class="w-1.5 shrink-0"></div>

                        <!-- stat: z-score or percentile (flex-1, last column) -->
                        <span class="flex-1 min-w-0 px-3 py-2 text-right">
                            <template x-if="entry.z_score !== null">
                                <span :class="Math.abs(entry.z_score) > 2
                                          ? 'text-warning-600 dark:text-warning-400'
                                          : 'text-ink-secondary'"
                                      x-text="(entry.z_score >= 0 ? '+' : '') + entry.z_score.toFixed(2) + 'σ'"></span>
                            </template>
                            <template x-if="entry.z_score === null && entry.percentile !== null">
                                <span class="text-ink-muted"
                                      x-text="fmtPercentile(entry.percentile)"></span>
                            </template>
                            <template x-if="entry.z_score === null && entry.percentile === null">
                                <span class="text-icon-faint">—</span>
                            </template>
                        </span>

                    </div>
                </template>

                <!-- empty states -->
                <div x-show="dists.length === 0"
                     class="px-4 py-6 text-center text-ink-muted">
                    No distribution data available.
                </div>
                <div x-show="dists.length > 0 && filteredDists.length === 0"
                     class="px-4 py-6 text-center text-ink-muted">
                    No distributions match the current filter.
                </div>
            </div>
        </div>

        <!-- legend -->
        <div class="flex items-center gap-4 px-1 pt-1.5 text-sm font-mono text-ink-muted">
            <span class="flex items-center gap-1">
                <span class="inline-block w-3 h-0.5 bg-danger-500"></span> sampled value
            </span>
            <span class="flex items-center gap-1">
