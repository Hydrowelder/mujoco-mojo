    <!-- ══════════════════════════════════════════════════════════════════
         OVERLAYS  ·  _overlays.html
         toast notification · drag-and-drop overlay
         ══════════════════════════════════════════════════════════════════ -->

    <!-- toast for sharable link (teleported to body so it is sticky)-->
    <template x-teleport="body">
        <div x-show="showToast"
             style="display: none;"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 -translate-y-12"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-12"
             class="fixed top-10 left-1/2 -translate-x-1/2 z-[1000] pointer-events-none">

            <div class="flex items-center gap-3 px-6 py-3 rounded-full border transition-colors duration-300 shadow-2xl"
                 :class="{
                'bg-cyan-500 border-cyan-500 text-white dark:text-slate-950': toastType === 'success',
                'bg-rose-500 border-rose-400 text-white': toastType === 'error',
                'bg-slate-700 border-slate-600 text-white': toastType === 'info'
             }">

                <svg class="w-4 h-4 shrink-0"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">

                    <path x-show="toastType === 'success'"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M5 13l4 4L19 7" />

                    <path x-show="toastType === 'error'"
                          style="display: none;"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M6 18L18 6M6 6l12 12" />

                    <path x-show="toastType === 'info'"
                          style="display: none;"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>

                <span class="text-base font-mono font-black tracking-widest uppercase"
                      x-text="toastMessage"></span>
            </div>
        </div>
    </template>

    <!-- drag and drop json to setup plot -->
    <div x-show="dragCounter > 0"
         style="display: none;"
         x-transition:enter="transition opacity duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         class="fixed inset-0 z-[1000] bg-cyan-500/10 dark:bg-cyan-500/5 backdrop-blur-md border-4 border-dashed border-cyan-500 flex items-center justify-center pointer-events-none">
        <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl border border-cyan-500 flex flex-col items-center gap-4">
            <div class="w-16 h-16 bg-cyan-500/10 rounded-full flex items-center justify-center text-cyan-500">
                <svg class="w-8 h-8"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
            </div>
            <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl border border-cyan-500 flex flex-col items-center gap-4">
                <p class="text-sm font-mono font-black uppercase tracking-widest text-slate-700 dark:text-cyan-500">
                    Drop Config to Warp
                </p>
            </div>
        </div>
    </div>
