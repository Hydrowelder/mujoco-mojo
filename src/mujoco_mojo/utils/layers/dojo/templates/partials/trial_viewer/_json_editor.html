<!-- ══════════════════════════════════════════════════════════════════
         JSON EDITOR  ·  _json_editor.html
         raw config viewer / editor with live syntax + schema validation
         ══════════════════════════════════════════════════════════════════ -->

<!-- JSON editor -->
<div class="mt-8 space-y-2"
     x-data="{
         open: localStorage.getItem('mojo:json-editor:open') !== '0',
         toggle() {
             this.open = !this.open;
             try { localStorage.setItem('mojo:json-editor:open', this.open ? '1' : '0'); } catch {}
         },
         saveHeight(el) {
             if (el.style.height) {
                 try { localStorage.setItem('mojo:json-editor:height', el.style.height); } catch {}
             }
         }
     }">
    <div class="flex items-center justify-between px-2">
        <button @click="toggle()"
                class="flex items-center gap-2 text-base font-black uppercase text-slate-400 tracking-widest hover:text-slate-300 transition-colors">
            <svg class="w-4 h-4 transition-transform duration-150 pointer-events-none"
                 :class="open ? '' : '-rotate-90'"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19 9l-7 7-7-7" />
            </svg>
            JSON Configuration
        </button>
        <div class="flex items-center gap-3">
            <span x-show="!isValidJson"
                  class="text-base font-bold text-rose-500 font-mono flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> Syntax Error
            </span>

            <span x-show="isValidJson && !isValidConfig"
                  class="text-base font-bold text-amber-500 font-mono flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Config Error
            </span>

            <span x-show="isValidJson && isValidConfig"
                  class="text-base font-bold text-emerald-500 font-mono flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live
            </span>
        </div>
    </div>

    <template x-if="configErrors.length > 0 && isValidJson">
        <div class="bg-amber-500/10 border border-amber-500/20 rounded-lg p-2 mx-1">
            <template x-for="err in configErrors">
                <p class="text-sm font-mono text-amber-600 dark:text-amber-400 flex items-center gap-2">
                    <span>→</span> <span x-text="err"></span>
                </p>
            </template>
        </div>
    </template>

    <div x-show="open"
         x-transition:enter="transition-opacity duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="relative bg-white dark:bg-slate-950 rounded-xl border border-slate-300 dark:border-slate-800 shadow-2xl shadow-slate-900/20 dark:shadow-none ring-1 ring-slate-200 dark:ring-slate-800 transition-all focus-within:border-cyan-500/50">

        <div class="absolute inset-0 p-4 font-mono text-sm leading-relaxed break-all whitespace-pre-wrap pointer-events-none overflow-hidden scroll-sync-target rounded-xl"
             x-html="highlightedJson"></div>

        <textarea x-model="configRaw"
                  x-init="
                      const h = localStorage.getItem('mojo:json-editor:height');
                      if (h) $el.style.height = h;
                  "
                  @input.debounce.500ms="updateFromRaw()"
                  @mouseup="saveHeight($el)"
                  @scroll="$el.parentElement.querySelector('.scroll-sync-target').scrollTop = $el.scrollTop"
                  class="relative w-full min-h-[16rem] bg-transparent p-4 text-transparent caret-slate-900 dark:caret-cyan-500 font-mono text-sm leading-relaxed outline-none focus:ring-0 resize-y custom-scrollbar"
                  spellcheck="false"></textarea>

        <div class="absolute right-4 bottom-4 flex gap-2 z-10">
            <button @click="copyRawConfig()"
                    class="px-3 py-1.5 bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 text-sm font-black uppercase rounded-lg border border-slate-200 dark:border-slate-800 hover:text-cyan-500 dark:hover:text-cyan-500 hover:border-cyan-500/50 transition-all shadow-sm">
                Copy
            </button>
            <button @click="configRaw = JSON.stringify(config, null, 4)"
                    class="px-3 py-1.5 bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 text-sm font-black uppercase rounded-lg border border-slate-200 dark:border-slate-800 hover:text-cyan-500 dark:hover:text-cyan-500 hover:border-cyan-500/50 transition-all shadow-sm">
                Format
            </button>
        </div>
    </div>
</div>
