<!-- ══════════════════════════════════════════════════════════════════
         CHART AREA  ·  _chart.html
         ┌ plot area  ──  Plotly chart canvas
         └ sidebar  ──────────────────────────────────────────────────
             share link · plot config (grid, line, legend, scale, title)
             annotation editor · shape editor
             undo · redo · download
         ══════════════════════════════════════════════════════════════════ -->

<div x-ref="chartRow"
     x-init="initChartResize($refs.chartRow); $watch('$store.dojo.isFullscreen', () => $nextTick(() => { resizeMainPlot(); requestAnimationFrame(() => { _renderFrameMarkers(); _syncOverlayVisibility(); }); }))"
     class="flex flex-row gap-4 items-stretch h-150">
    <!-- ── PLOT AREA ────────────────────────────────────────────────── -->
    <div class="card flex-1 rounded-2xl shadow-2xl p-2 relative">
        <div :class="(data && Object.keys(config.yAxes).length > 0) ? 'opacity-100' : 'opacity-0 pointer-events-none'"
             id="plot-area"
             class="w-full h-full transition-opacity duration-300">
        </div>
        <div x-show="data && Object.keys(config.yAxes).length === 0"
             class="absolute inset-0 flex items-center justify-center text-ink-muted font-mono text-base italic">
            Select Y-axis signals to begin...</div>
        <template x-if="loading">
            <div
                 class="absolute inset-0 bg-canvas/80 backdrop-blur-sm flex items-center justify-center">
                <div class="w-8 h-8 border-4 border-accent-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </template>
        <!-- miniplayer: wrapper controls position+size; canvas fills it; resize handle in corner -->
        <div id="mini-wrapper"
             class="absolute z-20 group"
             style="display:none; top:8px; left:8px; width:200px; height:112px;">
            <canvas id="mini-canvas"
                    class="w-full h-full rounded-lg shadow-xl ring-1 ring-accent-500 bg-black"
                    width="320"
                    height="180"
                    style="cursor:grab; display:block;"
                    @mousedown.prevent="_miniDragStart($event)">
            </canvas>
            <div class="absolute bottom-0 right-0 w-5 h-5 rounded-br-lg opacity-0 group-hover:opacity-100 transition-opacity cursor-se-resize"
                 style="background:linear-gradient(135deg,transparent 40%,var(--color-accent-500) 0%);"
                 @mousedown.prevent.stop="_miniResizeStart($event)"
                 title="Drag to resize · Hold Shift to lock aspect ratio">
            </div>
        </div>
        <!-- playback line overlay - positioned over the plot area, offset to match card's p-2 -->
        <div id="playback-line-overlay"
             class="absolute inset-2 pointer-events-none overflow-hidden"
             style="display:none;">
            <div id="playback-line-el"
                 style="position:absolute;top:0;bottom:0;left:0;width:1.5px;background:var(--color-accent-500);"></div>
            <svg id="playback-frames-svg"
                 style="position:absolute;top:0;left:0;width:100%;height:100%;"
                 xmlns="http://www.w3.org/2000/svg">
                <path id="playback-frames-path"
                      fill="none"
                      stroke="var(--color-accent-500)"
                      stroke-width="2" />
            </svg>
        </div>
    </div>

    <!-- ── SIDEBAR ──────────────────────────────────────────────────── -->
    <!-- overflow-y-auto so the button list scrolls instead of overflowing
         when the chart row is dragged shorter than the buttons need;
         overflow-x-hidden pairs with it since every popup that used to
         render inside this box (Plot Config, Notes, Shapes, Profiles,
         Export) is now x-teleport'd to body with JS-computed position,
         specifically so they don't get clipped by this scroll container. -->
    <div class="card flex flex-col gap-2 p-2 shrink-0 relative z-50 overflow-y-auto overflow-x-hidden custom-scrollbar">
        <!-- copy share link -->
        <div class="flex flex-col gap-2">
            <button @click="copyShareLink()"
                    class="sidebar-btn disabled:opacity-40 disabled:hover:bg-well"
                    title="Copy Share Link">
                <svg class="w-5 h-5"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
                <span class="text-xs font-black uppercase tracking-tighter">Share</span>
            </button>
        </div>

        <!-- ── PLOT CONFIG: grid · line · interp · hover · legend · scale · title ── -->
        <div class="flex flex-col gap-2">
            <div class="relative"
                 x-data="{ plotConfigCoords: { top: 0, left: 0 } }">
                <button x-ref="plotConfigBtn"
                        @click="const r = $refs.plotConfigBtn.getBoundingClientRect(); const w = window.innerWidth >= 640 ? 320 : window.innerWidth - 96; plotConfigCoords = { top: r.top + window.scrollY, left: r.left + window.scrollX - w - 16 }; plotConfigOpen = !plotConfigOpen"
                        class="sidebar-btn disabled:opacity-40 disabled:hover:bg-well"
                        :class="plotConfigOpen ? 'text-accent-500 bg-accent-100/50 dark:bg-chip/50' : ''"
                        title="Edit Plot Configuration">
                    <svg class="w-5 h-5"
                         :class="plotConfigOpen ? 'text-accent-500' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path d="M4 4v16h16v-2H6V4H4z"
                              fill="currentColor"></path>
                        <path d="M8 13l3-3 4 4 4-4v5H8v-2z"
                              fill="currentColor"></path>
                    </svg>
                    <span class="text-xs font-black uppercase tracking-tighter">Plot</span>
                </button>

                <template x-teleport="body">
                <div x-show="plotConfigOpen"
                     x-transition
                     @click.stop
                     @click.away="plotConfigOpen = false"
                     :style="`position:absolute;top:${plotConfigCoords.top}px;left:${plotConfigCoords.left}px;`"
                     class="w-[calc(100vw-6rem)] sm:w-80 bg-surface border border-line rounded-xl shadow-2xl p-4 z-200"
                     style="display:none;">

                    <p
                       class="text-base font-black uppercase text-ink-muted mb-4 tracking-widest border-b border-subtle pb-1">
                        Plot Editor
                    </p>

                    <div class="space-y-4">
                        <!-- row 1 -->
                        <div class="grid grid-cols-2 gap-3 max-h-64">
                            <!-- gridlines -->
                            <div class="space-y-1 relative"
                                 x-data="{ open: false }">
                                <label class="text-xs font-bold text-ink-secondary uppercase">Gridlines</label>

                                <button @click="open = !open"
                                        @click.away="open = false"
                                        class="{{ dropdown_trigger }}">

                                    <span class="truncate"
                                          x-text="config.grid === 'all' ? 'Major + Minor' : (config.grid.charAt(0).toUpperCase() + config.grid.slice(1))"></span>

                                    <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="open ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                <div x-show="open"
                                     x-transition
                                     class="{{ dropdown_panel }}">

                                    <template x-for="opt in opts.grid">
                                        <button @click="config.grid = opt; saveAndRender(); open = false"
                                                class="{{ dropdown_option }}"
                                                :class="config.grid === opt ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                            <span
                                                  x-text="opt === 'all' ? 'Major + Minor' : (opt.charAt(0).toUpperCase() + opt.slice(1))"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <!-- linemode -->
                            <div class="space-y-1 relative"
                                 x-data="{ open: false }">
                                <label class="text-xs font-bold text-ink-secondary uppercase">Mode</label>

                                <button @click="open = !open"
                                        @click.away="open = false"
                                        class="{{ dropdown_trigger }}">

                                    <span class="truncate"
                                          x-text="opts.lineModeLabel(config.lineMode)"></span>

                                    <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="open ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                <div x-show="open"
                                     x-transition
                                     class="{{ dropdown_panel }}">

                                    <template x-for="opt in opts.lineMode"
                                              :key="opt.value">
                                        <button @click="config.lineMode = opt.value; saveAndRender(); open = false"
                                                class="{{ dropdown_option }}"
                                                :class="config.lineMode === opt.value ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                            <span x-text="opt.label"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- row 2 -->
                        <div class="grid grid-cols-2 gap-3">
                            <!-- interpolation -->
                            <div class="space-y-1 relative transition-opacity duration-300"
                                 x-data="{ open: false }"
                                 :class="config.lineMode === 'markers' ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''">

                                <label class="text-xs font-bold text-ink-secondary uppercase">Interpolation</label>

                                <button @click="open = !open"
                                        @click.away="open = false"
                                        :disabled="config.lineMode === 'markers'"
                                        class="{{ dropdown_trigger_disabled }}">

                                    <span class="truncate"
                                          x-text="opts.interpLabel(config.interp)"></span>

                                    <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="open ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                <div x-show="open"
                                     x-transition
                                     class="{{ dropdown_panel }}">

                                    <template x-for="opt in opts.interp"
                                              :key="opt.value">
                                        <button @click="config.interp = opt.value; saveAndRender(); open = false"
                                                class="{{ dropdown_option }}"
                                                :class="config.interp === opt.value ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                            <span x-text="opt.label"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <!-- hoverstyle -->
                            <div class="space-y-1 relative"
                                 x-data="{ open: false }">
                                <label class="text-xs font-bold text-ink-secondary uppercase">Hover</label>

                                <button @click="open = !open"
                                        @click.away="open = false"
                                        class="{{ dropdown_trigger }}">

                                    <span class="truncate"
                                          x-text="opts.hoverLabel(config.hover)"></span>

                                    <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="open ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                <div x-show="open"
                                     x-transition
                                     class="{{ dropdown_panel }}">

                                    <template x-for="opt in opts.hover"
                                              :key="opt.value">
                                        <button @click="config.hover = opt.value; saveAndRender(); open = false"
                                                class="{{ dropdown_option }}"
                                                :class="config.hover === opt.value ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                            <span x-text="opt.label"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- row 3 -->
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <!-- legend location -->
                            <div class="space-y-1 relative"
                                 x-data="{ open: false }">
                                <label class="text-xs font-bold text-ink-secondary uppercase">Legend</label>

                                <button @click="open = !open"
                                        @click.away="open = false"
                                        class="{{ dropdown_trigger }}">

                                    <span class="truncate"
                                          x-text="config.legendPos.charAt(0).toUpperCase() + config.legendPos.slice(1)"></span>

                                    <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="open ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                <div x-show="open"
                                     x-transition
                                     class="{{ dropdown_panel }}">

                                    <template x-for="opt in opts.legendPos"
                                              :key="opt">
                                        <button @click="config.legendPos = opt; saveAndRender(); open = false"
                                                class="{{ dropdown_option }}"
                                                :class="config.legendPos === opt ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                            <span x-text="opt.charAt(0).toUpperCase() + opt.slice(1)"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <!-- show spikes checkbox -->
                            <label class="flex items-center justify-between p-2 bg-well border border-control rounded-lg group transition-all hover:border-accent-500/50 cursor-pointer"
                                   :class="config.hover === 'none' ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''">

                                <span
                                      class="text-xs font-bold text-ink-secondary uppercase tracking-widest transition-colors group-hover:text-ink-strong">
                                    Show Spikes
                                </span>

                                <div class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox"
                                           x-model="config.showSpike"
                                           @change="saveAndRender()"
                                           :disabled="config.hover === 'none'"
                                           class="sr-only">

                                    <div class="w-10 h-6 bg-control border-2 border-control rounded-md transition-colors duration-200"
                                         :class="config.showSpike ? 'bg-accent-500/20 border-accent-500' : ''"></div>

                                    <div class="absolute left-1 top-1 w-4 h-4 rounded-sm transition-all duration-200 shadow-sm"
                                         :class="config.showSpike
                ? 'translate-x-4 bg-accent-500'
                : 'translate-x-0 bg-ink-muted'">
                                    </div>
                                </div>
                            </label>
                        </div>

                        <!-- plot type toggle + max points -->
                        <div class="flex items-center gap-2">

                            <!-- plot type -->
                            <div class="flex items-center p-2 bg-well border border-control rounded-lg gap-2">
                                <span class="text-xs font-bold text-ink-secondary uppercase tracking-widest shrink-0">
                                    Plot Type
                                </span>

                                <div class="flex rounded-md border border-control overflow-hidden shrink-0">
                                    <button @click="config.plotType = 'cartesian'; saveAndRender()"
                                            title="Cartesian"
                                            class="p-1.5 transition-colors"
                                            :class="config.plotType !== 'polar'
                                                ? 'bg-accent-500 text-white'
                                                : 'text-ink-muted hover:text-accent-500'">
                                        <svg class="w-4 h-4"
                                             viewBox="0 0 20 20"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.5">
                                            <line x1="4"
                                                  y1="2"
                                                  x2="4"
                                                  y2="18" />
                                            <line x1="10"
                                                  y1="2"
                                                  x2="10"
                                                  y2="18" />
                                            <line x1="16"
                                                  y1="2"
                                                  x2="16"
                                                  y2="18" />
                                            <line x1="2"
                                                  y1="4"
                                                  x2="18"
                                                  y2="4" />
                                            <line x1="2"
                                                  y1="10"
                                                  x2="18"
                                                  y2="10" />
                                            <line x1="2"
                                                  y1="16"
                                                  x2="18"
                                                  y2="16" />
                                        </svg>
                                    </button>
                                    <button @click="config.plotType = 'polar'; saveAndRender()"
                                            title="Polar"
                                            class="p-1.5 border-l border-control transition-colors"
                                            :class="config.plotType === 'polar'
                                                ? 'bg-accent-500 text-white'
                                                : 'text-ink-muted hover:text-accent-500'">
                                        <svg class="w-4 h-4"
                                             viewBox="0 0 20 20"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.5">
                                            <circle cx="10"
                                                    cy="10"
                                                    r="3" />
                                            <circle cx="10"
                                                    cy="10"
                                                    r="6" />
                                            <circle cx="10"
                                                    cy="10"
                                                    r="9" />
                                            <line x1="10"
                                                  y1="1"
                                                  x2="10"
                                                  y2="19" />
                                            <line x1="1"
                                                  y1="10"
                                                  x2="19"
                                                  y2="10" />
                                            <line x1="3.6"
                                                  y1="3.6"
                                                  x2="16.4"
                                                  y2="16.4" />
                                            <line x1="16.4"
                                                  y1="3.6"
                                                  x2="3.6"
                                                  y2="16.4" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- max points: number input with data length as placeholder -->
                            <div class="flex items-center p-2 bg-well border border-control rounded-lg gap-2 min-w-0">
                                <span
                                      class="text-xs font-bold text-ink-secondary uppercase tracking-widest shrink-0">Pts</span>
                                <div
                                     class="relative flex items-center bg-surface-inset border border-inset rounded-md shadow-sm w-20">
                                    <input type="text"
                                           inputmode="numeric"
                                           :placeholder="dataLength || ''"
                                           :value="config.maxPoints ?? ''"
                                           :class="config.maxPoints !== null ? 'pr-5' : ''"
                                           @change="
                                               const v = parseInt($event.target.value);
                                               config.maxPoints = isNaN(v) || v <= 0 ? null : v;
                                               saveAndRender();
                                           "
                                           @keydown="!/^[0-9]$/.test($event.key) && !['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter'].includes($event.key) && $event.preventDefault()"
                                           class="number-input w-full py-1 text-sm" />
                                    <button x-show="config.maxPoints !== null"
                                            @click="config.maxPoints = null; saveAndRender()"
                                            title="Remove limit"
                                            class="absolute right-0 inset-y-0 flex items-center px-1.5 text-ink-muted hover:text-ink-body transition-colors">
                                        <svg class="w-3 h-3"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="2.5"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                        </div>

                        <!-- display unit system -->
                        <div class="space-y-1 relative"
                             x-data="{ open: false }">
                            <label class="text-xs font-bold text-ink-secondary uppercase">Display Units</label>
                            <button @click="open = !open"
                                    @click.away="open = false"
                                    class="{{ dropdown_trigger }}">
                                <span class="truncate"
                                      x-text="config.displayUnitSystem ? config.displayUnitSystem.toUpperCase() : 'As logged'"></span>
                                <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                     :class="open ? 'rotate-180' : ''"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="3"
                                     viewBox="0 0 24 24">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                            <div x-show="open"
                                 x-transition
                                 class="{{ dropdown_panel }}">
                                <button @click="config.displayUnitSystem = null; saveAndRender(); open = false"
                                        class="{{ dropdown_option }}"
                                        :class="!config.displayUnitSystem ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                    As logged
                                </button>
                                <button @click="config.displayUnitSystem = 'si'; saveAndRender(); open = false"
                                        class="{{ dropdown_option }}"
                                        :class="config.displayUnitSystem === 'si' ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                    SI <span class="opacity-50 text-xs font-normal">m · kg · s</span>
                                </button>
                                <button @click="config.displayUnitSystem = 'cgs'; saveAndRender(); open = false"
                                        class="{{ dropdown_option }}"
                                        :class="config.displayUnitSystem === 'cgs' ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                    CGS <span class="opacity-50 text-xs font-normal">cm · g · s</span>
                                </button>
                                <button @click="config.displayUnitSystem = 'fps'; saveAndRender(); open = false"
                                        class="{{ dropdown_option }}"
                                        :class="config.displayUnitSystem === 'fps' ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                    FPS <span class="opacity-50 text-xs font-normal">ft · slug · s</span>
                                </button>
                                <button @click="config.displayUnitSystem = 'ips'; saveAndRender(); open = false"
                                        class="{{ dropdown_option }}"
                                        :class="config.displayUnitSystem === 'ips' ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'">
                                    IPS <span class="opacity-50 text-xs font-normal">in · slinch · s</span>
                                </button>
                            </div>
                        </div>

                        <!-- axis base -->
                        <div class="space-y-3">

                            <!-- x scale -->
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1 relative"
                                     x-data="{ open: false }">
                                    <label class="text-xs font-bold text-ink-secondary uppercase">X-Scale</label>
                                    <button @click="open = !open"
                                            @click.away="open = false"
                                            class="{{ dropdown_trigger }}">
                                        <span x-text="config.xScale === 'log' ? 'Log' : 'Linear'"></span>
                                        <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                             :class="open ? 'rotate-180' : ''"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="3"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </button>
                                    <div x-show="open"
                                         x-transition
                                         class="{{ dropdown_panel }}">
                                        <template x-for="opt in opts.scale">
                                            <button @click="config.xScale = opt; if(opt === 'log' && !config.xLogBase) config.xLogBase = 10; saveAndRender(); open = false"
                                                    class="{{ dropdown_option }}"
                                                    :class="config.xScale === opt ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'"
                                                    x-text="opt.charAt(0).toUpperCase() + opt.slice(1)"></button>
                                        </template>
                                    </div>
                                    <div x-show="config.xScale === 'log'"
                                         x-transition
                                         class="mt-2 flex items-center gap-2">
                                        <span class="text-xs font-bold text-ink-muted uppercase">Base</span>

                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm ml-auto w-20">
                                            <input type="text"
                                                   x-model.number="config.xLogBase"
                                                   @change="saveAndRender()"
                                                   @keydown="!/^[0-9.]$/.test($event.key) && !['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter'].includes($event.key) && $event.preventDefault()"
                                                   inputmode="decimal"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                    </div>
                                </div>

                                <!-- y scale -->
                                <div class="space-y-1 relative"
                                     x-data="{ open: false }">
                                    <label class="text-xs font-bold text-ink-secondary uppercase">Y-Scale</label>
                                    <button @click="open = !open"
                                            @click.away="open = false"
                                            class="{{ dropdown_trigger }}">
                                        <span x-text="config.yScale === 'log' ? 'Log' : 'Linear'"></span>
                                        <svg class="w-3.5 h-3.5 text-icon-strong shrink-0 transition-transform duration-200"
                                             :class="open ? 'rotate-180' : ''"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="3"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </button>
                                    <div x-show="open"
                                         x-transition
                                         class="{{ dropdown_panel }}">
                                        <template x-for="opt in opts.scale">
                                            <button @click="config.yScale = opt; if(opt === 'log' && !config.yLogBase) config.yLogBase = 10; saveAndRender(); open = false"
                                                    class="{{ dropdown_option }}"
                                                    :class="config.yScale === opt ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'"
                                                    x-text="opt.charAt(0).toUpperCase() + opt.slice(1)"></button>
                                        </template>
                                    </div>
                                    <div x-show="config.yScale === 'log'"
                                         x-transition
                                         class="mt-2 flex items-center gap-2">
                                        <span class="text-xs font-bold text-ink-muted uppercase">Base</span>

                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm ml-auto w-20">
                                            <input type="text"
                                                   x-model.number="config.yLogBase"
                                                   @change="saveAndRender()"
                                                   @keydown="!/^[0-9.]$/.test($event.key) && !['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter'].includes($event.key) && $event.preventDefault()"
                                                   inputmode="decimal"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- x/y range -->
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-ink-secondary uppercase">X-Range</label>
                                    <div class="flex items-center gap-1.5">
                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                            <input type="text"
                                                   placeholder="Auto"
                                                   title="Supports arithmetic: e.g. -pi, sqrt(2)"
                                                   :value="rangeBoundValue('x', 'min')"
                                                   @change="setRangeBound('x', 'min', $event.target.value)"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                        <span class="text-ink-muted text-xs">-</span>
                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                            <input type="text"
                                                   placeholder="Auto"
                                                   title="Supports arithmetic: e.g. pi, sqrt(2)"
                                                   :value="rangeBoundValue('x', 'max')"
                                                   @change="setRangeBound('x', 'max', $event.target.value)"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-ink-secondary uppercase">Y-Range</label>
                                    <div class="flex items-center gap-1.5">
                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                            <input type="text"
                                                   placeholder="Auto"
                                                   title="Supports arithmetic: e.g. -pi, sqrt(2)"
                                                   :value="rangeBoundValue('y', 'min')"
                                                   @change="setRangeBound('y', 'min', $event.target.value)"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                        <span class="text-ink-muted text-xs">-</span>
                                        <div
                                             class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                            <input type="text"
                                                   placeholder="Auto"
                                                   title="Supports arithmetic: e.g. pi, sqrt(2)"
                                                   :value="rangeBoundValue('y', 'max')"
                                                   @change="setRangeBound('y', 'max', $event.target.value)"
                                                   class="number-input w-full py-1 text-sm" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-subtle dark:border-subtle/50 my-2"></div>

                        <!-- titles -->
                        <div class="space-y-3">
                            <!-- main title -->
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-ink-secondary uppercase tracking-tighter">Main Plot
                                    Title</label>
                                <div class="relative mb-2">
                                    <input type="text"
                                           x-model.lazy="config.title"
                                           placeholder="Untitled Plot"
                                           class="input-field w-full shadow-sm px-2 pr-8 py-1.5" />

                                    <button x-show="config.title"
                                            type="button"
                                            @mousedown.prevent="config.title = ''"
                                            class="{{ clear_btn }}"
                                            x-transition:enter="transition duration-75"
                                            x-transition:enter-start="opacity-0"
                                            x-transition:enter-end="opacity-100">
                                        <svg class="w-3 h-3"
                                             fill="none"
                                             stroke="currentColor"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  stroke-width="3"
                                                  d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- x axis label -->
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-ink-secondary uppercase tracking-tighter">X-Axis
                                    Label</label>
                                <div class="relative mb-2">
                                    <input type="text"
                                           x-model.lazy="config.xAxisTitle"
                                           :placeholder="config.xAxis.col"
                                           class="input-field w-full shadow-sm px-2 pr-8 py-1.5" />

                                    <button x-show="config.xAxisTitle"
                                            type="button"
                                            @mousedown.prevent="config.xAxisTitle = ''"
                                            class="{{ clear_btn }}"
                                            x-transition:enter="transition duration-75"
                                            x-transition:enter-start="opacity-0"
                                            x-transition:enter-end="opacity-100">
                                        <svg class="w-3 h-3"
                                             fill="none"
                                             stroke="currentColor"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  stroke-width="3"
                                                  d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- y axis label -->
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-ink-secondary uppercase tracking-tighter">Y-Axis
                                    Label</label>
                                <div class="relative mb-2">
                                    <input type="text"
                                           x-model.lazy="config.yAxisTitle"
                                           placeholder="Y-Axis Label"
                                           class="input-field w-full shadow-sm px-2 pr-8 py-1.5" />

                                    <button x-show="config.yAxisTitle"
                                            type="button"
                                            @mousedown.prevent="config.yAxisTitle = ''"
                                            class="{{ clear_btn }}"
                                            x-transition:enter="transition duration-75"
                                            x-transition:enter-start="opacity-0"
                                            x-transition:enter-end="opacity-100">
                                        <svg class="w-3 h-3"
                                             fill="none"
                                             stroke="currentColor"
                                             viewBox="0 0 24 24">
                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  stroke-width="3"
                                                  d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- reset config -->
                        <div class="pt-2">
                            <button @click="resetConfig()"
                                    class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-danger-500/10 hover:bg-danger-500 text-danger-500 hover:text-white border border-danger-500/20 rounded-lg text-sm font-black uppercase tracking-widest transition-all">
                                <svg class="w-3 h-3"
                                     fill="none"
                                     stroke="currentColor"
                                     viewBox="0 0 24 24">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="2"
                                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                                Reset to Defaults
                            </button>
                        </div>
                    </div>
                </div>
                </template>
            </div>
        </div>

        <!-- ── ANNOTATION EDITOR ────────────────────────────────────── -->
        <div class="flex flex-col gap-2">
            <div class="relative">
                <button x-ref="annBtn"
                        @click="const r = $refs.annBtn.getBoundingClientRect(); annCoords = { top: r.top + window.scrollY, left: r.left + window.scrollX - 288 - 16 }; annotationsOpen = !annotationsOpen"
                        class="sidebar-btn disabled:opacity-40"
                        :class="{
                    'text-accent-500 bg-accent-100/50 dark:bg-chip/50': annotationsOpen && config.plotType !== 'polar',
                    'opacity-30 cursor-not-allowed pointer-events-none': config.plotType === 'polar'
                }"
                        :title="config.plotType === 'polar' ? 'Notes not available in Polar mode' : 'Manage Notes'">
                    <svg class="w-5 h-5"
                         :class="annotationsOpen ? 'text-accent-500' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M7 9h10M7 12h6" />
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M21 13V7a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v6a4 4 0 0 0 4 4h2.023c.3 0 .575.153.73.404l2.111 3.378a.15.15 0 0 0 .272 0l2.159-3.454c.127-.204.351-.328.592-.328H17a4 4 0 0 0 4-4z" />
                    </svg>
                    <span class="text-xs font-black uppercase tracking-tighter">Notes</span>
                </button>

                <template x-teleport="body">
                <div x-show="annotationsOpen"
                     x-transition
                     @click.stop
                     @click.away="if ($event.button !== 1) { annotationsOpen = false; annDraft = null; annEditIndex = null; }"
                     :style="`position:absolute;top:${annCoords.top}px;left:${annCoords.left}px;`"
                     class="w-72 bg-surface border border-line rounded-xl shadow-2xl p-4 z-200"
                     style="display:none;">

                    <p
                       class="text-base font-black uppercase text-ink-muted mb-4 tracking-widest border-b border-subtle pb-1">
                        Notes Editor
                    </p>

                    <!-- call to action -->
                    <div x-show="!config.annotations.length && !annDraft"
                         class="py-12 px-4 text-center border-2 border-dashed border-subtle rounded-xl">
                        <p class="text-sm font-bold text-ink-muted uppercase tracking-tight leading-relaxed">
                            No notes yet.<br>
                            <span class="text-accent-500/80">Middle-click any point on the plot</span><br>
                            to drop a new note.
                        </p>
                    </div>

                    <!-- editor -->
                    <template x-if="annDraft">
                        <div class="mb-6 p-3 bg-accent-500/5 border border-accent-500/20 rounded-lg">
                            <p class="text-sm font-bold text-accent-500 uppercase mb-2">
                                <span x-text="annEditIndex !== null ? 'Editing Note' : 'New Note'"></span>
                            </p>

                            <div class="flex items-center gap-2 mb-2">
                                <label class="text-xs font-mono text-ink-muted">X:</label>
                                <div
                                     class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                    <input type="number"
                                           step="any"
                                           :value="annDraft.x"
                                           @change="annDraft.x = evalMathExpr($event.target.value) ?? annDraft.x"
                                           @keydown.enter="saveAnnotation()"
                                           @keydown.escape="cancelAnnDraft()"
                                           class="number-input w-full py-1 text-sm" />
                                </div>
                                <label class="text-xs font-mono text-ink-muted">Y:</label>
                                <div
                                     class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                    <input type="number"
                                           step="any"
                                           :value="annDraft.y"
                                           @change="annDraft.y = evalMathExpr($event.target.value) ?? annDraft.y"
                                           @keydown.enter="saveAnnotation()"
                                           @keydown.escape="cancelAnnDraft()"
                                           class="number-input w-full py-1 text-sm" />
                                </div>
                            </div>

                            <input type="text"
                                   x-ref="annInput"
                                   x-model="annDraft.text"
                                   @keydown.enter="saveAnnotation()"
                                   @keydown.escape="cancelAnnDraft()"
                                   placeholder="Enter note..."
                                   class="input-field w-full shadow-sm px-2 py-1.5" />

                            <div class="flex justify-end gap-2 mt-2">
                                <button @click="cancelAnnDraft()"
                                        class="text-xs font-bold text-ink-muted hover:text-ink-body uppercase">Cancel</button>
                                <button @click="saveAnnotation()"
                                        class="text-xs font-bold text-accent-500 hover:text-accent-600 uppercase"
                                        x-text="annEditIndex !== null ? 'Update' : 'Save'"></button>
                            </div>
                        </div>
                    </template>

                    <!-- list view -->
                    <div class="space-y-2 max-h-80 overflow-y-auto pr-1 custom-scrollbar">
                        <template x-for="(ann, index) in config.annotations"
                                  :key="index">
                            <div class="group bg-well dark:bg-well/40 border border-subtle rounded-lg p-2.5 hover:border-accent-500/50 transition-colors cursor-pointer"
                                 @click="jumpToAnnotation(ann)">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex-1">
                                        <p class="text-sm font-bold text-ink-strong wrap-break-word"
                                           x-text="ann.text"></p>

                                        <p class="text-xs font-mono text-ink-muted mt-1"
                                           x-text="`X: ${formatNum(ann.x)} | Y: ${formatNum(ann.y)}`"></p>
                                    </div>

                                    <div
                                         class="flex items-center gap-1 opacity-20 group-hover:opacity-100 transition-opacity">
                                        <button @click.stop="startAnnEdit(index)"
                                                class="p-1 hover:text-accent-500 text-ink-muted">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-width="2"
                                                      d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7">
                                                </path>
                                                <path stroke-width="2"
                                                      d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z">
                                                </path>
                                            </svg>
                                        </button>
                                        <button @click.stop="deleteAnnotation(index)"
                                                class="p-1 hover:text-danger-500 text-ink-muted">
                                            <svg class="w-3 h-3 transition-transform hover:scale-110"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-linecap="round"
                                                      stroke-linejoin="round"
                                                      stroke-width="2.5"
                                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                </template>
            </div>
        </div>

        <!-- ── SHAPE EDITOR ──────────────────────────────────────────── -->
        <div class="flex flex-col gap-2">
            <div class="relative"
                 x-data="{ shapesCoords: { top: 0, left: 0 } }">
                <button x-ref="shapesBtn"
                        @click="const r = $refs.shapesBtn.getBoundingClientRect(); shapesCoords = { top: r.top + window.scrollY, left: r.left + window.scrollX - 288 - 16 }; shapesOpen = !shapesOpen"
                        class="sidebar-btn"
                        :class="{
                'text-accent-500 bg-accent-100/50 dark:bg-chip/50': shapesOpen && config.plotType !== 'polar',
                'animate-pulse ring-2 ring-accent-500/50 text-accent-500 bg-accent-50 dark:bg-chip': placementMode,
                'opacity-30 cursor-not-allowed pointer-events-none': config.plotType === 'polar'
            }"
                        :title="config.plotType === 'polar' ? 'Shapes not available in Polar mode' : 'Manage Shapes'">

                    <svg class="w-5 h-5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <g x-show="!placementMode">
                            <path stroke-width="2"
                                  d="M4 4h7v7H4zM13 13h7v7h-7zM4 15l5 5M15 4l5 5" />
                        </g>

                        <g x-show="placementMode === 'vline'">
                            <path d="M12 5v14"
                                  stroke-width="2.5"
                                  stroke-linecap="round" />
                        </g>

                        <g x-show="placementMode === 'hline'">
                            <path d="M5 12h14"
                                  stroke-width="2.5"
                                  stroke-linecap="round" />
                        </g>

                        <g x-show="placementMode === 'rect'">
                            <rect x="5"
                                  y="7"
                                  width="14"
                                  height="10"
                                  rx="1.5"
                                  stroke-width="2"
                                  fill="currentColor"
                                  fill-opacity="0.15" />
                        </g>
                    </svg>

                    <span class="text-xs font-black uppercase tracking-tighter"
                          x-text="placementMode ? placementMode : 'Shapes'"></span>
                </button>

                <template x-teleport="body">
                <div x-show="shapesOpen"
                     x-transition
                     @click.stop
                     @click.away="shapesOpen = false"
                     :style="`position:absolute;top:${shapesCoords.top}px;left:${shapesCoords.left}px;`"
                     class="w-72 bg-surface border border-line rounded-xl shadow-2xl p-4 z-200"
                     style="display:none;">

                    <p
                       class="text-base font-black uppercase text-ink-muted mb-4 tracking-widest border-b border-subtle pb-1">
                        Shapes Editor
                    </p>

                    <!-- selector -->
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button @click="setPlacementMode('vline')"
                                class="py-2.5 flex flex-col items-center bg-well border rounded-lg transition-all group"
                                :class="placementMode === 'vline' ? 'border-accent-500 ring-1 ring-accent-500/20' : 'border-line hover:border-accent-500 hover:bg-control'">

                            <svg class="w-5 h-5 mb-1 transition-colors duration-200"
                                 :class="placementMode === 'vline' ? 'text-accent-500' : 'text-ink-secondary group-hover:text-accent-500'"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor">
                                <path d="M12 5v14"
                                      stroke-width="2.5"
                                      stroke-linecap="round" />
                            </svg>

                            <span class="text-sm font-mono font-bold uppercase tracking-tight"
                                  :class="placementMode === 'vline' ? 'text-accent-500' : 'text-ink-secondary'">V-Line</span>
                        </button>

                        <button @click="setPlacementMode('hline')"
                                class="py-2.5 flex flex-col items-center bg-well border rounded-lg transition-all group"
                                :class="placementMode === 'hline' ? 'border-accent-500 ring-1 ring-accent-500/20' : 'border-line hover:border-accent-500 hover:bg-control'">

                            <svg class="w-5 h-5 mb-1 transition-colors duration-200"
                                 :class="placementMode === 'hline' ? 'text-accent-500' : 'text-ink-secondary group-hover:text-accent-500'"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor">
                                <path d="M5 12h14"
                                      stroke-width="2.5"
                                      stroke-linecap="round" />
                            </svg>

                            <span class="text-sm font-mono font-bold uppercase tracking-tight"
                                  :class="placementMode === 'hline' ? 'text-accent-500' : 'text-ink-secondary'">H-Line</span>
                        </button>

                        <button @click="setPlacementMode('rect')"
                                class="py-2.5 flex flex-col items-center bg-well border rounded-lg transition-all group"
                                :class="placementMode === 'rect' ? 'border-accent-500 ring-1 ring-accent-500/20' : 'border-line hover:border-accent-500 hover:bg-control'">

                            <svg class="w-5 h-5 mb-1 transition-colors duration-200"
                                 :class="placementMode === 'rect' ? 'text-accent-500' : 'text-ink-secondary group-hover:text-accent-500'"
                                 viewBox="0 0 24 24"
                                 fill="currentColor"
                                 fill-opacity="0.15"
                                 stroke="currentColor">
                                <rect x="5"
                                      y="7"
                                      width="14"
                                      height="10"
                                      rx="1.5"
                                      stroke-width="2" />
                            </svg>

                            <span class="text-sm font-mono font-bold uppercase tracking-tight"
                                  :class="placementMode === 'rect' ? 'text-accent-500' : 'text-ink-secondary'">Rect</span>
                        </button>
                    </div>

                    <!-- cancel button -->
                    <button x-show="placementMode"
                            @click="placementMode = null; rectStart = null"
                            class="w-full mb-4 p-2 bg-danger-500/10 hover:bg-danger-500 border border-danger-500/20 rounded-lg transition-all group flex items-center justify-center gap-2">

                        <svg class="w-3 h-3 text-danger-500 group-hover:text-white transition-colors"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="3"
                                  d="M6 18L18 6M6 6l12 12" />
                        </svg>

                        <p
                           class="text-sm font-black text-danger-500 group-hover:text-white uppercase tracking-widest transition-colors">
                            Cancel <span x-text="placementMode"></span> Mode
                        </p>
                    </button>

                    <!-- editor -->
                    {% from 'partials/trial_viewer/_macros.html' import color_picker %}
                    <template x-if="shapeDraft">
                        <div class="mb-6 p-3 bg-accent-500/5 border border-accent-500/20 rounded-lg space-y-3">
                            <p class="text-sm font-bold text-accent-500 uppercase"
                               x-text="shapeEditIndex !== null ? 'Edit Shape' : 'New Shape'"></p>
                            {{ color_picker('shapeDraft.color', 'shapePicker', 'Color', width=240) }}

                            <!-- location -->
                            <div class="grid grid-cols-2 gap-2">
                                <div x-show="shapeDraft.type === 'vline' || shapeDraft.type === 'rect'"
                                     class="flex items-center gap-2">
                                    <label class="text-xs font-mono text-ink-muted shrink-0"
                                           x-text="shapeDraft.type === 'rect' ? 'X0:' : 'X:'"></label>
                                    <div
                                         class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                        <input type="number"
                                               step="any"
                                               :value="shapeDraft.x0"
                                               @change="shapeDraft.x0 = evalMathExpr($event.target.value) ?? shapeDraft.x0"
                                               @keydown.enter="saveShape()"
                                               @keydown.escape="cancelShapeDraft()"
                                               class="number-input w-full py-1 text-sm" />
                                    </div>
                                </div>
                                <div x-show="shapeDraft.type === 'hline' || shapeDraft.type === 'rect'"
                                     class="flex items-center gap-2">
                                    <label class="text-xs font-mono text-ink-muted shrink-0"
                                           x-text="shapeDraft.type === 'rect' ? 'Y0:' : 'Y:'"></label>
                                    <div
                                         class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                        <input type="number"
                                               step="any"
                                               :value="shapeDraft.y0"
                                               @change="shapeDraft.y0 = evalMathExpr($event.target.value) ?? shapeDraft.y0"
                                               @keydown.enter="saveShape()"
                                               @keydown.escape="cancelShapeDraft()"
                                               class="number-input w-full py-1 text-sm" />
                                    </div>
                                </div>
                                <div x-show="shapeDraft.type === 'rect'"
                                     class="flex items-center gap-2">
                                    <label class="text-xs font-mono text-ink-muted shrink-0">X1:</label>
                                    <div
                                         class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                        <input type="number"
                                               step="any"
                                               :value="shapeDraft.x1"
                                               @change="shapeDraft.x1 = evalMathExpr($event.target.value) ?? shapeDraft.x1"
                                               @keydown.enter="saveShape()"
                                               @keydown.escape="cancelShapeDraft()"
                                               class="number-input w-full py-1 text-sm" />
                                    </div>
                                </div>
                                <div x-show="shapeDraft.type === 'rect'"
                                     class="flex items-center gap-2">
                                    <label class="text-xs font-mono text-ink-muted shrink-0">Y1:</label>
                                    <div
                                         class="flex items-center bg-surface-inset border border-inset rounded-md shadow-sm flex-1">
                                        <input type="number"
                                               step="any"
                                               :value="shapeDraft.y1"
                                               @change="shapeDraft.y1 = evalMathExpr($event.target.value) ?? shapeDraft.y1"
                                               @keydown.enter="saveShape()"
                                               @keydown.escape="cancelShapeDraft()"
                                               class="number-input w-full py-1 text-sm" />
                                    </div>
                                </div>
                            </div>

                            <!-- line style -->
                            <div class="space-y-1 relative"
                                 x-data="{ dOpen: false }">
                                <label class="text-xs font-bold text-ink-secondary uppercase">Line Style</label>
                                <button @click="dOpen = !dOpen"
                                        @click.away="dOpen = false"
                                        class="{{ dropdown_trigger_sm }}">
                                    <span
                                          x-text="(shapeDraft.dash || 'solid').charAt(0).toUpperCase() + (shapeDraft.dash || 'solid').slice(1)"></span>
                                    <svg class="w-3 h-3 text-icon-strong shrink-0 transition-transform duration-200"
                                         :class="dOpen ? 'rotate-180' : ''"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="3"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>
                                <div x-show="dOpen"
                                     x-transition
                                     class="{{ dropdown_panel }}">
                                    <template x-for="opt in opts.dash">
                                        <button @click="shapeDraft.dash = opt; dOpen = false"
                                                class="{{ dropdown_option }}"
                                                :class="(shapeDraft.dash || 'solid') === opt ? 'bg-accent-500 text-white font-bold' : 'text-ink-body hover:bg-control'"
                                                x-text="opt.charAt(0).toUpperCase() + opt.slice(1)"></button>
                                    </template>
                                </div>
                            </div>

                            <input type="text"
                                   x-model="shapeDraft.label"
                                   placeholder="Add a label..."
                                   @keydown.enter="saveShape()"
                                   @keydown.escape="cancelShapeDraft()"
                                   class="input-field w-full shadow-sm px-2 py-1.5" />
                            <div class="flex justify-end gap-2">
                                <button @click="cancelShapeDraft()"
                                        class="text-xs font-bold text-ink-muted hover:text-ink-body uppercase">Cancel</button>
                                <button @click="saveShape()"
                                        class="text-xs font-bold text-accent-500 hover:text-accent-600 uppercase"
                                        x-text="shapeEditIndex !== null ? 'Update' : 'Save'"></button>
                            </div>
                        </div>
                    </template>

                    <!-- list of shapes -->
                    <div class="space-y-2 max-h-64 overflow-y-auto pr-1 custom-scrollbar">
                        <template x-for="(s, index) in config.shapes"
                                  :key="index">
                            <div
                                 class="group bg-well dark:bg-well/40 border border-subtle rounded-lg p-2.5 transition-colors hover:border-accent-500/30">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex items-start gap-3 flex-1 min-w-0">
                                        <div class="mt-1 shrink-0"
                                             :style="`color: ${s.color}`">
                                            <svg class="w-4 h-4"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path x-show="s.type === 'vline'"
                                                      d="M12 5v14"
                                                      stroke-width="2.5"
                                                      stroke-linecap="round" />
                                                <path x-show="s.type === 'hline'"
                                                      d="M5 12h14"
                                                      stroke-width="2.5"
                                                      stroke-linecap="round" />
                                                <rect x-show="s.type === 'rect'"
                                                      x="5"
