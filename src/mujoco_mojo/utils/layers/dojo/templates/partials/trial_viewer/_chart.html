                                                      y="7"
                                                      width="14"
                                                      height="10"
                                                      rx="1.5"
                                                      stroke-width="2"
                                                      fill="currentColor"
                                                      fill-opacity="0.1" />
                                            </svg>
                                        </div>
                                        <div class="min-w-0">
                                            <p class="text-sm font-bold text-ink-strong truncate"
                                               x-text="s.label || s.type.toUpperCase()"></p>
                                            <p class="text-xs font-mono text-ink-muted whitespace-nowrap"
                                               x-text="s.type === 'vline' ? `X: ${formatNum(s.x0)}` :
           s.type === 'hline' ? `Y: ${formatNum(s.y0)}` :
           `${formatNum(s.x0)}, ${formatNum(s.y0)} → ${formatNum(s.x1)}, ${formatNum(s.y1)}`"></p>
                                        </div>
                                    </div>

                                    <div
                                         class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button @click="startShapeEdit(index)"
                                                class="p-1 hover:text-accent-500 text-ink-muted">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-width="2"
                                                      d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                                            </svg>
                                        </button>
                                        <button @click="deleteShape(index)"
                                                class="p-1 hover:text-danger-500 text-ink-muted">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-linecap="round"
                                                      stroke-linejoin="round"
                                                      stroke-width="2.5"
                                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                </template>
            </div>
        </div>

        <!-- undo -->
        <div class="flex flex-col gap-2">
            <button @click="undo()"
                    :disabled="historyIndex <= 0"
                    class="sidebar-btn disabled:opacity-40 disabled:hover:bg-well"
                    :title="isMac ? 'Undo (⌘Z)' : 'Undo (Ctrl+Z)'">
                <svg class="w-5 h-5"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                </svg>
                <span class="text-xs font-black uppercase tracking-tighter">Undo</span>
            </button>
        </div>

        <!-- redo -->
        <div class="flex flex-col gap-2">
            <button @click="redo()"
                    :disabled="historyIndex >= historyStack.length - 1"
                    class="sidebar-btn disabled:opacity-40 disabled:hover:bg-well"
                    :title="isMac ? 'Redo (⌘⇧Z)' : 'Redo (Ctrl+Y)'">
                <svg class="w-5 h-5"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M21 10h-10a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6" />
                </svg><span class="text-xs font-black uppercase tracking-tighter">Redo</span>
            </button>
        </div>

        <!-- ── PROFILES ───────────────────────────────────────────────── -->
        <div class="flex flex-col gap-2">
            <div class="relative"
                 x-data="{ profilesCoords: { top: 0, left: 0 } }">
                <button x-ref="profilesBtn"
                        @click="const r = $refs.profilesBtn.getBoundingClientRect(); profilesCoords = { top: r.top + window.scrollY, left: r.left + window.scrollX - 288 - 16 }; profilesOpen = !profilesOpen; if (profilesOpen) loadProfiles()"
                        class="sidebar-btn"
                        :class="profilesOpen ? 'text-accent-500 bg-accent-100/50 dark:bg-chip/50' : ''"
                        title="Saved Profiles">
                    <svg class="w-5 h-5"
                         :class="profilesOpen ? 'text-accent-500' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5 3a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7.414A2 2 0 0020.414 7L17 3.586A2 2 0 0015.586 3H5z" />
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M8 21v-5a2 2 0 012-2h4a2 2 0 012 2v5M8 7h8" />
                    </svg>
                    <span class="text-xs font-black uppercase tracking-tighter">Profiles</span>
                </button>

                <template x-teleport="body">
                <div x-show="profilesOpen"
                     x-transition
                     @click.stop
                     @click.away="profilesOpen = false"
                     :style="`position:absolute;top:${profilesCoords.top}px;left:${profilesCoords.left}px;`"
                     class="w-72 bg-surface border border-line rounded-xl shadow-2xl p-4 z-200"
                     style="display:none;">

                    <div class="flex items-center justify-between mb-4 border-b border-subtle pb-1">
                        <p class="text-base font-black uppercase text-ink-muted tracking-widest">
                            Saved Profiles
                        </p>

                        <div class="group cursor-help relative">
                            <svg class="w-3.5 h-3.5 text-ink-muted group-hover:text-accent-500 dark:group-hover:text-accent-400 transition-colors duration-150"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2.5"
                                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>

                            <div class="tooltip-panel right-0 bottom-full top-auto mt-0 mb-2 w-72">
                                <p
                                   class="text-sm font-black uppercase text-ink-muted mb-3 tracking-widest border-b border-subtle pb-1">
                                    Saved Profiles
                                </p>
                                <div class="space-y-2 text-xs text-ink-body leading-relaxed">
                                    <p>
                                        Profiles save your entire <span
                                              class="font-bold text-icon-strong dark:text-white">plot
                                            configuration</span>: selected signals, x-axis, display settings, zoom,
                                        annotations, and shapes.
                                    </p>
                                    <p>
                                        Use <code class="text-accent-500 font-mono">folder/name</code> to organise
                                        profiles into sub-folders, e.g. <code
                                              class="text-accent-500 font-mono">arm-reach/baseline</code>. Folders are
                                        created automatically.
                                    </p>
                                    <p>
                                        Profiles are stored globally in <code
                                              class="text-accent-500 font-mono">~/.mujoco-mojo/profiles/</code> and are
                                        available across all workdirs.
                                    </p>
                                    <p>
                                        Loading a profile whose signals or axes are <span
                                              class="font-bold text-danger-500">not present in the current trial</span>
                                        will be rejected to prevent an invalid plot state.
                                    </p>
                                    <p class="text-ink-muted italic">
                                        Profiles with incompatible columns are marked with a <span
                                              class="text-warning-500 not-italic">⚠</span> warning icon.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Save new profile -->
                    <div class="mb-4"
                         x-data="{
                             get suggestion() {
                                 const v = profileNameDraft;
                                 if (!v) return '';
                                 const m = profiles.find(p => p.name.startsWith(v) && p.name !== v);
                                 if (!m) return '';
                                 const rem = m.name.slice(v.length);
                                 const sep = rem.indexOf('/');
                                 return sep === -1 ? m.name : v + rem.slice(0, sep + 1);
                             },
                             accept() { if (this.suggestion) profileNameDraft = this.suggestion; }
                         }">
                        <div class="flex gap-2">
                            <input id="profile-name-input"
                                   type="text"
                                   x-model="profileNameDraft"
                                   @keydown.tab.prevent="accept()"
                                   @keydown.enter.stop="saveProfile()"
                                   @keydown.escape.stop="profileNameDraft = ''"
                                   placeholder="name or folder/name"
                                   class="input-field flex-1 px-2 py-1.5" />
                            <button @click="saveProfile()"
                                    :disabled="!profileNameDraft.trim()"
                                    class="btn btn-primary text-xs font-black uppercase tracking-wide disabled:opacity-40 disabled:cursor-not-allowed">
                                Save
                            </button>
                        </div>
                        <!-- directory suggestion hint - space always reserved -->
                        <div class="mt-1 h-4.5 flex items-center gap-1.5 text-xs font-mono"
                             :class="suggestion ? 'visible' : 'invisible'">
                            <button @click="accept()"
                                    class="text-ink-muted hover:text-accent-500 truncate transition-colors"
                                    x-text="suggestion"></button>
                            <kbd>Tab</kbd>
                        </div>
                    </div>

                    <!-- Search -->
                    <div x-show="profiles.length > 0"
                         class="mb-2"
                         x-data="{
                             get searchSuggestion() {
                                 const v = profileSearch;
                                 if (!v) return '';
                                 const m = profiles.find(p => p.name.toLowerCase().startsWith(v.toLowerCase()) && p.name !== v);
                                 if (!m) return '';
                                 const rem = m.name.slice(v.length);
                                 const sep = rem.indexOf('/');
                                 return sep === -1 ? m.name : v + rem.slice(0, sep + 1);
                             },
                             acceptSearch() { if (this.searchSuggestion) profileSearch = this.searchSuggestion; }
                         }">
                        <div class="relative">
                            <svg class="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-ink-muted pointer-events-none"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
                            </svg>
                            <input type="text"
                                   x-model="profileSearch"
                                   @keydown.tab.prevent="acceptSearch()"
                                   @keydown.escape.stop="profileSearch = ''"
                                   placeholder="Filter profiles..."
                                   class="input-field w-full pl-7 pr-7 py-1.5 text-sm" />
                            <button x-show="profileSearch"
                                    type="button"
                                    @click="profileSearch = ''"
                                    class="absolute inset-y-0 right-2 flex items-center text-ink-muted hover:text-danger-500 transition-colors">
                                <svg class="w-3.5 h-3.5"
                                     fill="none"
                                     stroke="currentColor"
                                     viewBox="0 0 24 24">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="2.5"
                                          d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <!-- filter suggestion hint - space always reserved -->
                        <div class="mt-1 h-4.5 flex items-center gap-1.5 text-xs font-mono"
                             :class="searchSuggestion ? 'visible' : 'invisible'">
                            <button type="button"
                                    @click="acceptSearch()"
                                    class="text-ink-muted hover:text-accent-500 truncate transition-colors"
                                    x-text="searchSuggestion"></button>
                            <kbd>Tab</kbd>
                        </div>
                    </div>

                    <!-- Profile list -->
                    <div class="space-y-1 max-h-64 overflow-y-auto custom-scrollbar">
                        <template x-for="p in profiles.filter(p => !profileSearch || p.name.toLowerCase().includes(profileSearch.toLowerCase()))"
                                  :key="p.name">
                            <div
                                 class="flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-chip dark:hover:bg-chip/50 group">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <p class="text-sm font-mono font-bold text-ink-strong flex items-baseline min-w-0 overflow-hidden"
                                           :title="p.name">
                                            <template x-if="p.name.includes('/')">
                                                <span class="font-normal text-ink-muted truncate"
                                                      x-text="p.name.substring(0, p.name.lastIndexOf('/') + 1)"></span>
                                            </template>
                                            <span class="flex-1 min-w-0 truncate"
                                                  x-text="p.name.includes('/') ? p.name.substring(p.name.lastIndexOf('/') + 1) : p.name"></span>
                                        </p>
                                        <template x-if="profileWarnings[p.name]">
                                            <span :title="'Not in this trial: ' + (profileWarnings[p.name] || []).join(', ')"
                                                  class="text-warning-500 shrink-0 cursor-help">
                                                <svg class="w-3.5 h-3.5"
                                                     fill="none"
                                                     stroke="currentColor"
                                                     viewBox="0 0 24 24">
                                                    <path stroke-linecap="round"
                                                          stroke-linejoin="round"
                                                          stroke-width="2"
                                                          d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                                                </svg>
                                            </span>
                                        </template>
                                    </div>
                                    <p class="text-xs text-ink-muted font-mono"
                                       x-text="notifTimeAgo(p.modified, $store.dojo.notifTick)"></p>
                                </div>
                                <button @click="loadProfile(p.name)"
                                        class="text-xs px-2 py-1 rounded bg-accent-500/10 text-accent-500 hover:bg-accent-500 hover:text-white font-bold transition-colors shrink-0 uppercase">
                                    Load
                                </button>
                                <button @click="deleteProfile(p.name)"
                                        class="text-ink-muted hover:text-danger-500 transition-colors shrink-0 opacity-0 group-hover:opacity-100">
                                    <svg class="w-3.5 h-3.5"
                                         fill="none"
                                         stroke="currentColor"
                                         viewBox="0 0 24 24">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              stroke-width="3"
                                              d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                        </template>

                        <p x-show="profiles.length === 0"
                           class="text-xs font-mono italic text-ink-disabled text-center py-4">
                            No profiles saved yet
                        </p>
                        <p x-show="profiles.length > 0 && profileSearch && !profiles.some(p => p.name.toLowerCase().includes(profileSearch.toLowerCase()))"
                           class="text-xs font-mono italic text-ink-disabled text-center py-4">
                            No profiles match "<span x-text="profileSearch"></span>"
                        </p>
                    </div>
                </div>
                </template>
            </div>
        </div>

        <!-- ── DOWNLOAD OPTIONS ─────────────────────────────────────── -->
        <div class="flex flex-col gap-2">
            <div class="relative"
                 x-data="{ downloadCoords: { top: 0, left: 0 } }">
                <button x-ref="downloadBtn"
                        @click="const r = $refs.downloadBtn.getBoundingClientRect(); downloadCoords = { top: r.top + window.scrollY, left: r.left + window.scrollX - 192 - 16 }; downloadOpen = !downloadOpen"
                        class="sidebar-btn disabled:opacity-40 disabled:hover:bg-well"
                        :class="downloadOpen ? 'text-accent-500 bg-accent-100/50 dark:bg-chip/50' : ''"
                        title="Download Data or Image">
                    <svg class="w-5 h-5"
                         :class="downloadOpen ? 'text-accent-500' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="text-xs font-black uppercase tracking-tighter">Export</span>
                </button>

                <template x-teleport="body">
                <div x-show="downloadOpen"
                     x-transition
                     @click.stop
                     @click.away="downloadOpen = false"
                     :style="`position:absolute;top:${downloadCoords.top}px;left:${downloadCoords.left}px;`"
                     class="w-48 bg-surface border border-line rounded-xl shadow-2xl p-3 z-200"
                     style="display:none;">

                    <p
                       class="text-base font-black uppercase text-ink-muted mb-3 tracking-widest border-b border-subtle pb-1">
                        Export Options</p>

                    <div class="space-y-1">
                        <p class="text-sm font-bold text-ink-secondary uppercase px-2 mb-1">Capture Plot</p>

                        <button @click="downloadPlot('svg', 1)"
                                class="w-full text-left px-2 py-1.5 text-xs font-mono font-bold text-ink-body hover:bg-control hover:text-accent-500 rounded transition-all flex items-center justify-between group">
                            SVG Vector
                            <span class="text-xs opacity-50 group-hover:opacity-100">INF</span>
                        </button>

                        <div class="my-1 border-t border-subtle dark:border-subtle/50"></div>

                        <button @click="downloadPlot('png', 1.5)"
                                class="w-full text-left px-2 py-1.5 text-xs font-mono font-bold text-ink-body hover:bg-control hover:text-accent-500 rounded transition-all flex items-center justify-between group">
                            PNG Image
                            <span
                                  class="text-xs bg-well px-1 rounded text-ink-muted group-hover:text-accent-500">1080p</span>
                        </button>

                        <button @click="downloadPlot('png', 3)"
                                class="w-full text-left px-2 py-1.5 text-xs font-mono font-bold text-ink-body hover:bg-control hover:text-accent-500 rounded transition-all flex items-center justify-between group">
                            PNG High-DPI
                            <span
                                  class="text-xs bg-accent-500/10 text-accent-600 px-1 rounded group-hover:bg-accent-500 group-hover:text-white">4K</span>
                        </button>

                        <div class="my-1 border-t border-subtle dark:border-subtle/50"></div>

                        <button @click="downloadPlot('jpg', 1.5)"
                                class="w-full text-left px-2 py-1.5 text-xs font-mono font-bold text-ink-body hover:bg-control hover:text-accent-500 rounded transition-all flex items-center justify-between group">
                            JPG Compressed
                            <span class="text-xs opacity-50">1080p</span>
                        </button>

                        <div class="my-2 border-t border-subtle"></div>
