<!-- ══════════════════════════════════════════════════════════════════
         LAB TRIGGER  ·  _lab_trigger.html
         Flask button that opens the Signal Lab overlay.
         Included in _header.html (top bar of the trial viewer).
         ══════════════════════════════════════════════════════════════════ -->

<button @click="labOpen = true"
        class="btn-icon"
        :class="labOpen ? 'bg-violet-500/10 border-violet-500/50 text-violet-400' : 'btn-ghost'"
        title="Open Signal Lab">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6m-6 0v5L3 20h18L15 8V3"/>
        <path stroke-linecap="round" stroke-width="1.25" d="M5.5 16h13"/>
        <circle cx="10" cy="13" r="1" fill="currentColor" stroke="none"/>
        <circle cx="13.5" cy="11" r="0.85" fill="currentColor" stroke="none"/>
    </svg>
</button>
