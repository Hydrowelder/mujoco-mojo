            <!-- icon -->
            <svg class="w-5 h-5 text-cyan-600 dark:text-cyan-400"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.75"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 3h6m-6 0v5L3 20h18L15 8V3" />
                <path stroke-linecap="round"
                      stroke-width="1.25"
                      d="M5.5 16h13" />
                <circle cx="10"
                        cy="13"
                        r="1"
                        fill="currentColor"
                        stroke="none" />
                <circle cx="13.5"
                        cy="11"
                        r="0.85"
                        fill="currentColor"
                        stroke="none" />
            </svg>
            <span class="hidden sm:inline text-base font-black uppercase tracking-widest text-slate-700 dark:text-slate-300">Signal Lab</span>
            <span class="hidden sm:inline text-sm font-mono text-slate-400 dark:text-slate-500">{{ trial_id }}</span>
        </div>

        <!-- middle: action buttons (scrollable so adding more buttons doesn't crowd the bar) -->
        <div class="flex flex-1 items-center gap-1.5 sm:gap-2 overflow-x-auto overflow-y-hidden custom-scrollbar min-w-0">
            <!-- new graph -->
            <button @click="if (!window.mojoLabHasUnsavedChanges?.() || confirm('Discard unsaved changes?')) { labName = ''; try{localStorage.removeItem('mojo:lab:name');localStorage.removeItem('mojo:lab:draft');}catch{}; mojoLabClear(); window.mojoLabMarkSaved?.(); }"
                    class="btn btn-ghost text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1.5 shrink-0"
                    title="New — clear graph and reset name">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 4v16m8-8H4" />
                </svg>
                <span class="hidden xl:inline">New</span>
            </button>
            <!-- refresh validation -->
            <button @click="refreshLabValidation()"
                    class="btn btn-ghost text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1.5 shrink-0"
                    title="Refresh validation - recheck all lab dependencies against the current trial">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span class="hidden xl:inline">Refresh</span>
            </button>
            <!-- fit view -->
            <button @click="mojoLabFitView()"
                    class="btn btn-ghost text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1.5 shrink-0"
                    title="Fit view to all nodes (Ctrl+Shift+F)">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span class="hidden xl:inline">Fit</span>
            </button>
            <!-- auto-arrange -->
            <button @click="mojoLabArrange()"
                    class="btn btn-ghost text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1.5 shrink-0"
                    title="Auto-arrange nodes (Ctrl+Shift+A)">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M3 6h18M3 12h18M3 18h18" />
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M17 3l4 3-4 3" />
                </svg>
                <span class="hidden xl:inline">Arrange</span>
            </button>
            <!-- clear -->
            <button @click="if(confirm('Clear the graph?')) mojoLabClear()"
                    class="btn btn-ghost text-sm font-bold text-rose-600 dark:text-rose-400 border-rose-500/40 dark:border-rose-500/30 hover:bg-rose-500/10 uppercase flex items-center gap-1.5 shrink-0">
                <svg class="w-3.5 h-3.5"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
                <span class="hidden xl:inline">Clear</span>
            </button>
        </div>

        <!-- right section: shrink-0 — name+save, load, close are all outside the overflow-hidden
             scroll area so their absolute-positioned panels (hints, dropdowns) aren't clipped -->
        <div class="shrink-0 flex items-center gap-1.5">
            <!-- name + save (with tab-autocomplete for folder paths) -->
            <div x-data="{
                focused: false,
                get suggestion() {
                    if (!this.focused) return '';
                    const v = labName;
                    if (!v) return '';
                    const m = labSchemas.find(l => l.name.startsWith(v) && l.name !== v);
                    if (!m) return '';
                    const rem = m.name.slice(v.length);
                    const sep = rem.indexOf('/');
                    return sep === -1 ? m.name : v + rem.slice(0, sep + 1);
                },
                accept() { if (this.suggestion) labName = this.suggestion; }
            }"
                 class="relative flex items-center gap-1.5">
                <input id="lab-name-input"
                       x-model="labName"
                       @mousedown.stop
                       @focus="focused = true"
                       @blur="setTimeout(() => focused = false, 150)"
                       @keydown.tab.prevent="accept()"
                       @keydown.enter="labName && saveLabGraph(labName, mojoLabSerialize())"
                       @keydown.escape.stop="labName = ''"
                       placeholder="name or folder/name…"
                       class="h-8 px-2 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-xs font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-cyan-500 w-20 md:w-28 xl:w-44" />
                <button @click="labName && saveLabGraph(labName, mojoLabSerialize())"
                        :disabled="!labName"
                        class="btn btn-ghost text-sm font-bold text-cyan-600 dark:text-cyan-400 border-cyan-500/40 dark:border-cyan-500/30 hover:bg-cyan-500/10 uppercase disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M5 3a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7.414A2 2 0 0020.414 7L17 3.586A2 2 0 0015.586 3H5z" />
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M8 21v-5a2 2 0 012-2h4a2 2 0 012 2v5M8 7h8"></path>
                    </svg>
                    <span class="hidden xl:inline">Save</span>
                </button>
                <!-- suggestion hint — rendered outside overflow-y-hidden so it's not clipped -->
                <div class="absolute top-full left-0 mt-0.5 flex items-center gap-1.5 text-[10px] font-mono px-2 py-0.5 rounded-b bg-slate-50/95 dark:bg-slate-950/95 border border-t-0 border-slate-200 dark:border-slate-800 shadow-sm z-[700]"
                     :class="suggestion ? 'visible' : 'invisible'">
                    <button @click="accept()"
                            class="text-slate-400 hover:text-cyan-500 truncate transition-colors"
                            x-text="suggestion"></button>
                    <kbd class="px-1 py-0.5 rounded border border-slate-300 dark:border-slate-600 text-slate-400 dark:text-slate-500 text-[9px]">Tab</kbd>
                </div>
            </div>
            <!-- load dropdown -->
            <div class="relative"
                 x-data="{
                     open: false,
                     labSearch: '',
                     get _filtered() {
                         const q = this.labSearch.toLowerCase();
                         return labSchemas.filter(l => !q || l.name.toLowerCase().includes(q));
                     },
                     get _suggestion() {
                         const v = this.labSearch;
                         if (!v) return '';
                         const m = labSchemas.find(l => l.name.toLowerCase().startsWith(v.toLowerCase()) && l.name !== v);
                         if (!m) return '';
                         const rem = m.name.slice(v.length);
                         const sep = rem.indexOf('/');
                         return sep === -1 ? m.name : m.name.slice(0, v.length + sep + 1);
                     },
                     acceptSearch() { if (this._suggestion) this.labSearch = this._suggestion; },
                     loadSingle() {
                         const r = this._filtered;
                         if (r.length !== 1) return;
                         const lab = r[0];
                         fetch(`/mosaic/api/lab/${lab.name.split('/').map(encodeURIComponent).join('/')}`)
                             .then(resp => resp.json())
                             .then(g => {
                                 labGraph = g; labName = lab.name;
                                 try { localStorage.setItem('mojo:lab:draft', JSON.stringify(g)); localStorage.setItem('mojo:lab:name', lab.name); } catch {}
                                 mojoLabClearHistory();
                                 mojoLabInit(document.getElementById('lab-canvas'), columns, g);
                                 mojoLabSetContext(columns, labSchemas, lab.name);
                                 this.open = false; this.labSearch = '';
                             });
                     }
                 }"
                 @click.outside="open = false; labSearch = ''">
                <button @click="open = !open; if(open) loadLabSchemas(); else labSearch = ''"
                        class="btn btn-ghost text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    <span class="hidden xl:inline">Load</span>
                    <svg class="w-3 h-3 transition-transform"
                         :class="open ? 'rotate-180' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-width="3"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div x-show="open"
                     x-transition
                     class="absolute right-0 top-full mt-1 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg shadow-2xl z-[700] flex flex-col max-h-80"
                     style="display:none;">
                    <!-- search + tab-complete -->
                    <div class="px-2 pt-2 pb-1.5 border-b border-slate-100 dark:border-slate-800 shrink-0">
                        <div class="relative">
                            <input type="text"
                                   x-model="labSearch"
                                   @keydown.stop
                                   @keydown.tab.prevent="acceptSearch()"
                                   @keydown.enter="loadSingle()"
                                   placeholder="Search labs…"
                                   class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded px-2 pr-6 py-1 text-xs font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
                            <button x-show="labSearch"
                                    @click="labSearch = ''"
                                    type="button"
                                    class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                <svg class="w-3 h-3"
                                     fill="none"
                                     stroke="currentColor"
                                     viewBox="0 0 24 24">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="3"
                                          d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <!-- search suggestion hint - space always reserved -->
                        <div class="mt-1 h-[1.125rem] flex items-center gap-1.5 text-[10px] font-mono"
                             :class="_suggestion ? 'visible' : 'invisible'">
                            <button @click="acceptSearch()"
                                    class="text-slate-400 hover:text-cyan-500 truncate transition-colors"
                                    x-text="_suggestion"></button>
                            <kbd class="px-1 py-0.5 rounded border border-slate-300 dark:border-slate-600 text-slate-400 dark:text-slate-500 text-[9px]">Tab</kbd>
                        </div>
                    </div>
                    <!-- list -->
                    <div class="overflow-y-auto custom-scrollbar flex-1">
                        <template x-for="lab in _filtered"
                                  :key="lab.name">
                            <div class="border-b border-slate-100 dark:border-slate-800 last:border-none hover:bg-slate-50 dark:hover:bg-slate-800 group"
                                 x-data="{ infoOpen: false }">
                                <div class="flex items-center justify-between px-3 py-2"
                                     :class="!lab.valid ? 'opacity-60' : ''">
                                    <button @click="fetch(`/mosaic/api/lab/${lab.name.split('/').map(encodeURIComponent).join('/')}`).then(r=>r.json()).then(g=>{ labGraph=g; labName=lab.name; try{localStorage.setItem('mojo:lab:draft',JSON.stringify(g));localStorage.setItem('mojo:lab:name',lab.name);}catch{} mojoLabClearHistory(); mojoLabInit(document.getElementById('lab-canvas'), columns, g); mojoLabSetContext(columns, labSchemas, lab.name); open=false; labSearch=''; })"
                                            class="flex-1 text-left text-xs font-mono min-w-0">
                                        <div class="flex items-center gap-1.5 min-w-0">
                                            <span :class="lab.valid ? 'text-slate-700 dark:text-slate-300' : 'text-slate-400 dark:text-slate-500'"
                                                  class="truncate"
                                                  x-text="lab.name"></span>
                                            <!-- template indicator -->
                                            <span x-show="lab.is_template"
                                                  title="Template — contains Template In/Out ports"
                                                  class="shrink-0 text-[9px] font-sans font-semibold px-1 py-0.5 rounded bg-fuchsia-100 dark:bg-fuchsia-950 text-fuchsia-600 dark:text-fuchsia-400">tmpl</span>
                                            <!-- circular dependency -->
                                            <span x-show="!lab.valid && lab.missing.some(c => c.startsWith('Lab/'))"
                                                  title="Contains a circular lab dependency"
                                                  class="shrink-0 flex items-center">
                                                <svg class="w-3 h-3 text-amber-500"
                                                     fill="none"
                                                     stroke="currentColor"
                                                     stroke-width="2"
                                                     viewBox="0 0 24 24">
                                                    <path stroke-linecap="round"
                                                          stroke-linejoin="round"
                                                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                                </svg>
                                            </span>
                                            <!-- signal not in trial -->
                                            <span x-show="!lab.valid && lab.missing.some(c => !c.startsWith('Lab/'))"
                                                  title="Contains signals not in this trial"
                                                  class="shrink-0 flex items-center">
                                                <svg class="w-3 h-3 text-amber-500"
                                                     fill="none"
                                                     stroke="currentColor"
                                                     stroke-width="2"
                                                     viewBox="0 0 24 24">
                                                    <circle cx="12"
                                                            cy="12"
                                                            r="9" />
                                                    <path stroke-linecap="round"
                                                          d="M4.929 4.929l14.142 14.142" />
                                                </svg>
                                            </span>
                                        </div>
                                        <div class="text-slate-400 dark:text-slate-600 text-[10px]"
                                             x-text="relTime(lab.modified)"></div>
                                    </button>
                                    <!-- action icons -->
                                    <div class="flex items-center gap-0.5 ml-2 shrink-0">
                                        <button @click.stop="infoOpen = !infoOpen"
                                                x-show="lab.signal_in_columns.length || lab.outputs.length"
                                                :class="infoOpen ? 'text-cyan-500 opacity-100' : 'text-slate-400 opacity-0 group-hover:opacity-100'"
                                                class="hover:text-cyan-500 transition-all p-0.5">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <circle cx="12"
                                                        cy="12"
                                                        r="9"
                                                        stroke-width="1.5" />
                                                <path stroke-linecap="round"
                                                      stroke-width="1.75"
                                                      d="M12 16v-4" />
                                                <circle cx="12"
                                                        cy="8.5"
                                                        r="0.6"
                                                        fill="currentColor"
                                                        stroke="none" />
                                            </svg>
                                        </button>
                                        <button @click.stop="if(confirm(`Delete '${lab.name}'?`)) deleteLabGraph(lab.name)"
                                                class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 transition-all p-0.5">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-width="3"
                                                      stroke-linecap="round"
                                                      stroke-linejoin="round"
                                                      d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <!-- inline info panel - no z-order issues -->
                                <div x-show="infoOpen"
                                     class="px-3 pb-2.5 text-[10px] font-mono"
                                     style="display:none;">
                                    <template x-if="lab.signal_in_columns.length">
                                        <div class="mb-1.5">
                                            <div class="text-slate-400 dark:text-slate-500 uppercase tracking-wider text-[9px] mb-1 font-sans font-semibold">Inputs</div>
                                            <template x-for="col in lab.signal_in_columns"
                                                      :key="col">
                                                <div class="flex items-center gap-1 truncate"
                                                     :class="lab.missing.includes(col) ? 'text-amber-500' : 'text-slate-600 dark:text-slate-300'">
                                                    <span class="truncate"
                                                          x-text="col"></span>
                                                    <span x-show="lab.missing.includes(col)"
                                                          class="shrink-0 text-[9px] font-sans"
                                                          x-text="col.startsWith('Lab/') ? 'circular ref' : 'not in trial'"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="lab.outputs.length">
                                        <div>
                                            <div class="text-slate-400 dark:text-slate-500 uppercase tracking-wider text-[9px] mb-1 font-sans font-semibold">Outputs</div>
                                            <template x-for="out in lab.outputs"
                                                      :key="out">
                                                <div class="text-cyan-600 dark:text-cyan-400 truncate"
                                                     x-text="out"></div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="lab.is_template && (lab.template_inputs.length || lab.template_outputs.length)">
                                        <div class="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800">
                                            <div class="text-fuchsia-500 dark:text-fuchsia-400 uppercase tracking-wider text-[9px] mb-1 font-sans font-semibold">Template ports</div>
                                            <template x-if="lab.template_inputs.length">
                                                <div class="mb-0.5">
                                                    <span class="text-slate-400 dark:text-slate-500">in: </span>
                                                    <span class="text-fuchsia-600 dark:text-fuchsia-400"
                                                          x-text="lab.template_inputs.join(', ')"></span>
                                                </div>
                                            </template>
                                            <template x-if="lab.template_outputs.length">
                                                <div>
                                                    <span class="text-slate-400 dark:text-slate-500">out: </span>
                                                    <span class="text-fuchsia-600 dark:text-fuchsia-400"
                                                          x-text="lab.template_outputs.join(', ')"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <p x-show="_filtered.length === 0"
                           class="px-3 py-2 text-xs font-mono italic text-slate-500 dark:text-slate-500">
                            <span x-text="labSchemas.length === 0 ? 'No saved labs yet' : 'No matching labs'"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- close: always visible, pinned to the right (shrink-0) -->
        <button @click="if (!window.mojoLabHasUnsavedChanges?.() || confirm('Discard unsaved changes?')) labOpen = false"
                class="shrink-0 btn-icon btn-ghost"
                title="Close (Esc)">
            <svg class="w-5 h-5"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- canvas area -->
    <div class="flex-1 relative overflow-hidden"
         @mojo:lab-pick-column.document="nodePickingColumn = $event.detail.nodeId; nodeColSearch = ''"
         @mojo:lab-pick-template.document="nodePickingTemplate = $event.detail.nodeId"
         x-init="
             const _labInitCanvas = () => $nextTick(() => {
                 const el = document.getElementById('lab-canvas');
                 if (el) mojoLabInit(el, columns, labGraph);
                 mojoLabSetContext(columns, labSchemas, labName);
             });
             $watch('labOpen', (open) => {
                 try { localStorage.setItem('mojo:lab:open', open ? '1' : '0'); } catch {}
                 if (!open) {
                     labGraph = mojoLabSerialize();
                     try {
                         if (labGraph) localStorage.setItem('mojo:lab:draft', JSON.stringify(labGraph));
                         if (labName) localStorage.setItem('mojo:lab:name', labName);
                     } catch {}
                 }
                 if (open) _labInitCanvas();
             });
             if (labOpen) _labInitCanvas();
             $watch('labSchemas', (s) => { if (labOpen) mojoLabSetContext(columns, s, labName); });
             $watch('labName', (n) => { if (labOpen) mojoLabSetContext(columns, labSchemas, n); });
         ">
        <canvas id="lab-canvas"
                tabindex="0"
                class="absolute inset-0 outline-none"
                @change="labGraph = mojoLabSerialize()">
        </canvas>
    </div>

    <!-- ── Column picker — fixed so it escapes the overflow-hidden canvas container ── -->
    <div x-show="nodePickingColumn !== null"
         @click.self="nodePickingColumn = null; nodeColSearch = ''"
         class="fixed inset-0 z-[600] flex items-start justify-center pt-16 bg-slate-950/80 backdrop-blur-sm"
         style="display:none;">
        <div class="panel w-80 space-y-3 max-h-[70vh] flex flex-col">

            <!-- header -->
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-700 shrink-0">
                <p class="text-sm font-black uppercase text-slate-700 dark:text-slate-300 tracking-widest">Select Signal</p>
                <button @click="nodePickingColumn = null; nodeColSearch = ''"
                        class="text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2.5"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- search -->
            <div class="relative shrink-0">
                <input type="text"
                       x-model="nodeColSearch"
                       placeholder="Filter signals…"
                       class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 pr-7 py-1.5 text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-cyan-500" />
                <button x-show="nodeColSearch"
                        type="button"
                        @click="nodeColSearch = ''"
                        class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                    <svg class="w-3 h-3"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="3"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- hierarchical segment drills -->
            <div class="flex flex-col gap-1.5 shrink-0">
                <template x-for="depth in getActiveLevels('nodeCol')"
                          :key="depth">
                    <div x-show="getSegmentsAtDepth('nodeCol', depth).length > 0"
                         class="flex gap-1 overflow-x-auto pb-0.5 custom-scrollbar">
                        <template x-for="seg in getSegmentsAtDepth('nodeCol', depth)"
                                  :key="seg">
                            <button @click="toggleRegexSegment('nodeCol', seg, depth)"
                                    :class="isSegmentActive('nodeCol', seg, depth)
                                        ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm'
                                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50'"
                                    class="shrink-0 px-2 py-0.5 rounded border text-xs font-mono transition-all"
                                    x-text="seg">
                            </button>
                        </template>
                    </div>
                </template>
                <!-- suffix quick filter -->
                <div x-show="getAvailableSuffixes('nodeCol').length > 0"
                     class="flex items-center gap-1 overflow-x-auto pb-0.5 custom-scrollbar">
                    <template x-for="sfx in getAvailableSuffixes('nodeCol')"
                              :key="sfx">
                        <button @click="toggleRegexSegment('nodeCol', sfx, 'suffix')"
                                :class="isSegmentActive('nodeCol', sfx, 'suffix')
                                    ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50'"
                                class="shrink-0 px-2 py-0.5 rounded border text-xs font-mono transition-all"
                                x-text="sfx">
                        </button>
                    </template>
                </div>
            </div>

            <!-- filtered column list -->
            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-0.5 min-h-0">
                <template x-for="col in getFilteredCols('nodeCol')"
                          :key="col">
                    <button @click="selectNodeColumn(col)"
                            :class="mojoLabIsCyclicInput && mojoLabIsCyclicInput(col)
                                ? 'text-amber-500 dark:text-amber-400 hover:bg-amber-500/10 line-through'
                                : 'text-slate-500 dark:text-slate-400 hover:bg-cyan-500/20 hover:text-cyan-700 dark:hover:text-cyan-200'"
                            :title="mojoLabIsCyclicInput && mojoLabIsCyclicInput(col) ? 'Would create a circular dependency' : ''"
                            class="w-full text-left px-2 py-1 text-sm font-mono rounded truncate transition-colors"
                            x-text="col">
                    </button>
                </template>
                <p x-show="getFilteredCols('nodeCol').length === 0"
                   class="px-2 py-2 text-sm font-mono italic text-slate-500 dark:text-slate-500">No matching signals</p>
            </div>
        </div>
    </div>

    <!-- ── Template picker — fixed so it escapes the overflow-hidden canvas container ── -->
    <div x-show="nodePickingTemplate !== null"
         x-data="{
             schemas: [],
             search: '',
             async _load() {
                 try {
                     const r = await fetch('/mosaic/api/lab');
                     const all = r.ok ? await r.json() : [];
                     this.schemas = all.filter(l => l.is_template);
                 } catch { this.schemas = []; }
             }
         }"
         x-init="$watch('nodePickingTemplate', v => { if (v !== null) { search = ''; _load(); } })"
         @click.self="nodePickingTemplate = null"
         class="fixed inset-0 z-[600] flex items-start justify-center pt-16 bg-slate-950/80 backdrop-blur-sm"
         style="display:none;">
        <div class="panel w-96 space-y-3 max-h-[70vh] flex flex-col">

            <!-- header -->
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-700 shrink-0">
                <p class="text-sm font-black uppercase text-slate-700 dark:text-slate-300 tracking-widest">Select Template</p>
                <button @click="nodePickingTemplate = null"
                        class="text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2.5"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- search -->
            <div class="relative shrink-0">
                <input type="text"
                       x-model="search"
                       placeholder="Filter templates…"
                       class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 pr-7 py-1.5 text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-fuchsia-500" />
                <button x-show="search"
                        type="button"
                        @click="search = ''"
                        class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                    <svg class="w-3 h-3"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="3"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- template list -->
            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-0.5 min-h-0">
                <template x-for="t in schemas.filter(s => !search || s.name.toLowerCase().includes(search.toLowerCase()))"
                          :key="t.name">
                    <button @click="selectNodeTemplate(t.name)"
                            class="w-full text-left px-2 py-2 rounded hover:bg-fuchsia-500/10 transition-colors group">
                        <div class="text-sm font-mono text-slate-600 dark:text-slate-300 group-hover:text-fuchsia-700 dark:group-hover:text-fuchsia-300 truncate"
                             x-text="t.name"></div>
                        <div class="flex gap-3 mt-0.5 text-[10px] font-mono text-slate-400 dark:text-slate-500">
                            <span x-show="t.template_inputs.length"
                                  x-text="'in: ' + t.template_inputs.join(', ')"></span>
                            <span x-show="t.template_outputs.length"
                                  x-text="'out: ' + t.template_outputs.join(', ')"></span>
                            <span x-show="!t.template_inputs.length && !t.template_outputs.length"
                                  class="italic">no ports defined</span>
                        </div>
                    </button>
                </template>
                <p x-show="schemas.filter(s => !search || s.name.toLowerCase().includes(search.toLowerCase())).length === 0"
                   class="px-2 py-2 text-sm font-mono italic text-slate-500 dark:text-slate-500">
                    <span x-text="schemas.length === 0 ? 'No labs with Template In/Out nodes yet' : 'No matching templates'"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- status bar -->
    <div class="h-8 shrink-0 flex items-center px-4 border-t border-slate-200 dark:border-slate-800 text-xs font-mono text-slate-500 dark:text-slate-500 select-none overflow-x-auto custom-scrollbar">
        <div class="flex items-center gap-6 whitespace-nowrap">
            <span>Right-click → add node</span>
            <span>Ctrl+Z undo · Ctrl+Y redo · Ctrl+S save · Del remove selected</span>
            <span>Ctrl+Shift+A arrange · Ctrl+Shift+F fit view</span>
            <span>Scroll to zoom · drag to pan</span>
        </div>
    </div>
</div>
