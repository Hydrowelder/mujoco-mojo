                       @keydown.escape.stop="labName = ''"
                       placeholder="name or folder/name…"
                       class="h-8 px-2 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-cyan-500 w-20 md:w-28 xl:w-44" />
                <button @click="labName && saveLabGraph(labName, mojoLabSerialize())"
                        :disabled="!labName"
                        class="btn btn-ghost text-sm font-bold text-cyan-600 dark:text-cyan-400 border-cyan-500/40 dark:border-cyan-500/30 hover:bg-cyan-500/10 uppercase disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M5 3a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7.414A2 2 0 0020.414 7L17 3.586A2 2 0 0015.586 3H5z" />
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M8 21v-5a2 2 0 012-2h4a2 2 0 012 2v5M8 7h8"></path>
                    </svg>
                    <span class="hidden sm:inline">Save</span>
                </button>
                <span class="lab-kbd-tip"
                      x-text="isMac ? '⌘S' : 'Ctrl+S'"></span>
                <!-- suggestion hint — rendered outside overflow-y-hidden so it's not clipped -->
                <div class="absolute top-full left-0 mt-0.5 flex items-center gap-1.5 text-sm font-mono px-2 py-0.5 rounded-b bg-slate-50/95 dark:bg-slate-950/95 border border-t-0 border-slate-200 dark:border-slate-800 shadow-sm z-[700]"
                     :class="suggestion ? 'visible' : 'invisible'">
                    <button @click="accept()"
                            class="text-slate-400 hover:text-cyan-500 truncate transition-colors"
                            x-text="suggestion"></button>
                    <kbd class="px-1 py-0.5 rounded border border-slate-300 dark:border-slate-600 text-slate-400 dark:text-slate-500 text-sm">Tab</kbd>
                </div>
            </div>
        </div>

        <!-- close: always visible, pinned to the right (shrink-0) -->
        <button @click="async () => { if (window.mojoLabHasUnsavedChanges?.()) { const ok = await window.mojoConfirm({title:'Unsaved changes',message:'Close the lab and discard unsaved changes?',confirmLabel:'Discard',cancelLabel:'Keep editing',variant:'warning'}); if(!ok) return; window.mojoLabRevertToSaved?.(); } labOpen=false; }"
                class="shrink-0 btn-icon btn-ghost"
                title="Close (Esc)">
            <svg class="w-5 h-5"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- tab bar -->
    <div class="shrink-0 flex items-stretch border-b border-slate-200 dark:border-slate-800 bg-slate-100/60 dark:bg-slate-900/60 min-h-[2.25rem]">
        <!-- scrollable tab strip -->
        <!-- x-init: single capture-phase listener handles both scroll-anchor prevention
             (preventDefault) and middle-click-to-close in one place. Alpine @mousedown.middle
             on x-for items is unreliable; data-tab-id lets us find the right tab from the
             container listener instead. -->
        <div class="flex items-stretch overflow-x-auto overflow-y-hidden custom-scrollbar flex-1 min-w-0 px-1 gap-0.5"
             x-data="{ _dragId: null, _overIdx: null }"
             x-init="
                 $el.addEventListener('mousedown', e => {
                     if (e.button !== 1) return;
                     e.preventDefault();
                     const tabEl = e.target.closest('[data-tab-id]');
                     if (tabEl && tabEl.dataset.tabId)
                         document.dispatchEvent(new CustomEvent('mojo:lab-close-tab', { detail: { tabId: tabEl.dataset.tabId } }));
                 }, true);
             ">
            <template x-for="(tab, idx) in labTabs"
                      :key="tab.id">
                <div @click="switchTab(tab.id)"
                     :data-tab-id="tab.id"
                     role="button"
                     tabindex="0"
                     @keydown.enter="switchTab(tab.id)"
                     draggable="true"
                     @dragstart="
                         _dragId = tab.id;
                         $event.dataTransfer.effectAllowed = 'move';
                         $event.dataTransfer.setData('text/plain', tab.id);
                     "
                     @dragover="
                         if (_dragId && _dragId !== tab.id) {
                             $event.preventDefault();
                             _overIdx = idx;
                             $event.dataTransfer.dropEffect = 'move';
                         }
                     "
                     @dragleave="if (!$el.contains($event.relatedTarget)) _overIdx = null"
                     @drop="
                         if (_dragId && _dragId !== tab.id) {
                             $event.preventDefault();
                             const from = labTabs.findIndex(t => t.id === _dragId);
                             const to = idx;
                             if (from !== -1) {
                                 const [moved] = labTabs.splice(from, 1);
                                 labTabs.splice(to, 0, moved);
                                 _saveTabs();
                             }
                         }
                         _dragId = null; _overIdx = null;
                     "
                     @dragend="_dragId = null; _overIdx = null"
                     class="relative shrink-0 flex items-center gap-1.5 px-3 h-[2.25rem] border-b-2 text-sm font-mono cursor-grab active:cursor-grabbing select-none group transition-colors"
                     :class="[
                         tab.id === labActiveTabId
                             ? 'border-cyan-500 text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-950 cursor-default'
                             : 'border-transparent text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/50',
                         _overIdx === idx && _dragId !== tab.id ? 'ring-1 ring-inset ring-cyan-500' : ''
                     ]">
                    <!-- dirty dot -->
                    <span x-show="tab.dirty"
                          class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0 flex-none"></span>
                    <!-- lab name -->
                    <span class="whitespace-nowrap"
                          :class="tab.name ? '' : 'italic opacity-50'"
                          x-text="tab.name || 'untitled'"></span>
                    <!-- close button -->
                    <button @click.stop="closeTab(tab.id)"
                            title="Close tab"
                            class="shrink-0 opacity-0 group-hover:opacity-100 -mr-1 p-0.5 rounded-md hover:bg-black/10 dark:hover:bg-white/10 transition-colors text-slate-400 hover:text-rose-500">
                        <svg class="w-3 h-3"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="3"
                                  d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </template>
        </div>

        <!-- tab action chips -->
        <div class="shrink-0 flex items-center gap-1 px-2 border-l border-slate-200 dark:border-slate-700">
            <!-- new tab -->
            <button @click="newTab()"
                    title="New tab"
                    class="btn btn-ghost h-7 text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1 shrink-0">
                <svg class="w-3 h-3"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.5"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 4v16m8-8H4" />
                </svg>
                <span class="hidden sm:inline">New</span>
            </button>

            <!-- load into new tab dropdown -->
            <div class="relative"
                 x-data="{
                     open: false,
                     labSearch: '',
                     get _filtered() {
                         const q = this.labSearch.toLowerCase();
                         return labSchemas.filter(l => !q || l.name.toLowerCase().includes(q));
                     },
                     get _suggestion() {
                         const v = this.labSearch;
                         if (!v) return '';
                         const m = labSchemas.find(l => l.name.toLowerCase().startsWith(v.toLowerCase()) && l.name !== v);
                         if (!m) return '';
                         const rem = m.name.slice(v.length);
                         const sep = rem.indexOf('/');
                         return sep === -1 ? m.name : m.name.slice(0, v.length + sep + 1);
                     },
                     acceptSearch() { if (this._suggestion) this.labSearch = this._suggestion; },
                     loadSingle() {
                         const r = this._filtered;
                         if (r.length !== 1) return;
                         loadLabInNewTab(r[0].name);
                         this.open = false; this.labSearch = '';
                     }
                 }"
                 @click.outside="open = false; labSearch = ''">
                <button @click="open = !open; if(open) loadLabSchemas(); else labSearch = ''"
                        class="btn btn-ghost h-7 text-sm font-bold text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50 uppercase flex items-center gap-1 shrink-0">
                    <svg class="w-3 h-3"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    <span class="hidden sm:inline">Load</span>
                    <svg class="w-2.5 h-2.5 transition-transform"
                         :class="open ? 'rotate-180' : ''"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-width="3"
                              d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div x-show="open"
                     x-transition
                     class="absolute right-0 top-full mt-1 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg shadow-2xl z-[700] flex flex-col max-h-80"
                     style="display:none;">
                    <!-- search + tab-complete -->
                    <div class="px-2 pt-2 pb-1.5 border-b border-slate-100 dark:border-slate-800 shrink-0">
                        <div class="relative">
                            <input type="text"
                                   x-model="labSearch"
                                   @keydown.stop
                                   @keydown.tab.prevent="acceptSearch()"
                                   @keydown.enter="loadSingle()"
                                   placeholder="Search labs…"
                                   class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded px-2 pr-6 py-1 text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
                            <button x-show="labSearch"
                                    @click="labSearch = ''"
                                    type="button"
                                    class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                <svg class="w-3 h-3"
                                     fill="none"
                                     stroke="currentColor"
                                     viewBox="0 0 24 24">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="3"
                                          d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <!-- search suggestion hint -->
                        <div class="mt-1 h-[1.125rem] flex items-center gap-1.5 text-sm font-mono"
                             :class="_suggestion ? 'visible' : 'invisible'">
                            <button @click="acceptSearch()"
                                    class="text-slate-400 hover:text-cyan-500 truncate transition-colors"
                                    x-text="_suggestion"></button>
                            <kbd class="px-1 py-0.5 rounded border border-slate-300 dark:border-slate-600 text-slate-400 dark:text-slate-500 text-sm">Tab</kbd>
                        </div>
                    </div>
                    <!-- list -->
                    <div class="overflow-y-auto custom-scrollbar flex-1">
                        <template x-for="lab in _filtered"
                                  :key="lab.name">
                            <div class="border-b border-slate-100 dark:border-slate-800 last:border-none hover:bg-slate-50 dark:hover:bg-slate-800 group"
                                 x-data="{ infoOpen: false }">
                                <div class="flex items-center justify-between px-3 py-2"
                                     :class="!lab.valid ? 'opacity-60' : ''">
                                    <button @click="loadLabInNewTab(lab.name); open = false; labSearch = ''"
                                            class="flex-1 text-left text-sm font-mono min-w-0">
                                        <div class="flex items-center gap-1.5 min-w-0">
                                            <span :class="lab.valid ? 'text-slate-700 dark:text-slate-300' : 'text-slate-400 dark:text-slate-500'"
                                                  class="truncate"
                                                  x-text="lab.name"></span>
                                            <!-- template indicator -->
                                            <span x-show="lab.is_template"
                                                  title="Template — contains Template In/Out ports"
                                                  class="shrink-0 text-sm font-sans font-semibold px-1 py-0.5 rounded bg-fuchsia-100 dark:bg-fuchsia-950 text-fuchsia-600 dark:text-fuchsia-400">tmpl</span>
                                            <!-- circular dependency -->
                                            <span x-show="!lab.valid && lab.missing.some(c => c.startsWith('Lab/'))"
                                                  title="Contains a circular lab dependency"
                                                  class="shrink-0 flex items-center">
                                                <svg class="w-3 h-3 text-amber-500"
                                                     fill="none"
                                                     stroke="currentColor"
                                                     stroke-width="2"
                                                     viewBox="0 0 24 24">
                                                    <path stroke-linecap="round"
                                                          stroke-linejoin="round"
                                                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                                </svg>
                                            </span>
                                            <!-- signal not in trial -->
                                            <span x-show="!lab.valid && lab.missing.some(c => !c.startsWith('Lab/'))"
                                                  title="Contains signals not in this trial"
                                                  class="shrink-0 flex items-center">
                                                <svg class="w-3 h-3 text-amber-500"
                                                     fill="none"
                                                     stroke="currentColor"
                                                     stroke-width="2"
                                                     viewBox="0 0 24 24">
                                                    <circle cx="12"
                                                            cy="12"
                                                            r="9" />
                                                    <path stroke-linecap="round"
                                                          d="M4.929 4.929l14.142 14.142" />
                                                </svg>
                                            </span>
                                        </div>
                                        <div class="text-slate-400 dark:text-slate-600 text-sm"
                                             x-text="relTime(lab.modified)"></div>
                                    </button>
                                    <!-- action icons -->
                                    <div class="flex items-center gap-0.5 ml-2 shrink-0">
                                        <button @click.stop="infoOpen = !infoOpen"
                                                x-show="lab.signal_in_columns.length || lab.outputs.length"
                                                :class="infoOpen ? 'text-cyan-500 opacity-100' : 'text-slate-400 opacity-0 group-hover:opacity-100'"
                                                class="hover:text-cyan-500 transition-all p-0.5">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <circle cx="12"
                                                        cy="12"
                                                        r="9"
                                                        stroke-width="1.5" />
                                                <path stroke-linecap="round"
                                                      stroke-width="1.75"
                                                      d="M12 16v-4" />
                                                <circle cx="12"
                                                        cy="8.5"
                                                        r="0.6"
                                                        fill="currentColor"
                                                        stroke="none" />
                                            </svg>
                                        </button>
                                        <button @click.stop="async () => { const ok = await window.mojoConfirm({title:'Delete lab',message:`Delete '${lab.name}'? This cannot be undone.`,confirmLabel:'Delete',cancelLabel:'Cancel',variant:'danger'}); if(ok) deleteLabGraph(lab.name); }"
                                                class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 transition-all p-0.5">
                                            <svg class="w-3.5 h-3.5"
                                                 fill="none"
                                                 stroke="currentColor"
                                                 viewBox="0 0 24 24">
                                                <path stroke-width="3"
                                                      stroke-linecap="round"
                                                      stroke-linejoin="round"
                                                      d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <!-- inline info panel -->
                                <div x-show="infoOpen"
                                     class="px-3 pb-2.5 text-sm font-mono"
                                     style="display:none;">
                                    <template x-if="lab.signal_in_columns.length">
                                        <div class="mb-1.5">
                                            <div class="text-slate-400 dark:text-slate-500 uppercase tracking-wider text-sm mb-1 font-sans font-semibold">Inputs</div>
                                            <template x-for="col in lab.signal_in_columns"
                                                      :key="col">
                                                <div class="flex items-center gap-1 truncate"
                                                     :class="lab.missing.includes(col) ? 'text-amber-500' : 'text-slate-600 dark:text-slate-300'">
                                                    <span class="truncate"
                                                          x-text="col"></span>
                                                    <span x-show="lab.missing.includes(col)"
                                                          class="shrink-0 text-sm font-sans"
                                                          x-text="col.startsWith('Lab/') ? 'circular ref' : 'not in trial'"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="lab.outputs.length">
                                        <div>
                                            <div class="text-slate-400 dark:text-slate-500 uppercase tracking-wider text-sm mb-1 font-sans font-semibold">Outputs</div>
                                            <template x-for="out in lab.outputs"
                                                      :key="out">
                                                <div class="text-cyan-600 dark:text-cyan-400 truncate"
                                                     x-text="out"></div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="lab.is_template && (lab.template_inputs.length || lab.template_outputs.length)">
                                        <div class="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800">
                                            <div class="text-fuchsia-500 dark:text-fuchsia-400 uppercase tracking-wider text-sm mb-1 font-sans font-semibold">Template ports</div>
                                            <template x-if="lab.template_inputs.length">
                                                <div class="mb-0.5">
                                                    <span class="text-slate-400 dark:text-slate-500">in: </span>
                                                    <span class="text-fuchsia-600 dark:text-fuchsia-400"
                                                          x-text="lab.template_inputs.join(', ')"></span>
                                                </div>
                                            </template>
                                            <template x-if="lab.template_outputs.length">
                                                <div>
                                                    <span class="text-slate-400 dark:text-slate-500">out: </span>
                                                    <span class="text-fuchsia-600 dark:text-fuchsia-400"
                                                          x-text="lab.template_outputs.join(', ')"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <p x-show="_filtered.length === 0"
                           class="px-3 py-2 text-sm font-mono italic text-slate-500 dark:text-slate-500">
                            <span x-text="labSchemas.length === 0 ? 'No saved labs yet' : 'No matching labs'"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- canvas area -->
    <div class="flex-1 relative overflow-hidden"
         @mojo:lab-close-tab.document="closeTab($event.detail.tabId)"
         @mojo:lab-pick-column.document="nodePickingColumn = $event.detail.nodeId; nodeColSearch = ''"
         @mojo:lab-pick-template.document="nodePickingTemplate = $event.detail.nodeId"
         @mojo:lab-refresh.document="refreshLabValidation()"
         @mojo:lab-new.document="newTab()"
         @mojo:lab-clear.document="async () => { const ok = await window.mojoConfirm({title:'Clear graph',message:'Remove all nodes and connections?',confirmLabel:'Clear',cancelLabel:'Cancel',variant:'warning'}); if(ok){ mojoLabClear(); window.mojoLabRebaseline?.(); } }"
         @mojo:lab-activate-tab.document="$nextTick(() => {
             const el = document.getElementById('lab-canvas');
             const tab = labTabs.find(t => t.id === labActiveTabId);
             mojoLabSetActiveHistoryTab(tab ? tab.id : labActiveTabId);
             if (el) {
                 mojoLabInit(el, columns, labGraph, tab ? tab.viewport : null);
             }
             mojoLabSetContext(columns, labSchemas, labName);
         })"
         x-init="
             const _labInitCanvas = () => $nextTick(() => {
                 const el = document.getElementById('lab-canvas');
                 const tab = labTabs.find(t => t.id === labActiveTabId);
                 mojoLabSetActiveHistoryTab(tab ? tab.id : labActiveTabId);
                 if (el) {
                     mojoLabInit(el, columns, labGraph, tab ? tab.viewport : null);
                 }
                 mojoLabSetContext(columns, labSchemas, labName);
             });
             $watch('labOpen', (open) => {
                 try { localStorage.setItem('mojo:lab:open', open ? '1' : '0'); } catch {}
                 if (!open) _saveTabs();
                 if (open) _labInitCanvas();
             });
             if (labOpen) _labInitCanvas();
             $watch('labSchemas', (s) => { if (labOpen) mojoLabSetContext(columns, s, labName); });
             $watch('labName', (n) => { if (labOpen) mojoLabSetContext(columns, labSchemas, n); });
         ">
        <canvas id="lab-canvas"
                tabindex="0"
                class="absolute inset-0 outline-none"
                @change="labGraph = mojoLabSerialize()">
        </canvas>
    </div>

    <!-- ── Column picker — fixed so it escapes the overflow-hidden canvas container ── -->
    <div x-show="nodePickingColumn !== null"
         @click.self="nodePickingColumn = null; nodeColSearch = ''"
         class="fixed inset-0 z-[600] flex items-start justify-center pt-16 bg-slate-950/80 backdrop-blur-sm"
         style="display:none;">
        <div class="panel w-80 space-y-3 max-h-[70vh] flex flex-col">

            <!-- header -->
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-700 shrink-0">
                <p class="text-sm font-black uppercase text-slate-700 dark:text-slate-300 tracking-widest">Select Signal</p>
                <button @click="nodePickingColumn = null; nodeColSearch = ''"
                        class="text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2.5"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- search -->
            <div class="relative shrink-0">
                <input type="text"
                       x-model="nodeColSearch"
                       placeholder="Filter signals…"
                       class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 pr-7 py-1.5 text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-cyan-500" />
                <button x-show="nodeColSearch"
                        type="button"
                        @click="nodeColSearch = ''"
                        class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                    <svg class="w-3 h-3"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="3"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- hierarchical segment drills -->
            <div class="flex flex-col gap-1.5 shrink-0">
                <template x-for="depth in getActiveLevels('nodeCol')"
                          :key="depth">
                    <div x-show="getSegmentsAtDepth('nodeCol', depth).length > 0"
                         class="flex gap-1 overflow-x-auto pb-0.5 custom-scrollbar">
                        <template x-for="seg in getSegmentsAtDepth('nodeCol', depth)"
                                  :key="seg">
                            <button @click="toggleRegexSegment('nodeCol', seg, depth)"
                                    :class="isSegmentActive('nodeCol', seg, depth)
                                        ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm'
                                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50'"
                                    class="shrink-0 px-2 py-0.5 rounded border text-sm font-mono transition-all"
                                    x-text="seg">
                            </button>
                        </template>
                    </div>
                </template>
                <!-- suffix quick filter -->
                <div x-show="getAvailableSuffixes('nodeCol').length > 0"
                     class="flex items-center gap-1 overflow-x-auto pb-0.5 custom-scrollbar">
                    <template x-for="sfx in getAvailableSuffixes('nodeCol')"
                              :key="sfx">
                        <button @click="toggleRegexSegment('nodeCol', sfx, 'suffix')"
                                :class="isSegmentActive('nodeCol', sfx, 'suffix')
                                    ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700 hover:border-cyan-500/50'"
                                class="shrink-0 px-2 py-0.5 rounded border text-sm font-mono transition-all"
                                x-text="sfx">
                        </button>
                    </template>
                </div>
            </div>

            <!-- filtered column list -->
            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-0.5 min-h-0">
                <template x-for="col in getFilteredCols('nodeCol')"
                          :key="col">
                    <button @click="selectNodeColumn(col)"
                            :class="mojoLabIsCyclicInput && mojoLabIsCyclicInput(col)
                                ? 'text-amber-500 dark:text-amber-400 hover:bg-amber-500/10 line-through'
                                : 'text-slate-500 dark:text-slate-400 hover:bg-cyan-500/20 hover:text-cyan-700 dark:hover:text-cyan-200'"
                            :title="mojoLabIsCyclicInput && mojoLabIsCyclicInput(col) ? 'Would create a circular dependency' : ''"
                            class="w-full text-left px-2 py-1 text-sm font-mono rounded truncate transition-colors"
                            x-text="col">
                    </button>
                </template>
                <p x-show="getFilteredCols('nodeCol').length === 0"
                   class="px-2 py-2 text-sm font-mono italic text-slate-500 dark:text-slate-500">No matching signals</p>
            </div>
        </div>
    </div>

    <!-- ── Template picker — fixed so it escapes the overflow-hidden canvas container ── -->
    <div x-show="nodePickingTemplate !== null"
         x-data="{
             schemas: [],
             search: '',
             async _load() {
                 try {
                     const r = await fetch('/mosaic/api/lab');
                     const all = r.ok ? await r.json() : [];
                     this.schemas = all.filter(l => l.is_template);
                 } catch { this.schemas = []; }
             }
         }"
         x-init="$watch('nodePickingTemplate', v => { if (v !== null) { search = ''; _load(); } })"
         @click.self="nodePickingTemplate = null"
         class="fixed inset-0 z-[600] flex items-start justify-center pt-16 bg-slate-950/80 backdrop-blur-sm"
         style="display:none;">
        <div class="panel w-96 space-y-3 max-h-[70vh] flex flex-col">

            <!-- header -->
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-700 shrink-0">
                <p class="text-sm font-black uppercase text-slate-700 dark:text-slate-300 tracking-widest">Select Template</p>
                <button @click="nodePickingTemplate = null"
                        class="text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2.5"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- search -->
            <div class="relative shrink-0">
                <input type="text"
                       x-model="search"
                       placeholder="Filter templates…"
                       class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 pr-7 py-1.5 text-sm font-mono text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-fuchsia-500" />
                <button x-show="search"
                        type="button"
                        @click="search = ''"
                        class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                    <svg class="w-3 h-3"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="3"
                              d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- template list -->
            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-0.5 min-h-0">
                <template x-for="t in schemas.filter(s => !search || s.name.toLowerCase().includes(search.toLowerCase()))"
                          :key="t.name">
                    <button @click="selectNodeTemplate(t.name)"
                            class="w-full text-left px-2 py-2 rounded hover:bg-fuchsia-500/10 transition-colors group">
                        <div class="text-sm font-mono text-slate-600 dark:text-slate-300 group-hover:text-fuchsia-700 dark:group-hover:text-fuchsia-300 truncate"
                             x-text="t.name"></div>
                        <div class="flex gap-3 mt-0.5 text-sm font-mono text-slate-400 dark:text-slate-500">
                            <span x-show="t.template_inputs.length"
                                  x-text="'in: ' + t.template_inputs.join(', ')"></span>
                            <span x-show="t.template_outputs.length"
                                  x-text="'out: ' + t.template_outputs.join(', ')"></span>
                            <span x-show="!t.template_inputs.length && !t.template_outputs.length"
                                  class="italic">no ports defined</span>
                        </div>
                    </button>
                </template>
                <p x-show="schemas.filter(s => !search || s.name.toLowerCase().includes(search.toLowerCase())).length === 0"
                   class="px-2 py-2 text-sm font-mono italic text-slate-500 dark:text-slate-500">
                    <span x-text="schemas.length === 0 ? 'No labs with Template In/Out nodes yet' : 'No matching templates'"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- status bar -->
    <div class="h-8 shrink-0 flex items-center px-4 border-t border-slate-200 dark:border-slate-800 text-sm font-mono text-slate-500 dark:text-slate-500 select-none overflow-x-auto custom-scrollbar gap-5 whitespace-nowrap">
        <span>Right-click → add node</span>
        <span>Scroll to zoom · drag to pan</span>
        <span class="flex items-center gap-3">
            <!-- Undo: ⌘Z / Ctrl+Z -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>Z</kbd>
                </span>
                <span>Undo</span>
            </span>
            <!-- Redo: ⌘⇧Z / Ctrl+Y -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd x-show="isMac">⇧</kbd>
                    <kbd x-text="isMac ? 'Z' : 'Y'"></kbd>
                </span>
                <span>Redo</span>
            </span>
            <!-- Save: ⌘S / Ctrl+S -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>S</kbd>
                </span>
                <span>Save</span>
            </span>
            <!-- Clear: ⌘C / Ctrl+C -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>C</kbd>
                </span>
                <span>Clear</span>
            </span>
            <!-- Remove: Del -->
            <span class="flex items-center gap-1">
                <kbd>Del</kbd>
                <span>Remove</span>
            </span>
        </span>
        <span class="flex items-center gap-3">
            <!-- Arrange: ⌘⇧A / Ctrl+⇧+A -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>⇧</kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>A</kbd>
                </span>
                <span>Arrange</span>
            </span>
            <!-- Fit: ⌘⇧F / Ctrl+⇧+F -->
            <span class="flex items-center gap-1">
                <span class="flex items-center gap-0.5">
                    <kbd x-text="isMac ? '⌘' : 'Ctrl'"></kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>⇧</kbd>
                    <span x-show="!isMac"
                          class="text-slate-400">+</span>
                    <kbd>F</kbd>
                </span>
                <span>Fit</span>
            </span>
        </span>
    </div>
</div>
