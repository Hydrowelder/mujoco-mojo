<!-- ══════════════════════════════════════════════════════════════════
         SIGNAL LAB  ·  _signal_lab.html
         LiteGraph-powered node editor for building filter graphs.
         Opened via the "Lab" sidebar button; overlays the full viewport.
         ══════════════════════════════════════════════════════════════════ -->

<script>
    // ── Node registration ─────────────────────────────────────────────────────
    // Called once with the current column list; guarded against double-registration.
    function mojoLabRegisterNodes(columns) {
        if (window.__mojoLabRegistered) {
            // Refresh SignalIn combo values if columns changed
            const NodeCtor = LiteGraph.registered_node_types["Signal/signal_in"];
            if (NodeCtor) NodeCtor._columns = columns;
            return;
        }
        window.__mojoLabRegistered = true;

        // ── Global style overrides ────────────────────────────────────────────
        // Replace all four internal registries so built-in nodes don't appear in the menu.
        // Using object replacement (not delete) keeps LiteGraph's internal references intact.
        LiteGraph.registered_node_types = {};
        LiteGraph.Nodes = {};
        LiteGraph.nodes_titles = {};
        LiteGraph.node_types_by_file_extension = {};
        LiteGraph.node_types_by_category = {};

        LiteGraph.LINK_COLOR = "#06b6d4";   // cyan-500
        LiteGraph.CONNECTING_LINK_COLOR = "#22d3ee";   // cyan-400
        LiteGraph.EVENT_LINK_COLOR = "#a78bfa";   // violet-400
        LiteGraph.NODE_SELECTED_TITLE_COLOR = "#22d3ee";
        LiteGraph.DEFAULT_LINK_TYPE_COLORS = { series: "#06b6d4", wrt: "#a78bfa" };

        const SER = "series";
        const BG = "#0f172a";   // slate-900
        const C_SRC = "#14532d";   // green-900
        const C_SINK = "#164e63";   // cyan-900
        const C_FILT = "#1e1b4b";   // indigo-950
        const C_CALC = "#3b0764";   // violet-950
        const C_UTIL = "#431407";   // orange-950
        const C_MATH = "#0c4a6e";   // sky-950  (arithmetic: log, exp, power, +/-/×/÷)
        const C_TRIG = "#14432a";   // green-950 (trigonometry)
        const C_COMP = "#3d1515";   // red-950  (comparison, sign)
        const C_TMPL_IO = "#4a044e";   // fuchsia-950 (template in/out ports)
        const C_TMPL_REF = "#4a044e";   // fuchsia-950 (template reference compound node)

        // ── Signal In ─────────────────────────────────────────────────────────
        function SignalInNode() {
            this.addOutput("signal", SER);
            this.properties = { column: "time" };
            // Editable text - user can type or use the Browse button
            this._displayWidget = this.addWidget(
                "text", "", "time",
                (v) => {
                    this.properties.column = v;
                    this.size[0] = Math.max(240, v.length * 7 + 80);
                    mojoLabRefreshSiColors();
                    if (_lab.graph) _lab.graph.setDirtyCanvas(true, true);
                }
            );
            // Browse button - fires to Alpine which opens the hierarchical picker
            this.addWidget("button", "pick", "Browse…", () => {
                document.dispatchEvent(new CustomEvent("mojo:lab-pick-column", {
                    detail: { nodeId: this.id }
                }));
            });
            this.size = [240, 78];
        }
        SignalInNode.title = "Signal In";
        SignalInNode.color = C_SRC;
        SignalInNode.bgcolor = BG;
        SignalInNode._columns = columns;
        SignalInNode._cyclicCols = new Map();
        LiteGraph.registerNodeType("Signal/signal_in", SignalInNode);

        // Sync widget display, node width, and validation color from restored properties.
        SignalInNode.prototype.onConfigure = function () {
            const col = this.properties.column ?? "time";
            if (this._displayWidget) this._displayWidget.value = col;
            this.size[0] = Math.max(240, col.length * 7 + 80);
            _siColor(this);
        };

        SignalInNode.prototype.onDrawForeground = function (ctx) {
            const dw = this._displayWidget;
            const nw = this.size[0];
            const H = LiteGraph.NODE_WIDGET_HEIGHT || 20;
            const col = this.properties.column || '';

            // Override widget value: LiteGraph truncates at 30 chars; draw the full name.
            if (dw && dw.last_y != null) {
                const A = dw.last_y;
                ctx.save();
                ctx.beginPath();
                ctx.rect(16, A + 1, nw - 32, H - 2);
                ctx.clip();
                ctx.fillStyle = "#222";
                ctx.fillRect(16, A + 1, nw - 32, H - 2);
                ctx.font = "12px Arial";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#999";
                ctx.textAlign = "left";
                ctx.fillText("col", 18, A + H * 0.7);
                ctx.fillStyle = "#DDD";
                ctx.textAlign = "right";
                ctx.fillText(col, nw - 30, A + H * 0.7);
                ctx.restore();
            }

            // Warnings below widgets (size[1] expanded to make room)
            if (!col) return;
            const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"];
            if (!SiCtor) return;
            const isCyclic = (SiCtor._cyclicCols || new Map()).has(col);
            const notInTrial = !SiCtor._columns.includes(col);
            if (!isCyclic && !notInTrial) return;
            ctx.save();
            ctx.font = "italic 10px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            if (isCyclic) {
                const src = SiCtor._cyclicCols.get(col) || '';
                const srcDisplay = src.length > 26 ? src.slice(0, 24) + '…' : src;
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("circular dependency", nw / 2, this.size[1] - 19);
                ctx.font = "10px monospace";
                ctx.fillStyle = "#fbbf24";
                ctx.fillText(srcDisplay, nw / 2, this.size[1] - 5);
            } else {
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("not in this trial", nw / 2, this.size[1] - 4);
            }
            ctx.restore();
        };

        // Global callback - called by trial-viewer.ts when the user picks a column
        window.mojoLabSelectNodeColumn = function (nodeId, col) {
            if (!_lab.graph) return;
            const node = _lab.graph.getNodeById(nodeId);
            if (!node) return;
            node.properties.column = col;
            if (node._displayWidget) node._displayWidget.value = col;
            node.size[0] = Math.max(240, col.length * 7 + 80);
            mojoLabRefreshSiColors();
            _lab.graph.setDirtyCanvas(true, true);
        };

        // ── Signal Out ────────────────────────────────────────────────────────
        function SignalOutNode() {
            this.addInput("signal", SER);
            this.properties = { label: "" };
            this.addWidget(
                "text", "label", "",
                (v) => {
                    this.properties.label = v;
                    this.size[0] = Math.max(200, v.length * 7 + 80);
                    _soColor(this);
                    if (_lab.graph) {
                        // Recolor sibling Signal Out nodes (duplicate detection)
                        (_lab.graph._nodes || []).forEach(n => {
                            if (n !== this && (n.type || '').endsWith('signal_out')) _soColor(n);
                        });
                        // Refresh cyclic dep check (current outputs changed)
                        mojoLabRefreshSiColors();
                    }
                }
            );
            this.size = [200, 55];
        }
        SignalOutNode.title = "Signal Out";
        SignalOutNode.color = C_SINK;
        SignalOutNode.bgcolor = BG;
        SignalOutNode._existingNames = new Map();
        SignalOutNode._cyclicOutputs = new Set();
        LiteGraph.registerNodeType("Signal/signal_out", SignalOutNode);

        // Sync widget display, node width, and validation color from restored properties.
        SignalOutNode.prototype.onConfigure = function () {
            const lbl = this.properties.label ?? "";
            if (this.widgets && this.widgets[0]) this.widgets[0].value = lbl;
            this.size[0] = Math.max(200, lbl.length * 7 + 80);
            _soColor(this);
        };

        SignalOutNode.prototype.onConnectionsChange = function () {
            _soColor(this);
            if (_lab.graph) _lab.graph.setDirtyCanvas(true, false);
        };

        SignalOutNode.prototype.onDrawForeground = function (ctx) {
            const lbl = this.properties.label ?? '';
            const SoCtor = LiteGraph.registered_node_types["Signal/signal_out"];
            const nameMap = (SoCtor && SoCtor._existingNames) || new Map();
            const cyclicOutputs = (SoCtor && SoCtor._cyclicOutputs) || new Set();
            const connected = this.inputs[0] && this.inputs[0].link != null;
            const collision = lbl && nameMap.has(lbl);
            const duplicate = lbl && _lab.graph && (_lab.graph._nodes || []).some(
                n => n !== this && (n.type || '').endsWith('signal_out') && (n.properties.label || '') === lbl
            );
            const isCyclic = lbl && cyclicOutputs.has(lbl);
            if (!collision && !duplicate && !isCyclic && (connected || !lbl)) return;
            const cx = this.size[0] / 2;
            ctx.save();
            ctx.font = "italic 10px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            if (collision) {
                const src = nameMap.get(lbl) || '';
                const srcDisplay = src.length > 26 ? src.slice(0, 24) + '…' : src;
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("name already exists", cx, this.size[1] - 19);
                ctx.font = "10px monospace";
                ctx.fillStyle = "#fbbf24";
                ctx.fillText(srcDisplay, cx, this.size[1] - 5);
            } else if (duplicate) {
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("duplicate in this lab", cx, this.size[1] - 4);
            } else if (isCyclic) {
                ctx.fillStyle = "#f59e0b";
                ctx.fillText("part of cycle", cx, this.size[1] - 4);
            } else {
                ctx.fillStyle = "#94a3b8";
                ctx.fillText("no input connected", cx, this.size[1] - 4);
            }
            ctx.restore();
        };

        // ── Signal Constant ───────────────────────────────────────────────────
        function ConstantNode() {
            this.addOutput("signal", SER);
            this.properties = { value: 0 };
            this._valW = this.addWidget("number", "value", 0,
                (v) => { this.properties.value = v; },
                { step: 0.1 });
            this.size = [180, 55];
        }
        ConstantNode.title = "Constant";
        ConstantNode.color = C_MATH;
        ConstantNode.bgcolor = BG;
        ConstantNode.prototype.onConfigure = function () {
            if (this._valW) this._valW.value = this.properties.value ?? 0;
        };
        LiteGraph.registerNodeType("Signal/constant", ConstantNode);

        // ── Generic 1-in 1-out filter factory ────────────────────────────────
        function reg(typeName, title, params, color, category) {
            function Node() {
                this.addInput("signal", SER);
                this.addOutput("signal", SER);
                this.properties = {};
                params.forEach((p) => {
                    this.properties[p.name] = p.default ?? null;
                    if (p.widget === "toggle") {
                        this.addWidget("toggle", p.name, p.default,
                            (v) => { this.properties[p.name] = v; });
                    } else if (p.widget === "combo") {
                        this.addWidget("combo", p.name, p.default,
                            (v) => { this.properties[p.name] = v; },
                            { values: p.values || [] });
                    } else {
                        // Use slider when both min and max are defined; otherwise plain number.
                        const opts = p.opts || {};
                        const wtype = (opts.min !== undefined && opts.max !== undefined) ? "slider" : "number";
                        this.addWidget(wtype, p.name, p.default ?? 0,
                            (v) => { this.properties[p.name] = v; },
                            opts);
                    }
                });
                this.size = [200, Math.max(55, 32 + params.length * 24)];
            }
            Node.title = title;
            Node.color = color || C_FILT;
            Node.bgcolor = BG;
            // Sync widget display values from restored properties after graph load.
            Node.prototype.onConfigure = function () {
                params.forEach((p, idx) => {
                    if (this.widgets && this.widgets[idx]) {
                        const v = this.properties[p.name];
                        if (v !== undefined && v !== null) this.widgets[idx].value = v;
                    }
                });
            };
            LiteGraph.registerNodeType((category || "Misc") + "/" + typeName, Node);
        }

        // ── Smoothing ─────────────────────────────────────────────────────────
        reg("low_pass", "Low Pass", [{ name: "alpha", default: 0.1, opts: { min: 0.001, max: 1, step: 0.01 } }], C_FILT, "Smoothing");
        reg("high_pass", "High Pass", [{ name: "alpha", default: 0.1, opts: { min: 0.001, max: 1, step: 0.01 } }], C_FILT, "Smoothing");
        reg("rolling_mean", "Rolling Mean", [{ name: "window", default: 10, opts: { min: 1, step: 1, precision: 0 } },
        { name: "center", default: true, widget: "toggle" }], C_FILT, "Smoothing");
        reg("median", "Median", [{ name: "window", default: 10, opts: { min: 1, step: 1, precision: 0 } }], C_FILT, "Smoothing");
        reg("savitzky_golay", "Savitzky-Golay", [{ name: "window", default: 11, opts: { min: 3, step: 2, precision: 0 } },
        { name: "order", default: 2, opts: { min: 1, step: 1, precision: 0 } }], C_FILT, "Smoothing");

        // ── Arithmetic ────────────────────────────────────────────────────────
        reg("scale", "Scale", [{ name: "factor", default: 1, opts: { step: 0.1 } },
        { name: "offset", default: 0, opts: { step: 0.1 } }], C_FILT, "Arithmetic");
        reg("absolute_value", "Absolute Value", [], C_FILT, "Arithmetic");
        reg("log", "Log", [{ name: "base", default: 2.718281828, opts: { min: 1e-9, step: 0.1 } }], C_MATH, "Arithmetic");
        reg("exp", "Exp", [{ name: "base", default: 2.718281828, opts: { min: 1e-9, step: 0.1 } }], C_MATH, "Arithmetic");
        reg("power", "Power", [{ name: "exponent", default: 2, opts: { step: 0.1 } }], C_MATH, "Arithmetic");

        // ── Trigonometry: one node per function ───────────────────────────────
        [["sin", "Sin"], ["cos", "Cos"], ["tan", "Tan"],
        ["asin", "Arcsin"], ["acos", "Arccos"], ["atan", "Arctan"],
        ["sinh", "Sinh"], ["cosh", "Cosh"], ["tanh", "Tanh"],
        ["degrees", "Degrees (rad→°)"], ["radians", "Radians (°→rad)"]
        ].forEach(([fn, label]) => reg(fn, label, [], C_TRIG, "Trigonometry"));

        // ── Comparison: one node per operator (two-input, signal vs signal) ──
        reg("sign", "Sign", [], C_COMP, "Comparison");
        (function () {
            function makeCmp(typeName, symbol) {
                function Node() {
                    this.addInput("a", SER);
                    this.addInput("b", SER);
                    this.addOutput("signal", SER);
                    this.size = [180, 55];
                }
                Node.title = symbol;
                Node.color = C_COMP;
                Node.bgcolor = BG;
                LiteGraph.registerNodeType("Comparison/" + typeName, Node);
            }
            makeCmp("gt", "Greater Than  (a > b)");
            makeCmp("gte", "Grt. or Equal  (a >= b)");
            makeCmp("lt", "Less Than  (a < b)");
            makeCmp("lte", "Less or Equal  (a <= b)");
            makeCmp("eq", "Equal  (a == b)");
            makeCmp("neq", "Not Equal  (a != b)");
        })();

        // ── Bounding ──────────────────────────────────────────────────────────
        reg("clip", "Clip", [{ name: "min", default: null, opts: {} },
        { name: "max", default: null, opts: {} }], C_FILT, "Bounding");
        reg("deadband", "Deadband", [{ name: "threshold", default: 0.01, opts: { min: 0, step: 0.001 } }], C_FILT, "Bounding");
        reg("wrap", "Wrap", [{ name: "lb", default: -3.14159, opts: { step: 0.1 } },
        { name: "ub", default: 3.14159, opts: { step: 0.1 } }], C_FILT, "Bounding");
        reg("taring", "Taring", [], C_UTIL, "Bounding");
        reg("normalize", "Normalize", [], C_UTIL, "Bounding");
        reg("round", "Round", [
            { name: "method", default: "round", widget: "combo", values: ["round", "floor", "ceil"] },
            { name: "decimals", default: 0, opts: { min: 0, step: 1, precision: 0 } }
        ], C_UTIL, "Bounding");

        // ── Statistics: reduce the whole signal to one value, broadcast back ──
        reg("stat_max", "Max", [], C_MATH, "Statistics");
        reg("stat_min", "Min", [], C_MATH, "Statistics");
        reg("stat_mean", "Mean", [], C_MATH, "Statistics");
        reg("stat_median", "Median", [], C_MATH, "Statistics");
        reg("stat_mode", "Mode", [], C_MATH, "Statistics");
        reg("stat_standard_deviation", "Standard Deviation", [], C_MATH, "Statistics");

        // ── Arithmetic: two-input (Lab only) ─────────────────────────────────
        (function () {
            function makeArith(typeName, symbol) {
                function Node() {
                    this.addInput("a", SER);
                    this.addInput("b", SER);
                    this.addOutput("signal", SER);
                    this.size = [140, 55];
                }
                Node.title = symbol;
                Node.color = C_MATH;
                Node.bgcolor = BG;
                LiteGraph.registerNodeType("Arithmetic/" + typeName, Node);
            }
            makeArith("add", "Add  (a + b)");
            makeArith("subtract", "Subtract  (a - b)");
            makeArith("multiply", "Multiply  (a × b)");
            makeArith("divide", "Divide  (a ÷ b)");
        })();

        // ── Norm (N inputs → ‖x‖₂) ───────────────────────────────────────────
        (function () {
            function NormNode() {
                this.addInput("x0", SER);
                this.addInput("x1", SER);
                this.addOutput("signal", SER);
                this.size = [180, 72];
            }
            NormNode.title = "Norm  ‖x‖₂";
            NormNode.color = C_MATH;
            NormNode.bgcolor = BG;
            NormNode.prototype.onConnectionsChange = function (type, slot, connected) {
                if (type !== LiteGraph.INPUT) return;
                const n = (this.inputs || []).length;
                // auto-add a new slot when the last one gets wired up
                if (connected && slot === n - 1) {
                    this.addInput("x" + n, SER);
                }
                // prune trailing empty slots; always keep at least 2
                while (
                    this.inputs.length > 2 &&
                    this.inputs[this.inputs.length - 1].link == null &&
                    this.inputs[this.inputs.length - 2].link == null
                ) {
                    this.removeInput(this.inputs.length - 1);
                }
                this.size[1] = Math.max(72, 32 + this.inputs.length * 20 + 14);
            };
            NormNode.prototype.onDrawForeground = function (ctx) {
                // hint below the last (unconnected) input slot
                if (!this.inputs || this.inputs.length === 0) return;
                if (this.inputs[this.inputs.length - 1].link != null) return;
                ctx.save();
                ctx.font = "italic 12px monospace";
                ctx.fillStyle = "#475569";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText("wire to add inputs", this.size[0] / 2, this.size[1] - 3);
                ctx.restore();
            };
            LiteGraph.registerNodeType("Arithmetic/norm", NormNode);
        })();

        // ── Template In / Template Out (interface ports inside a template) ────
        (function () {
            function makeTemplatePort(isInput) {
                function Node() {
                    this.properties = { label: "" };
                    this._lw = this.addWidget(
                        "text", "label", "",
                        (v) => {
                            this.properties.label = v;
                            this.size[0] = Math.max(180, v.length * 7 + 80);
                            if (_lab.graph) _lab.graph.setDirtyCanvas(true, true);
                        }
                    );
                    if (isInput) {
                        this.addOutput("signal", SER);
                    } else {
                        this.addInput("signal", SER);
                    }
                    this.size = [180, 55];
                }
                Node.title = isInput ? "Template In" : "Template Out";
                Node.color = C_TMPL_IO;
                Node.bgcolor = BG;
                Node.prototype.onConfigure = function () {
                    const lbl = this.properties.label ?? "";
                    if (this._lw) this._lw.value = lbl;
                    this.size[0] = Math.max(180, lbl.length * 7 + 80);
                };
                LiteGraph.registerNodeType(
                    isInput ? "Template/template_in" : "Template/template_out",
                    Node
                );
            }
            makeTemplatePort(true);
            makeTemplatePort(false);
        })();

        // ── Template Reference (compound node that runs a saved template) ─────
        (function () {
            function TemplateRefNode() {
                this.properties = { name: "", graph: null };
                this._nw = this.addWidget(
                    "text", "template", "",
                    (v) => {
                        this.properties.name = v;
                        this.size[0] = Math.max(200, v.length * 7 + 80);
                        if (_lab.graph) _lab.graph.setDirtyCanvas(true, true);
                    }
                );
                this.addWidget("button", "pick", "Pick", () => {
                    document.dispatchEvent(new CustomEvent("mojo:lab-pick-template", {
                        detail: { nodeId: this.id }
                    }));
                });
                this.size = [200, 78];
            }
            TemplateRefNode.title = "Template";
            TemplateRefNode.color = C_TMPL_REF;
            TemplateRefNode.bgcolor = BG;
            TemplateRefNode.prototype.onConfigure = function () {
                // LiteGraph already restored inputs/outputs with their link IDs from the
                // serialized graph — calling _tmplApplyPorts here would wipe those link
                // references before they can be reconnected. Only sync the widget and size.
                const name = this.properties.name ?? "";
                if (this._nw) this._nw.value = name;
                const nPorts = Math.max((this.inputs || []).length, (this.outputs || []).length, 1);
                const allPortLabels = [
                    ...(this.inputs || []).map(i => i.name || ''),
                    ...(this.outputs || []).map(o => o.name || ''),
                ];
                this.size[0] = Math.max(200, name.length * 7 + 80, ...allPortLabels.map(l => l.length * 7 + 80));
                this.size[1] = Math.max(78, 56 + nPorts * 20);
            };
            TemplateRefNode.prototype.onDrawForeground = function (ctx) {
                const cx = this.size[0] / 2;
                if (this._tmplStale) {
                    ctx.save();
                    ctx.font = "italic 9px monospace";
                    ctx.fillStyle = "#f59e0b";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText("ports changed — repick to update", cx, this.size[1] - 4);
                    ctx.restore();
                    return;
                }
                if (!this.properties.name || this.properties.graph) return;
                ctx.save();
                ctx.font = "italic 9px monospace";
                ctx.fillStyle = "#64748b";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText("click Pick to configure ports", cx, this.size[1] - 3);
                ctx.restore();
            };
            LiteGraph.registerNodeType("Template/template_ref", TemplateRefNode);
        })();

        // ── Derivative (signal / wrt) ─────────────────────────────────────────
        function DerivativeNode() {
            this.addInput("signal", SER);
            this.addInput("wrt", SER);
            this.addOutput("signal", SER);
            this.size = [160, 55];
        }
        DerivativeNode.title = "Derivative";
        DerivativeNode.color = C_CALC;
        DerivativeNode.bgcolor = BG;
        LiteGraph.registerNodeType("Calculus/derivative", DerivativeNode);

        // ── Integral (signal / wrt) ───────────────────────────────────────────
        function IntegralNode() {
            this.addInput("signal", SER);
            this.addInput("wrt", SER);
            this.addOutput("signal", SER);
            this.size = [160, 55];
        }
        IntegralNode.title = "Integral";
        IntegralNode.color = C_CALC;
        IntegralNode.bgcolor = BG;
        LiteGraph.registerNodeType("Calculus/integral", IntegralNode);
    }

    // ── Lab canvas management ─────────────────────────────────────────────────
    // Stored outside Alpine so LiteGraph objects are never proxied.
    const _lab = { graph: null, canvas: null, ro: null };

    // Cached Alpine context - updated by mojoLabSetContext so helpers can re-read it.
    let _labContext = { cols: [], schemas: [], currentName: '' };

    // ── Unsaved-changes tracking ──────────────────────────────────────────────
    // There is deliberately NO local copy of the "clean baseline" here. Each
    // tab owns its own baseline (LabTab.savedState in trial-viewer.ts) - that
    // is the single source of truth, queried live via window.mojoLabGetBaseline.
    // A local copy was the root cause of a whole class of bugs (forgotten
    // syncs, stale baselines surviving a tab switch, baseline-vs-history
    // ordering footguns) because it had to be kept in lockstep with whichever
    // tab happened to be active. Querying it fresh every time makes that
    // entire bug class structurally impossible.

    // Comparison key for dirty/undo purposes: a serialized-graph string with
    // UI-only / incidental fields stripped out so two graphs that "look the
    // same" to the user always produce the same key, regardless of how their
    // live LiteGraph instances got there. Two things get stripped:
    //
    // 1. node.color/bgcolor/boxcolor - _soColor/mojoLabRefreshSiColors set
    //    these from live validation status (cyclic links, duplicate labels,
    //    unknown columns, ...) and LiteGraph's serializer includes them
    //    whenever present. Nothing is lost by stripping: configure() always
    //    re-triggers the recoloring hooks, so this only affects comparison.
    //
    // 2. extra.viewport - mojoLabSerialize() (used to persist tab.graph on
    //    every tab switch) stamps the *current* pan/zoom into extra.viewport
    //    on its returned copy. mojoLabInit then configure()s that data back
    //    onto the live graph on switch-back, which copies that whole `extra`
    //    object - viewport included - onto _lab.graph.extra. From then on the
    //    live graph's serialized extra carries whatever pan/zoom was active at
    //    the moment of the *last* switch-out, while the baseline's extra was
    //    captured at a (generally different) pan/zoom - so panning and
    //    switching tabs alone made the comparison spuriously mismatch.
    function _labNormalizedSnapshot() {
        if (!_lab.graph) return null;
        const data = _lab.graph.serialize();
        (data.nodes || []).forEach((n) => {
            delete n.color;
            delete n.bgcolor;
            delete n.boxcolor;
        });
        if (data.extra) {
            // serialize() hands back graph.extra by reference - clone before
            // deleting so we never mutate the live graph's extra as a side effect
            data.extra = Object.assign({}, data.extra);
            delete data.extra.viewport;
        }
        return JSON.stringify(data);
    }

    // Returns true when the graph differs from the active tab's clean baseline.
    // baseline === null means "never established" (brand new blank tab) -
    // in that case any node at all counts as unsaved content.
    window.mojoLabHasUnsavedChanges = function () {
        if (!_lab.graph) return false;
        const baseline = window.mojoLabGetBaseline ? window.mojoLabGetBaseline() : null;
        if (baseline === null) return (_lab.graph._nodes || []).length > 0;
        return _labNormalizedSnapshot() !== baseline;
    };

    // Replace the active tab's baseline with the current live graph state -
    // i.e. "treat what's on screen right now as clean going forward". Used
    // after a successful save, after clearing the graph, and (from mojoLabInit)
    // the first time a tab's content is configured so it starts out clean.
    window.mojoLabRebaseline = function () {
        if (!_lab.graph || !window.mojoLabSetBaseline) return;
        window.mojoLabSetBaseline(_labNormalizedSnapshot());
    };

    // Bridge for tab management: read the canvas's current pan/zoom so it can be
    // stashed on the tab and restored on switch-back. Kept off graph.extra (see
    // mojoLabSerialize) so panning alone never affects the dirty/undo baselines.
    window.mojoLabGetViewport = function () {
        if (!_lab.canvas) return null;
        return {
            scale: _lab.canvas.ds.scale,
            offset: [_lab.canvas.ds.offset[0], _lab.canvas.ds.offset[1]],
        };
    };

    // Called by tab management whenever the graph snapshot changes so the tab
    // dirty indicator can be updated reactively.
    window.mojoLabOnDirtyChange = null;

    // ── Undo / redo history (one stack per tab) ───────────────────────────────
    const _LAB_HIST_MAX = 50;
    const _labHistories = new Map(); // tabId -> { stack: string[], index: number }
    let _labHistory = { stack: [], index: -1 }; // active tab's history (swapped on tab switch)
    let _labSnapshotTimer = null;

    function _labHistoryFor(tabId) {
        let h = _labHistories.get(tabId);
        if (!h) {
            h = { stack: [], index: -1 };
            _labHistories.set(tabId, h);
        }
        return h;
    }

    // Point the active history reference at the given tab's stack, creating one
    // on first visit. Must be called BEFORE mojoLabInit loads the tab's graph so
    // that the seed snapshot (and any subsequent edits) land in the right stack.
    function mojoLabSetActiveHistoryTab(tabId) {
        _labHistory = tabId ? _labHistoryFor(tabId) : { stack: [], index: -1 };
    }

    // Drop a closed tab's history so it doesn't linger in memory.
    window.mojoLabDiscardHistory = function (tabId) {
        _labHistories.delete(tabId);
    };

    function mojoLabSnapshot() {
        if (!_lab.graph) return;
        const state = _labNormalizedSnapshot();
        if (_labHistory.stack[_labHistory.index] === state) return;
        _labHistory.stack = _labHistory.stack.slice(0, _labHistory.index + 1);
        _labHistory.stack.push(state);
        if (_labHistory.stack.length > _LAB_HIST_MAX) _labHistory.stack.shift();
        else _labHistory.index++;
        _labNotifyDirtyChange();
    }

    function mojoLabDeferredSnapshot() {
        clearTimeout(_labSnapshotTimer);
        _labSnapshotTimer = setTimeout(mojoLabSnapshot, 400);
    }

    // Run any pending deferred snapshot immediately - used before reading the
    // graph for persistence (e.g. switching tabs) so the undo stack's top entry
    // matches exactly what gets stored on the tab.
    function mojoLabFlushSnapshot() {
        if (_labSnapshotTimer) {
            clearTimeout(_labSnapshotTimer);
            _labSnapshotTimer = null;
            mojoLabSnapshot();
        }
    }
    window.mojoLabFlushSnapshot = mojoLabFlushSnapshot;

    function mojoLabClearHistory() {
        _labHistory.stack = [];
        _labHistory.index = -1;
    }

    // mojoLabSnapshot is the only other place that notifies the dirty callback,
    // and undo/redo don't go through it (they jump directly to a stack entry
    // via configure()) - without this, tab.dirty stays stuck at whatever it was
    // the instant before the undo/redo, even when the restored graph now matches
    // (or no longer matches) the baseline. e.g. move a node, undo back to the
    // original position - the dot would keep showing dirty forever.
    function _labNotifyDirtyChange() {
        if (window.mojoLabOnDirtyChange) window.mojoLabOnDirtyChange(window.mojoLabHasUnsavedChanges());
    }

    window.mojoLabUndo = function () {
        if (!_lab.graph || _labHistory.index <= 0) return;
        _labHistory.index--;
        _lab.graph.configure(JSON.parse(_labHistory.stack[_labHistory.index]));
        mojoLabRefreshSiColors();
        if (_lab.canvas) _lab.canvas.setDirty(true, true);
        _labNotifyDirtyChange();
    };

    window.mojoLabRedo = function () {
        if (!_lab.graph || _labHistory.index >= _labHistory.stack.length - 1) return;
        _labHistory.index++;
        _lab.graph.configure(JSON.parse(_labHistory.stack[_labHistory.index]));
        mojoLabRefreshSiColors();
        if (_lab.canvas) _lab.canvas.setDirty(true, true);
        _labNotifyDirtyChange();
    };

    // Discard in-progress edits: restore the live graph to the last saved/loaded
    // baseline so that closing the lab doesn't snapshot the dirty state into the tab.
    window.mojoLabRevertToSaved = function () {
        const baseline = window.mojoLabGetBaseline ? window.mojoLabGetBaseline() : null;
        if (!_lab.graph || baseline === null) return;
        _lab.graph.configure(JSON.parse(baseline));
        mojoLabRefreshSiColors();
        if (_lab.canvas) _lab.canvas.setDirty(true, true);
        mojoLabClearHistory();
        mojoLabSnapshot();
    };


    // savedViewport: the tab's remembered pan/zoom ({scale, offset}), restored onto the
    // canvas after the graph loads. Falls back to graph.extra.viewport (e.g. a lab freshly
    // loaded from its saved schema file, before any tab has cached a viewport for it).
    //
    // Note there is no "savedBaseline" parameter: the active tab's baseline lives only
    // in trial-viewer.ts (LabTab.savedState) and is always read live via
    // window.mojoLabGetBaseline - see the "Unsaved-changes tracking" comment above.
    function mojoLabInit(canvasEl, columns, savedGraph, savedViewport) {
        mojoLabRegisterNodes(columns);

        if (!_lab.graph) {
            _lab.graph = new LGraph();
        }

        // Re-create canvas if the element changed (e.g. after DOM re-render)
        if (!_lab.canvas || _lab.canvas.canvas !== canvasEl) {
            if (_lab.canvas) _lab.canvas.stopRendering();
            _lab.canvas = new LGraphCanvas(canvasEl, _lab.graph);

            // Remove "Mode" from node menu (irrelevant LiteGraph execution mode).
            // Also inject "Save selection as Template" when 2+ nodes are selected.
            const _origMenu = LGraphCanvas.prototype.getNodeMenuOptions;
            LGraphCanvas.prototype.getNodeMenuOptions = function (node) {
                const opts = _origMenu.call(this, node).filter((o) => !o || o.content !== "Mode");
                const sel = Object.values(this.selected_nodes || {});
                if (sel.length >= 2) {
                    opts.push(null);
                    opts.push({
                        content: "Extract selection as new Lab…",
                        callback: () => {
                            // capture IDs NOW — the dialog is async and LiteGraph may
                            // clear selected_nodes while it is open
                            const capturedIds = sel.map(n => n.id);
                            window.mojoPrompt?.({
                                title: "Extract selection as new Lab",
                                message: "New lab name (or folder/name):",
                                placeholder: "name or folder/name",
                                confirmLabel: "Create"
                            }).then(name => {
                                if (name) void _labSaveSelectionAsLab(name, capturedIds);
                            });
                        }
                    });
                }
                return opts;
            };

            _lab.canvas.render_shadows = false;
            _lab.canvas.render_canvas_border = false;
            _lab.canvas.render_curved_connections = true;
            _lab.canvas.always_render_background = true;

            // Draw empty-state hint directly on the canvas so it is always
            // behind nodes (not a DOM overlay) and reflects actual graph state.
            _lab.canvas.onDrawBackground = function (ctx) {
                if (_lab.graph && _lab.graph._nodes && _lab.graph._nodes.length > 0) return;
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = "#475569"; // slate-600
                ctx.font = "italic 13px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Right-click to add nodes", this.canvas.width / 2, this.canvas.height / 2);
                ctx.restore();
            };

            if (_lab.ro) _lab.ro.disconnect();
            _lab.ro = new ResizeObserver(() => mojoLabResize(canvasEl));
            _lab.ro.observe(canvasEl.parentElement);

            // Wire change detection for undo history.
            // Node drags end on mouseup - snapshot immediately so Ctrl+Z works without delay.
            if (_lab._mouseupHandler) canvasEl.removeEventListener('mouseup', _lab._mouseupHandler);
            _lab._mouseupHandler = mojoLabSnapshot;
            canvasEl.addEventListener('mouseup', _lab._mouseupHandler, { passive: true });
        }


        // Graph-level hooks (always re-assign in case graph was cleared/replaced)
        const _onNodeChange = () => {
            mojoLabDeferredSnapshot();
            if (!_lab.graph) return;
            (_lab.graph._nodes || []).forEach(n => {
                const t = (n.type || '').split('/').pop();
                if (t === 'signal_out') _soColor(n);
            });
            mojoLabRefreshSiColors();
        };
        _lab.graph.onNodeAdded = _onNodeChange;
        _lab.graph.onNodeRemoved = _onNodeChange;
        _lab.graph.onConnectionChange = () => { mojoLabDeferredSnapshot(); mojoLabRefreshSiColors(); };

        // canvas-level hook: fires after each node drag completes (LiteGraph sets this on the
        // canvas, not the graph, so it must be re-assigned here on every init/tab-switch)
        _lab.canvas.onNodeMoved = mojoLabSnapshot;

        mojoLabResize(canvasEl);
        canvasEl.focus();

        if (savedGraph) {
            const parsed = JSON.parse(
                typeof savedGraph === "string" ? savedGraph : JSON.stringify(savedGraph)
            );
            _lab.graph.configure(parsed);
            // Restore the remembered pan/zoom: prefer the tab's own cached viewport
            // (kept off graph.extra - see mojoLabGetViewport), falling back to the
            // viewport embedded in the loaded graph itself (e.g. on first load from
            // the saved schema file, before any tab has cached one).
            const vp = savedViewport || (parsed.extra && parsed.extra.viewport);
            if (vp && _lab.canvas) {
                _lab.canvas.ds.scale = vp.scale;
                _lab.canvas.ds.offset = [vp.offset[0], vp.offset[1]];
                _lab.canvas.setDirty(true, true);
            }
        } else {
            // blank tab or explicit clear — wipe any lingering nodes from the previous graph
            _lab.graph.clear();
        }

        // First time this tab's content has been configured (no baseline yet,
        // e.g. a brand new blank tab or a lab loaded for the first time): the
        // just-configured graph becomes the clean baseline. A tab that already
        // has a baseline (returning to a previously-visited tab, or a
        // previously-saved/edited lab) keeps it untouched - mojoLabGetBaseline
        // always reflects the active tab's true baseline, so there's no
        // "establish it before X" ordering to get wrong here.
        if (window.mojoLabGetBaseline && window.mojoLabGetBaseline() === null) {
            window.mojoLabRebaseline();
        }

        // Seed history with the initial state on first open (or after mojoLabClearHistory).
        if (_labHistory.stack.length === 0) mojoLabSnapshot();
    }

    function mojoLabResize(canvasEl) {
        const p = canvasEl.parentElement;
        if (!p) return;
        canvasEl.width = p.clientWidth;
        canvasEl.height = p.clientHeight;
        if (_lab.canvas) {
            _lab.canvas.dirty_canvas = true;
            _lab.canvas.dirty_bgcanvas = true;
        }
    }

    // Serialize the graph for persistence (tab switches + saving to the schema
    // file), stamping the current pan/zoom into extra.viewport on the *returned
    // copy* only - graph.extra itself is left untouched so that merely panning
    // or zooming the canvas can never make the live graph differ from the undo
    // history / dirty-check baseline (both of which serialize the live graph
    // directly). The viewport still round-trips correctly because configure()
    // restores graph.extra wholesale from whatever was loaded/persisted.
    function mojoLabSerialize() {
        if (!_lab.graph) return null;
        const data = _lab.graph.serialize();
        if (_lab.canvas) {
            data.extra = Object.assign({}, data.extra, {
                viewport: {
                    scale: _lab.canvas.ds.scale,
                    offset: [_lab.canvas.ds.offset[0], _lab.canvas.ds.offset[1]],
                },
            });
        }
        return data;
    }
    window.mojoLabSerialize = mojoLabSerialize;

    function mojoLabClear() {
        if (!_lab.graph) return;
        _lab.graph.clear();
        mojoLabDeferredSnapshot();
    }

    // ── Per-node color helpers (module scope so mojoLabSetContext can call them) ──
    function _siColor(node) {
        const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"] || {};
        const cols = SiCtor._columns || [];
        const cyclicCols = SiCtor._cyclicCols || new Map();
        const col = node.properties && node.properties.column;
        const isCyclic = col && cyclicCols.has(col);
        const notInTrial = col && !cols.includes(col);
        node.color = (isCyclic || notInTrial) ? "#78350f" : "#14532d";
        // cyclic gets two warning lines (110), not-in-trial gets one (96), normal (78)
        node.size[1] = isCyclic ? 110 : (notInTrial ? 96 : 78);
    }

    function _soColor(node) {
        const SoCtor = LiteGraph.registered_node_types["Signal/signal_out"] || {};
        const nameMap = SoCtor._existingNames || new Map();
        const cyclicOutputs = SoCtor._cyclicOutputs || new Set();
        const lbl = (node.properties && node.properties.label) || '';
        const connected = node.inputs && node.inputs[0] && node.inputs[0].link != null;
        const collision = !!(lbl && nameMap.has(lbl));
        const duplicate = !!(lbl && _lab.graph && (_lab.graph._nodes || []).some(
            n => n !== node && (n.type || '').endsWith('signal_out') && (n.properties.label || '') === lbl
        ));
        const isCyclic = !!(lbl && cyclicOutputs.has(lbl));
        node.color = (collision || duplicate || isCyclic) ? "#78350f" : "#164e63";
        node.size[1] = collision ? 85 : ((duplicate || isCyclic || (lbl && !connected)) ? 72 : 55);
    }

    function _tmplColor(node, schemas) {
        const name = (node.properties && node.properties.name) || '';
        const schema = name ? (schemas || []).find(s => s.name === name) : null;
        const nPorts = Math.max((node.inputs || []).length, (node.outputs || []).length, 1);
        const baseH = Math.max(78, 56 + nPorts * 20);
        let stale = false;
        if (name && node.inputs && node.inputs.length > 0) {
            // a template has been picked — check whether its ports still match the saved schema
            if (!schema || !schema.is_template) {
                stale = true; // template lab was deleted or no longer a template
            } else {
                const curIn = (node.inputs || []).map(i => i.name);
                const curOut = (node.outputs || []).map(o => o.name);
                const expIn = schema.template_inputs || [];
                const expOut = schema.template_outputs || [];
                stale = !(
                    curIn.length === expIn.length &&
                    curOut.length === expOut.length &&
                    expIn.every((l, i) => curIn[i] === l) &&
                    expOut.every((l, i) => curOut[i] === l)
                );
            }
        }
        node._tmplStale = stale;
        node.color = stale ? "#78350f" : "#4a044e";   // amber-900 stale / fuchsia-950 normal
        node.size[1] = stale ? baseH + 14 : baseH;
    }

    // Update validation context - called from Alpine when lab opens or labSchemas refreshes.
    // cols: current trial columns; schemas: saved lab list; currentName: lab being edited (excluded).
    function mojoLabSetContext(cols, schemas, currentName) {
        _labContext = { cols: cols || [], schemas: schemas || [], currentName: currentName || '' };

        const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"];
        if (SiCtor) SiCtor._columns = cols;
        const SoCtor = LiteGraph.registered_node_types["Signal/signal_out"];
        if (SoCtor) {
            // Only flag raw trial-column conflicts. Other labs use namespaced paths
            // (Lab/name/out) so their short output labels don't collide with ours.
            const nameMap = new Map();
            cols.filter(c => !c.startsWith('Lab/')).forEach(c => nameMap.set(c, "trial column"));
            SoCtor._existingNames = nameMap;
        }
        _computeAndStoreCyclicCols();
        if (_lab.graph) {
            (_lab.graph._nodes || []).forEach(n => {
                const t = (n.type || '').split('/').pop();
                if (t === 'signal_in') _siColor(n);
                else if (t === 'signal_out') _soColor(n);
                else if (t === 'template_ref') _tmplColor(n, schemas);
            });
            _lab.graph.setDirtyCanvas(true, false);
        }
    }

    // Reset all cycle-related visual state - called at each early-return path.
    function _clearCycle() {
        const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"];
        const SoCtor = LiteGraph.registered_node_types["Signal/signal_out"];
        if (SiCtor) SiCtor._cyclicCols = new Map();
        if (SoCtor) SoCtor._cyclicOutputs = new Set();
        if (!_lab.graph) return;
        Object.values(_lab.graph.links || {}).forEach(link => { delete link.color; });
        (_lab.graph._nodes || []).forEach(n => {
            const t = (n.type || '').split('/').pop();
            if (t !== 'signal_in' && t !== 'signal_out') delete n.color;
        });
    }

    // Recompute which Signal In columns would create a cross-lab cycle and recolor.
    // Called whenever Signal Out labels or nodes change within the graph.
    function _computeAndStoreCyclicCols() {
        const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"];
        if (!SiCtor) return;
        const { schemas, currentName } = _labContext;
        if (!currentName) { _clearCycle(); return; }

        // Full-path outputs the current lab produces: Lab/<currentName>/<label>
        const currentFullPaths = new Set();
        (_lab.graph ? _lab.graph._nodes : []).forEach(n => {
            if ((n.type || '').endsWith('signal_out') && n.properties && n.properties.label)
                currentFullPaths.add(`Lab/${currentName}/${n.properties.label}`);
        });
        if (currentFullPaths.size === 0) { _clearCycle(); return; }

        // Full-path → lab name (Signal In columns store the full path, e.g. Lab/name/out)
        const outputToLab = new Map();
        (schemas || []).forEach(s => {
            if (s.name === currentName) return;
            s.outputs.forEach(o => {
                const fp = `Lab/${s.name}/${o}`;
                if (!outputToLab.has(fp)) outputToLab.set(fp, s.name);
            });
        });

        // Labs that directly consume any of the current lab's full-path outputs
        const directDependents = new Set();
        (schemas || []).forEach(s => {
            if (s.name === currentName) return;
            if (s.signal_in_columns.some(c => currentFullPaths.has(c))) directDependents.add(s.name);
        });
        if (directDependents.size === 0) { _clearCycle(); return; }

        // BFS: expand to all labs that transitively consume current lab's outputs
        const allDependents = new Set(directDependents);
        let changed = true;
        while (changed) {
            changed = false;
            (schemas || []).forEach(s => {
                if (allDependents.has(s.name) || s.name === currentName) return;
                if (s.signal_in_columns.some(c => {
                    const p = outputToLab.get(c);
                    return p && allDependents.has(p);
                })) { allDependents.add(s.name); changed = true; }
            });
        }

        // Pre-compute ALL columns from dependent labs that would create a cycle.
        // Using the full outputToLab map (not just columns currently in use) means
        // the picker and _siColor work correctly before the user has selected anything.
        const cyclicCols = new Map();
        outputToLab.forEach((labName, col) => {
            if (allDependents.has(labName)) cyclicCols.set(col, labName);
        });
        SiCtor._cyclicCols = cyclicCols;

        // Forward BFS from SI nodes that are actually using a cyclic column.
        // Only nodes and links reachable from those SI nodes are part of this cycle -
        // disconnected clean sub-graphs should not be colored amber.
        const cyclicNodeIds = new Set();
        const cyclicLinkIds = new Set();
        if (_lab.graph) {
            const queue = [];
            (_lab.graph._nodes || []).forEach(n => {
                if ((n.type || '').endsWith('signal_in')) {
                    const col = n.properties && n.properties.column;
                    if (col && cyclicCols.has(col)) queue.push(n.id);
                }
            });
            const visited = new Set();
            while (queue.length) {
                const nid = queue.shift();
                if (visited.has(nid)) continue;
                visited.add(nid);
                cyclicNodeIds.add(nid);
                const node = _lab.graph.getNodeById(nid);
                if (!node || !node.outputs) continue;
                node.outputs.forEach(out => {
                    (out.links || []).forEach(lid => {
                        const link = _lab.graph.links[lid];
                        if (!link) return;
                        cyclicLinkIds.add(lid);
                        if (!visited.has(link.target_id)) queue.push(link.target_id);
                    });
                });
            }
        }

        const SoCtor = LiteGraph.registered_node_types["Signal/signal_out"];
        if (SoCtor) {
            const cyclicOutputs = new Set();
            if (_lab.graph) {
                (_lab.graph._nodes || []).forEach(n => {
                    if ((n.type || '').endsWith('signal_out') && cyclicNodeIds.has(n.id) && n.properties && n.properties.label)
                        cyclicOutputs.add(n.properties.label);
                });
            }
            SoCtor._cyclicOutputs = cyclicOutputs;
        }
        if (_lab.graph) {
            Object.keys(_lab.graph.links || {}).forEach(lid => {
                if (cyclicLinkIds.has(+lid)) _lab.graph.links[lid].color = "#d97706";
                else delete _lab.graph.links[lid].color;
            });
            (_lab.graph._nodes || []).forEach(n => {
                const t = (n.type || '').split('/').pop();
                if (t !== 'signal_in' && t !== 'signal_out') {
                    if (cyclicNodeIds.has(n.id)) n.color = "#78350f";
                    else delete n.color;
                }
            });
        }
    }

    // Auto-arrange nodes using a layered DAG layout (Sugiyama-style).
    //
    // Step 1 - layer assignment: longest-path from sources (Kahn's BFS).
    // Step 2 - crossing reduction: barycenter heuristic with 4 alternating
    //          forward/backward sweeps. Each sweep re-orders a layer by the
    //          average rank of its neighbors in the adjacent layer.
    //          Source nodes (depth 0) are seeded by their current Y so
    //          the user's rough vertical intent is preserved.
    // Step 3 - coordinate assignment: columns left-to-right, nodes top-to-bottom.
    window.mojoLabArrange = function () {
        if (!_lab.graph) return;
        const nodes = _lab.graph._nodes || [];
        if (nodes.length === 0) return;

        // ── Step 1: build adjacency + assign layers ───────────────────────────
        const succs = new Map();   // id -> id[]
        const preds = new Map();   // id -> id[]
        nodes.forEach(n => { succs.set(n.id, []); preds.set(n.id, []); });
        Object.values(_lab.graph.links || {}).forEach(link => {
            if (succs.has(link.origin_id) && succs.has(link.target_id)) {
                succs.get(link.origin_id).push(link.target_id);
                preds.get(link.target_id).push(link.origin_id);
            }
        });

        // Longest path from sources via Kahn's BFS.
        const layerOf = new Map(nodes.map(n => [n.id, 0]));
        const inDeg = new Map(nodes.map(n => [n.id, preds.get(n.id).length]));
        const q = nodes.filter(n => inDeg.get(n.id) === 0).map(n => n.id);
        while (q.length) {
            const nid = q.shift();
            for (const sid of succs.get(nid)) {
                const d = layerOf.get(nid) + 1;
                if (d > layerOf.get(sid)) layerOf.set(sid, d);
                const deg = inDeg.get(sid) - 1;
                inDeg.set(sid, deg);
                if (deg === 0) q.push(sid);
            }
        }

        // Group into ordered layers.
        const layerMap = new Map();
        nodes.forEach(n => {
            const d = layerOf.get(n.id) ?? 0;
            if (!layerMap.has(d)) layerMap.set(d, []);
            layerMap.get(d).push(n);
        });
        const layers = [...layerMap.keys()].sort((a, b) => a - b).map(d => layerMap.get(d));

        // ── Step 2: crossing reduction (barycenter heuristic) ────────────────
        // Seed source layer by current Y to respect the user's rough ordering.
        layers[0].sort((a, b) => a.pos[1] - b.pos[1]);

        // rank[id] = fractional position within its layer (0-based index after sort).
        const rank = new Map();
        layers.forEach(layer => layer.forEach((n, i) => rank.set(n.id, i)));

        for (let pass = 0; pass < 4; pass++) {
            // Forward sweep: sort each layer by average rank of predecessors.
            for (let li = 1; li < layers.length; li++) {
                layers[li].forEach(n => {
                    const ps = preds.get(n.id);
                    rank.set(n.id, ps.length
                        ? ps.reduce((s, pid) => s + rank.get(pid), 0) / ps.length
                        : rank.get(n.id));
                });
                layers[li].sort((a, b) => rank.get(a.id) - rank.get(b.id));
                layers[li].forEach((n, i) => rank.set(n.id, i));
            }

            // Backward sweep: sort each layer by average rank of successors.
            for (let li = layers.length - 2; li >= 0; li--) {
                layers[li].forEach(n => {
                    const ss = succs.get(n.id);
                    rank.set(n.id, ss.length
                        ? ss.reduce((s, sid) => s + rank.get(sid), 0) / ss.length
                        : rank.get(n.id));
                });
                layers[li].sort((a, b) => rank.get(a.id) - rank.get(b.id));
                layers[li].forEach((n, i) => rank.set(n.id, i));
            }
        }

        // ── Step 3: assign pixel coordinates ─────────────────────────────────
        const COL_GAP = 60;
        const ROW_GAP = 36;
        const START_X = 60;
        const START_Y = 60;

        let x = START_X;
        layers.forEach(layer => {
            const maxW = Math.max(...layer.map(n => n.size[0]));
            let y = START_Y;
            layer.forEach(n => {
                n.pos[0] = x;
                n.pos[1] = y;
                y += n.size[1] + ROW_GAP;
            });
            x += maxW + COL_GAP;
        });

        // refit group bounding boxes to encompass their nodes' new positions
        // (group membership is geometric; we snapshot which nodes overlapped each
        //  group before the arrange and then wrap them in their new positions)
        const groups = _lab.graph._groups || [];
        if (groups.length > 0) {
            // build a set of node ids that were inside each group before arrange
            // (we use the PRE-arrange positions which are now already updated above,
            //  so we use a "close enough" heuristic: any node whose new center is
            //  nearest to a group gets claimed by that group if it was in ANY group)
            const PAD = 20;
            groups.forEach(g => {
                // find nodes whose center falls within this group's original bounds
                const gMemberIds = new Set();
                nodes.forEach(n => {
                    const cx = n.pos[0] + n.size[0] / 2;
                    const cy = n.pos[1] + n.size[1] / 2;
                    // use the group's bounding box (pos is top-left, size is w×h)
                    const gx = g.pos[0], gy = g.pos[1];
                    const gw = (g.size && g.size[0]) || 200;
                    const gh = (g.size && g.size[1]) || 100;
                    if (cx >= gx && cx <= gx + gw && cy >= gy && cy <= gy + gh) {
                        gMemberIds.add(n.id);
                    }
                });
                if (gMemberIds.size === 0) return;
                const members = nodes.filter(n => gMemberIds.has(n.id));
                const x1 = Math.min(...members.map(n => n.pos[0])) - PAD;
                const y1 = Math.min(...members.map(n => n.pos[1])) - PAD - 30; // title bar
                const x2 = Math.max(...members.map(n => n.pos[0] + n.size[0])) + PAD;
                const y2 = Math.max(...members.map(n => n.pos[1] + n.size[1])) + PAD;
                g.pos[0] = x1;
                g.pos[1] = y1;
                if (g.size) { g.size[0] = x2 - x1; g.size[1] = y2 - y1; }
            });
        }

        if (_lab.canvas) _lab.canvas.setDirty(true, true);
        mojoLabDeferredSnapshot();
    };

    // Fit the canvas view to show all nodes, centered and scaled to fill the viewport.
    // LiteGraph uses: canvas_pos = (graph_pos + offset) * scale, so:
    //   offset = canvas_center / scale - graph_center
    window.mojoLabFitView = function () {
        if (!_lab.canvas) return;
        const nodes = (_lab.graph && _lab.graph._nodes) || [];
        if (nodes.length === 0) {
            _lab.canvas.ds.scale = 1;
            _lab.canvas.ds.offset = [0, 0];
            _lab.canvas.setDirty(true, true);
            return;
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        nodes.forEach(n => {
            minX = Math.min(minX, n.pos[0]);
            minY = Math.min(minY, n.pos[1]);
            maxX = Math.max(maxX, n.pos[0] + n.size[0]);
            maxY = Math.max(maxY, n.pos[1] + n.size[1]);
        });
        const PAD = 60;
        const graphW = maxX - minX + PAD * 2;
        const graphH = maxY - minY + PAD * 2;
        const cw = _lab.canvas.canvas.width;
        const ch = _lab.canvas.canvas.height;
        const scale = Math.min(Math.max(Math.min(cw / graphW, ch / graphH), 0.2), 2.0);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        _lab.canvas.ds.scale = scale;
        _lab.canvas.ds.offset = [cw / (2 * scale) - cx, ch / (2 * scale) - cy];
        _lab.canvas.setDirty(true, true);
    };

    function mojoLabRefreshSiColors() {
        _computeAndStoreCyclicCols();
        if (!_lab.graph) return;
        (_lab.graph._nodes || []).forEach(n => {
            const t = (n.type || '').split('/').pop();
            if (t === 'signal_in') _siColor(n);
            else if (t === 'signal_out') _soColor(n);
            else if (t === 'template_ref') _tmplColor(n, _labContext.schemas);
        });
        _lab.graph.setDirtyCanvas(true, false);
    }

    // ── Template helpers (module scope) ───────────────────────────────────────

    function _tmplInLabels(graph) {
        return (graph.nodes || [])
            .filter(n => (n.type || '').split('/').pop() === 'template_in')
            .map(n => (n.properties && n.properties.label) || 'in');
    }

    function _tmplOutLabels(graph) {
        return (graph.nodes || [])
            .filter(n => (n.type || '').split('/').pop() === 'template_out')
            .map(n => (n.properties && n.properties.label) || 'out');
    }

    function _tmplApplyPorts(node, graph) {
        const inLabels = _tmplInLabels(graph);
        const outLabels = _tmplOutLabels(graph);
        // only touch ports if they differ — removing and re-adding breaks existing connections
        const curIn = (node.inputs || []).map(i => i.name);
        const curOut = (node.outputs || []).map(o => o.name);
        const same =
            curIn.length === inLabels.length &&
            curOut.length === outLabels.length &&
            inLabels.every((l, i) => curIn[i] === l) &&
            outLabels.every((l, i) => curOut[i] === l);
        if (!same) {
            while (node.inputs && node.inputs.length > 0) node.removeInput(0);
            while (node.outputs && node.outputs.length > 0) node.removeOutput(0);
            inLabels.forEach(l => node.addInput(l, "series"));
            outLabels.forEach(l => node.addOutput(l, "series"));
        }
        const name = (node.properties && node.properties.name) || '';
        const allLabels = inLabels.concat(outLabels);
        node.size[0] = Math.max(200, name.length * 7 + 80, ...allLabels.map(l => l.length * 7 + 80));
        node.size[1] = Math.max(78, 56 + Math.max(inLabels.length, outLabels.length, 1) * 20);
    }

    function _tmplLoad(node) {
        const name = node.properties && node.properties.name;
        if (!name) return;
        const safePath = name.split('/').map(encodeURIComponent).join('/');
        fetch(`/mosaic/api/lab/${safePath}`)
            .then(r => {
                if (!r.ok) throw new Error(`Lab "${name}" not found`);
                return r.json();
            })
            .then(graph => {
                node.properties.graph = graph;
                _tmplApplyPorts(node, graph);
                if (_lab.graph) _lab.graph.setDirtyCanvas(true, true);
            })
            .catch(err => alert(String(err)));
    }

    // ── Selection → Lab extraction ────────────────────────────────────────────
    // capturedIds must be passed in from the right-click callback BEFORE showing
    // any dialog, because the dialog is async and LiteGraph may clear selected_nodes
    // while it is open.
    // graph.serialize() is used so links are always [lid,from,fSlot,to,tSlot,type]
    // arrays — the live graph.links stores Link class instances, not arrays.

    function _labExtractSelection(capturedIds) {
        if (!_lab.graph) return null;
        const selectedIds = new Set(capturedIds || []);
        if (selectedIds.size < 1) return null;

        // use the serialized graph — correct wire format throughout
        const s = _lab.graph.serialize();
        const serialNodes = (s.nodes || []).filter(n => selectedIds.has(n.id));
        if (serialNodes.length < 1) return null;

        // partition serialized links (guaranteed arrays)
        const internalLinkIds = new Set();
        const externalInputs = [];
        const externalOutputs = [];

        (s.links || []).forEach(lnk => {
            const [lid, fromId, fromSlot, toId, toSlot] = lnk;
            const fIn = selectedIds.has(fromId);
            const tIn = selectedIds.has(toId);
            if (fIn && tIn) internalLinkIds.add(lid);
            else if (!fIn && tIn) externalInputs.push(lnk);
            else if (fIn && !tIn) externalOutputs.push(lnk);
        });

        // deep-copy serialized nodes, clearing external link references
        const nodes = serialNodes.map(n => {
            const c = JSON.parse(JSON.stringify(n));
            (c.inputs || []).forEach(inp => {
                if (inp.link != null && !internalLinkIds.has(inp.link)) inp.link = null;
            });
            (c.outputs || []).forEach(out => {
                if (out.links) out.links = out.links.filter(lid => internalLinkIds.has(lid));
            });
            return c;
        });

        // placement: Template In nodes to the left, Template Out to the right
        const minX = Math.min(...serialNodes.map(n => n.pos[0]));
        const maxX = Math.max(...serialNodes.map(n => n.pos[0] + (n.size ? n.size[0] : 200)));
        const minY = Math.min(...serialNodes.map(n => n.pos[1]));

        // allocate IDs above the graph's current high-water mark
        let nextId = (s.last_node_id || 0) + 1;
        let nextLid = (s.last_link_id || 0) + 1;

        const tmplInNodes = [];
        const tmplOutNodes = [];
        const newLinks = [];

        // one Template In per unique (fromId, fromSlot) — avoids duplicate stubs
        const inputPortMap = new Map();
        externalInputs.forEach(([lid, fromId, fromSlot, toId, toSlot]) => {
            const key = `${fromId}:${fromSlot}`;
            if (!inputPortMap.has(key)) {
                const srcNode = _lab.graph.getNodeById(fromId);
                let label = `in_${tmplInNodes.length}`;
                if (srcNode) {
                    const t = (srcNode.type || '').split('/').pop();
                    if (t === 'signal_in') label = (srcNode.properties && srcNode.properties.column) || label;
                    else if (srcNode.outputs && srcNode.outputs[fromSlot]) label = srcNode.outputs[fromSlot].name || label;
                }
                const tid = nextId++;
                inputPortMap.set(key, { tid, label });
                tmplInNodes.push({
                    id: tid, type: 'Template/template_in', title: 'Template In',
                    pos: [minX - 240, minY + tmplInNodes.length * 80],
                    size: [180, 55], flags: {}, mode: 0,
                    properties: { label },
                    inputs: [],
                    outputs: [{ name: 'signal', type: 'series', links: [] }],
                    widgets_values: [label]
                });
            }
            const { tid } = inputPortMap.get(key);
            const nlid = nextLid++;
            newLinks.push([nlid, tid, 0, toId, toSlot, 'series']);
            const toCopy = nodes.find(n => n.id === toId);
            if (toCopy && toCopy.inputs && toCopy.inputs[toSlot] !== undefined) toCopy.inputs[toSlot].link = nlid;
            const tmplIn = tmplInNodes.find(n => n.id === tid);
            if (tmplIn) tmplIn.outputs[0].links.push(nlid);
        });

        // one Template Out per external output connection
        externalOutputs.forEach(([lid, fromId, fromSlot, toId, toSlot]) => {
            const tgtNode = _lab.graph.getNodeById(toId);
            let label = `out_${tmplOutNodes.length}`;
            if (tgtNode) {
                const t = (tgtNode.type || '').split('/').pop();
                if (t === 'signal_out') label = (tgtNode.properties && tgtNode.properties.label) || label;
                else if (tgtNode.inputs && tgtNode.inputs[toSlot]) label = tgtNode.inputs[toSlot].name || label;
            }
            const tid = nextId++;
            tmplOutNodes.push({
                id: tid, type: 'Template/template_out', title: 'Template Out',
                pos: [maxX + 40, minY + tmplOutNodes.length * 80],
                size: [180, 55], flags: {}, mode: 0,
                properties: { label },
                inputs: [{ name: 'signal', type: 'series', link: null }],
                outputs: [],
                widgets_values: [label]
            });
            const nlid = nextLid++;
            newLinks.push([nlid, fromId, fromSlot, tid, 0, 'series']);
            const fromCopy = nodes.find(n => n.id === fromId);
            if (fromCopy && fromCopy.outputs && fromCopy.outputs[fromSlot])
                fromCopy.outputs[fromSlot].links = [...(fromCopy.outputs[fromSlot].links || []), nlid];
            const tmplOut = tmplOutNodes.find(n => n.id === tid);
            if (tmplOut) tmplOut.inputs[0].link = nlid;
        });

        const internalLinks = (s.links || []).filter(lnk => internalLinkIds.has(lnk[0]));
        return {
            nodes: [...tmplInNodes, ...nodes, ...tmplOutNodes],
            links: [...internalLinks, ...newLinks],
            groups: [],
            config: {},
            version: 0.4,
            last_node_id: nextId,
            last_link_id: nextLid
        };
    }

    async function _labSaveSelectionAsLab(name, capturedIds) {
        const graph = _labExtractSelection(capturedIds);
        if (!graph) { alert('No nodes found in selection.'); return; }
        const exists = (_labContext.schemas || []).some(s => s.name === name);
        if (exists) {
            const ok = await window.mojoConfirm?.({
                title: 'Overwrite lab',
                message: `"${name}" already exists. Replace it with the selected nodes?`,
                confirmLabel: 'Overwrite',
                cancelLabel: 'Cancel',
                variant: 'warning'
            });
            if (!ok) return;
        }
        const safePath = name.split('/').map(encodeURIComponent).join('/');
        try {
            const r = await fetch('/mosaic/api/lab/' + safePath, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(graph)
            });
            if (r.ok) {
                document.dispatchEvent(new CustomEvent('mojo:lab-refresh'));
            } else {
                alert('Save failed: ' + r.statusText);
            }
        } catch (err) {
            alert('Save failed: ' + String(err));
        }
    }

    // Called by Alpine selectNodeTemplate when the user picks a template from the dialog.
    window.mojoLabSelectNodeTemplate = function (nodeId, name) {
        if (!_lab.graph) return;
        const node = _lab.graph.getNodeById(nodeId);
        if (!node) return;
        node.properties.name = name;
        if (node._nw) node._nw.value = name;
        _tmplLoad(node);
    };

    // Exposed for the column picker to flag cyclic entries without Alpine reactivity.
    window.mojoLabIsCyclicInput = function (col) {
        const SiCtor = LiteGraph.registered_node_types["Signal/signal_in"];
        return !!(SiCtor && SiCtor._cyclicCols && SiCtor._cyclicCols.has(col));
    };
</script>

                    class="btn btn-ghost text-sm font-bold text-rose-600 dark:text-rose-400 border-rose-500/40 dark:border-rose-500/30 hover:bg-rose-500/10 uppercase flex items-center gap-1.5 shrink-0"

                    const m = labSchemas.find(l => l.name.startsWith(v) && l.name !== v);
                    if (!m) return '';

                    const sep = rem.indexOf('/');

                },
