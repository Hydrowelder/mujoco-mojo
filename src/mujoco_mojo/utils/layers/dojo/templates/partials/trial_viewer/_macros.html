{% macro color_picker(color_model, ref_name, label, on_change='', width=280) %}
{%- set box_h = (width * 160) // 280 -%}
<div class="space-y-2"
     x-init="$nextTick(() => {
    const picker = window.mojoCreateColorPicker(
        $refs.{{ ref_name }},
        {{ width }},
        {{ box_h }},
        {{ color_model }} || window.themeColor('accent-500'),
    );
    $watch('{{ color_model }}', value => {
        if (value && value !== picker.color.hexString) picker.color.set(value);
    });
    picker.on('color:change', color => {
        if ({{ color_model }} === color.hexString) return;
        {{ color_model }} = color.hexString;
        {% if on_change %}{{ on_change }};{% endif %}
    });
})">
    <div class="flex items-center justify-between mb-1">
        <label class="text-sm font-bold text-ink-secondary uppercase tracking-tight">{{ label }}</label>
        <div class="flex gap-1.5">
            <template x-for="color in plotColors"
                      :key="color">
                <button @click="{{ color_model }} = color{% if on_change %}; {{ on_change }}{% endif %}"
                        class="w-5 h-5 rounded-full border border-white dark:border-canvas shadow-sm transition-transform hover:scale-125 focus:ring-1 focus:ring-accent-500 outline-none"
                        :style="`background-color: ${color}`"
                        :class="{{ color_model }} === color ? 'ring-2 ring-accent-500 scale-110' : ''">
                </button>
            </template>
        </div>
    </div>
    <div class="flex justify-center">
        <div x-ref="{{ ref_name }}"></div>
    </div>
    <div class="flex gap-2 mt-1">
        <div class="relative flex-1">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted font-mono text-sm pointer-events-none">#</span>
            <input type="text"
                   :value="({{ color_model }} || '').replace('#', '')"
                   @input="
                       let v = $event.target.value.replace(/[^a-fA-F0-9]/g, '').substring(0, 6);
                       {{ color_model }} = '#' + v;
                       {% if on_change %}{{ on_change }};{% endif %}
                   "
                   class="w-full pl-7 pr-3 py-2 bg-surface-inset border border-inset rounded-md text-sm font-mono text-accent-700 dark:text-ink-strong outline-none focus:ring-1 focus:ring-accent-500" />
        </div>
        <div class="w-10 h-10 rounded-md border border-inset shadow-inner shrink-0"
             :style="'background-color: ' + ({{ color_model }})"></div>
    </div>
</div>
{% endmacro %}
