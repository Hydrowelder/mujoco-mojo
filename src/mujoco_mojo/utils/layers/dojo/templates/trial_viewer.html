{% extends "base.html" %}
{% block title %}Trial {{ trial_id }} Viewer{% endblock %}

{% block extra_head %}
<script src="/static/plotly-3.4.0.min.js"></script>
<script src="/static/trial-viewer.js"></script>
{% endblock %}

{% block content %}
<div x-data="trialViewer('{{ trial_id }}')" class="space-y-4">

    <div class="flex items-center justify-between border-b border-slate-300 dark:border-slate-700 pb-4">

        <div class="flex items-center gap-4 text-sm font-mono">
            <a href="/mosaic" class="text-slate-500 hover:text-cyan-500 transition-colors">← Back to Mosaic</a>
            <span class="text-slate-300 dark:text-slate-600">/</span>
            <span class="text-cyan-500 font-bold uppercase tracking-widest">{{ trial_id }}</span>
        </div>

        <div class="flex items-center gap-2">
            {% if prev_id %}
            <a href="/mosaic/{{ prev_id }}" id="nav-prev" class="logo-style px-3 py-1 text-xs font-mono font-bold text-slate-500 hover:text-cyan-500 flex items-center gap-1 transition-all">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" />
                </svg>
                PREV
            </a>
            {% else %}
            <span class="px-3 py-1 text-xs font-mono font-bold text-slate-300 dark:text-slate-700 cursor-not-allowed">PREV</span>
            {% endif %}

            <div class="flex items-center group">
                <input type="number" x-model="jumpId" @keyup.enter="jumpToTrial()" placeholder="#" class="logo-style w-14 h-6 text-center bg-transparent border-slate-300 dark:border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/20 outline-none text-[10px] font-mono font-bold text-cyan-500 transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />

                <button x-show="jumpId" @click="jumpToTrial()" x-transition class="ml-1 text-[10px] font-mono font-black text-cyan-500 hover:text-cyan-400 uppercase">
                    Go
                </button>
            </div>

            {% if next_id %}
            <a href="/mosaic/{{ next_id }}" id="nav-next" class="logo-style px-3 py-1 text-xs font-mono font-bold text-slate-500 hover:text-cyan-500 flex items-center gap-1 transition-all">
                NEXT
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" />
                </svg>
            </a>
            {% else %}
            <span class="px-3 py-1 text-xs font-mono font-bold text-slate-300 dark:text-slate-700 cursor-not-allowed">NEXT</span>
            {% endif %}
        </div>
    </div>

    <div class="bg-white dark:bg-slate-800 border border-slate-400 dark:border-slate-700 rounded-2xl shadow-2xl p-4 min-h-[600px] relative">
        <div id="plot-area" class="w-full h-[600px]"></div>

        <template x-if="loading">
            <div class="absolute inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm flex items-center justify-center rounded-2xl">
                <div class="text-center space-y-2">
                    <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs font-mono text-slate-500 uppercase tracking-widest">Querying DuckDB...</p>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}
