{% extends "base.html" %}

{% block title %}Optimizer | MuJoCo Mojo{% endblock %}

{% block content %}
<div class="w-full h-[calc(100vh-300px)] min-h-[600px] rounded-2xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-2xl bg-white">
    <iframe src="/dashboard"
            class="w-full h-full border-none"
            title="Optuna Dashboard">
    </iframe>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener("alpine:init", () => {
        const store = Alpine.store("dojo");

        // Force 'Ready' state and skip the 2-second technobabble delay
        // because the Optuna dashboard has its own internal loading states.
        if (store) {
            store.setPageReady(true, true);
        }
    });

    // Fallback for if Alpine is already initialized (tab switching)
    window.addEventListener('load', () => {
        if (window.Alpine) {
            Alpine.store("dojo").setPageReady(true, true);
        }
    });
</script>
{% endblock %}
