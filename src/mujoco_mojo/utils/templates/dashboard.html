<!doctype html>
<html lang="en">
  <head>
    <title>MuJoCo Mojo Dashboard</title>
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    -->
    <script src="/static/tailwind.min.js"></script>
    <script defer src="/static/alpine.min.js"></script>
    <script>
      tailwind.config = { darkMode: "class" };

      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body
    class="bg-slate-200 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-300"
    x-data="dashboard()"
    x-init="init()"
    x-effect="document.title = `(${status.progress.toFixed(1)}%) Mojo Dashboard`"
  >
    <div class="max-w-6xl mx-auto p-8">
      <header
        class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b border-slate-200 dark:border-slate-700 pb-6 gap-4"
      >
        <div class="flex-1 min-w-0">
          <h1
            class="text-4xl font-black tracking-tight text-cyan-500 dark:text-cyan-400"
          >
            MUJOCO MOJO
          </h1>

          <div class="flex items-center gap-2 mt-1 max-w-[200px] md:max-w-none">
            <span class="text-slate-500 shrink-0 text-sm font-bold"
              >Owner:</span
            >
            <p
              class="font-mono text-slate-600 dark:text-slate-300 text-xs truncate cursor-help flex-1"
              title="{{ job.started_by }}"
            >
              {{ job.started_by }}
            </p>
          </div>
        </div>

        <div
          class="flex flex-col items-start md:items-end gap-3 text-sm text-slate-500 w-full md:w-auto"
        >
          <div class="flex items-center gap-4">
            <div
              x-data="{
          theme: localStorage.theme || 'system',
          setTheme(val) {
              this.theme = val;
              if (val === 'system') {
                  localStorage.removeItem('theme');
                  document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
              } else {
                  localStorage.theme = val;
                  document.documentElement.classList.toggle('dark', val === 'dark');
              }
          }
        }"
              class="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-lg border border-slate-300 dark:border-slate-700"
            >
              <button
                @click="setTheme('light')"
                class="p-1.5 rounded-md transition-all"
                :class="theme === 'light' ? 'bg-white shadow-sm text-amber-500' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </button>
              <button
                @click="setTheme('system')"
                class="p-1.5 rounded-md transition-all"
                :class="theme === 'system' ? 'bg-white/50 dark:bg-slate-700 shadow-sm text-cyan-600 dark:text-cyan-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  />
                </svg>
              </button>
              <button
                @click="setTheme('dark')"
                class="p-1.5 rounded-md transition-all"
                :class="theme === 'dark' ? 'bg-slate-700 shadow-sm text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                  />
                </svg>
              </button>
            </div>

            <a
              href="https://github.com/Hydrowelder/mujoco-mojo"
              target="_blank"
              class="p-2 text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors"
            >
              <svg class="w-7 h-7 fill-current" viewBox="0 0 256 256">
                <path
                  d="M251.172245,116.593517 L139.398753,4.82845302 C132.966433,-1.60948434 122.525852,-1.60948434 116.085106,4.82845302 L92.8753863,28.0381721 L122.317995,57.4807809 C129.16041,55.1690784 137.005593,56.7195763 142.460425,62.1744081 C147.940536,67.6629464 149.479799,75.5755422 147.111919,82.4404282 L175.487156,110.815665 C182.352042,108.450594 190.273064,109.98143 195.755985,115.472777 C203.418591,123.132574 203.418591,135.547794 195.755985,143.213209 C188.09057,150.878624 175.67535,150.878624 168.007126,143.213209 C162.243319,137.443783 160.81922,128.977839 163.737639,121.877008 L137.275245,95.4146135 L137.272436,165.052198 C139.140337,165.979126 140.904309,167.212221 142.460425,168.762719 C150.123031,176.422516 150.123031,188.837736 142.460425,196.508768 C134.79501,204.171375 122.374173,204.171375 114.719993,196.508768 C107.057387,188.837736 107.057387,176.422516 114.719993,168.762719 C116.613174,166.872347 118.804095,165.442631 121.141077,164.481996 L121.141077,94.1955625 C118.804095,93.2405457 116.615983,91.8192558 114.719993,89.9148396 C108.914052,84.1173254 107.518042,75.5980132 110.492639,68.4690928 L81.4713611,39.4421974 L4.83125614,116.076685 C-1.60949009,122.52024 -1.60949009,132.960821 4.83125614,139.398759 L116.604747,251.166631 C123.039876,257.604569 133.477648,257.604569 139.921203,251.166631 L251.172245,139.9184 C257.61018,133.477654 257.61018,123.031455 251.172245,116.593517"
                />
              </svg>
            </a>
          </div>

          <div class="flex items-center gap-2 w-full max-w-[280px] md:max-w-md">
            <span class="text-slate-500 shrink-0 text-sm font-bold"
              >Workdir:</span
            >
            <p
              class="font-mono text-slate-600 dark:text-slate-300 text-xs truncate cursor-help flex-1"
              style="
                direction: rtl;
                text-align: left;
                white-space: nowrap;
                overflow: hidden;
              "
              title="{{ job.workdir }}"
            >
              &lrm;{{ job.workdir }}
            </p>
          </div>
        </div>
      </header>

      <section class="mb-12">
        <div class="flex justify-between mb-2 items-center">
          <span class="text-slate-500 dark:text-slate-400 text-xl font-bold"
            >Overall Progress</span
          >
          <span
            class="text-3xl font-black text-cyan-600 dark:text-cyan-400"
            x-text="status.progress.toFixed(1) + '%'"
          ></span>
        </div>
        <div
          class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-8 overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner"
        >
          <div
            class="bg-gradient-to-r from-cyan-600 to-blue-500 h-full transition-all duration-500 shadow-[0_0_20px_rgba(6,182,212,0.3)]"
            :style="`width: ${status.progress}%`"
            :class="status.is_complete ? 'from-green-500 to-emerald-600' : ''"
          ></div>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <template x-for="(stat, index) in stats" :key="index">
          <div
            class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-md flex flex-col justify-between transition-transform hover:scale-[1.02]"
          >
            <div>
              <p
                class="text-slate-500 dark:text-slate-400 text-xs font-black uppercase tracking-widest mb-2"
                x-text="stat.label"
              ></p>
              <p
                class="text-3xl font-black"
                :class="stat.color"
                x-text="stat.value"
              ></p>
            </div>

            <div
              class="mt-4 border-t border-slate-100 dark:border-slate-700/50 pt-3 flex flex-col gap-1"
            >
              <template x-if="stat.subValue">
                <p
                  class="text-[10px] font-mono uppercase tracking-tighter text-slate-400"
                  x-text="stat.subValue"
                ></p>
              </template>
            </div>
          </div>
        </template>
      </div>

      <section class="mt-8" x-show="status.failure_tns.length > 0" x-cloak>
        <h2 class="text-xl font-bold text-rose-500 mb-4 flex items-center">
          <svg
            class="w-6 h-6 mr-2 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
          Failed Trials
        </h2>
        <div
          class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 max-h-60 overflow-y-auto shadow-inner"
        >
          <div class="flex flex-wrap gap-2">
            <template x-for="tn in status.failure_tns" :key="tn">
              <span
                class="px-3 py-1 bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-500/50 text-rose-600 dark:text-rose-400 rounded-md font-mono text-sm"
                x-text="tn"
              ></span>
            </template>
          </div>
        </div>
      </section>
    </div>

    <footer
      class="max-w-6xl mx-auto p-8 mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 flex flex-row-reverse justify-between items-center text-xs text-slate-400 font-mono"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center gap-2 bg-slate-200 dark:bg-slate-800/50 px-3 py-1 rounded-full border border-slate-300 dark:border-slate-700/50"
        >
          <span
            class="h-1.5 w-1.5 rounded-full"
            :class="status.is_complete ? 'bg-cyan-500' : (secondsSinceUpdate < 10 ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500')"
          ></span>
          <span
            x-text="status.is_complete ? 'Final Data' : `Sync: ${formatTimeAgo(secondsSinceUpdate)}`"
          ></span>
        </div>
        <div><span x-text="status.version || '0.0.0'"></span></div>
      </div>
      <div class="italic opacity-50">&copy; 2026 David Gable</div>
    </footer>

    <!-- mixkit-fantasy-game-success-notification-270 -->
    <audio id="chime" src="/static/chime.mp3" playsinline></audio>

    <script>
      // Helper stays global
      function formatTimeAgo(seconds) {
        if (!seconds || seconds < 60) return `${seconds || 0}s ago`;
        const mins = Math.floor(seconds / 60);
        if (mins < 60) return `${mins}m ago`;
        return `${Math.floor(mins / 60)}h ago`;
      }

      function dashboard() {
        return {
          status: {
            n_done: 0,
            n_success: 0,
            n_failed: 0,
            failure_tns: [],
            progress: 0,
          },
          stats: [],
          lastUpdate: null,
          secondsSinceUpdate: 0,
          timer: null,

          async init() {
            // 1. Establish the timers FIRST.
            // This ensures the heartbeat exists even if the first update fails.
            this.timer = setInterval(() => this.update(), 5000);

            setInterval(() => {
              if (this.lastUpdate) {
                this.secondsSinceUpdate = Math.floor(
                  (Date.now() - this.lastUpdate) / 1000,
                );
              }
            }, 1000);

            // 2. Now try the initial load
            await this.update();
          },

          async update() {
            try {
              const resp = await fetch("/api/status");
              if (!resp.ok) return; // Server is booting, skip this tick

              const data = await resp.json();
              this.status = data;
              this.lastUpdate = Date.now();
              this.secondsSinceUpdate = 0;

              // Safe Math - use || 0 to prevent NaN crashes
              const totalDone = this.status.n_done || 0;
              const n_trial = this.status.n_trial || 1;
              const successPerc =
                totalDone > 0
                  ? ((this.status.n_success / totalDone) * 100).toFixed(1)
                  : 0;
              const failurePerc =
                totalDone > 0
                  ? ((this.status.n_failed / totalDone) * 100).toFixed(1)
                  : 0;
              const donePerc = ((totalDone / n_trial) * 100).toFixed(1);

              const lastSuccess = this.status.last_success_tn || "None";
              const fails = this.status.failure_tns || [];
              const lastFailure =
                fails.length > 0 ? fails[fails.length - 1] : "None";

              this.stats = [
                {
                  label: "Successes",
                  value: `${this.status.n_success} (${successPerc}%)`,
                  color: "text-emerald-500",
                  subValue: `Last Success: Trial ${lastSuccess}`,
                },
                {
                  label: "Failures",
                  value: `${this.status.n_failed} (${failurePerc}%)`,
                  color: "text-rose-500",
                  subValue: `Last Failure: Trial ${lastFailure}`,
                },
                {
                  label: "Remaining",
                  value: `${this.status.n_remaining} (${(100 - donePerc).toFixed(1)}%)`,
                  color: "text-amber-500",
                  subValue: `${this.status.throughput} trials/min (${this.status.avg_duration} per trial)`,
                },
                {
                  label: "Time Elapsed",
                  value: this.status.elapsed,
                  color: "text-slate-400",
                  subValue: `Started: ${this.status.start_time}`,
                },
                {
                  label: "Total Done",
                  value: `${totalDone}`,
                  color: "text-cyan-500",
                  subValue: `Target: ${n_trial} trials`,
                },

                {
                  label: this.status.is_complete
                    ? "Finished"
                    : "Est. Remaining",
                  value: this.status.time_remaining,
                  color: "text-slate-400",
                  subValue: `ETA: ${this.status.end_time}`,
                },
              ];

              if (this.status.is_complete && this.timer) {
                clearInterval(this.timer);
                this.timer = null;
              }

              if (this.status.is_complete && !this.chimePlayed) {
                const chime = document.getElementById("chime");

                // play() returns a promise, it's better to handle it
                chime
                  .play()
                  .then(() => {
                    this.chimePlayed = true;

                    // Use the 'ended' event to release audio focus
                    chime.onended = () => {
                      chime.pause();
                      chime.src = ""; // Clear source temporarily to release focus
                      chime.load(); // Reset the element
                    };
                  })
                  .catch((e) =>
                    console.warn("Audio play blocked by browser:", e),
                  );
              }
            } catch (err) {
              // If the server is killed, we land here.
              // Since the setInterval is already running, it will just keep trying!
              console.warn("Mojo Dashboard: Runner offline, retrying...");
            }
          },
        };
      }
    </script>
  </body>
</html>
