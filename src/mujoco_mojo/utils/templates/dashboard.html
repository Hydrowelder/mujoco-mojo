<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 font-sans"
    x-data="dashboard()"
    x-init="init()"
  >
    <div class="max-w-6xl mx-auto p-8">
      <header
        class="flex justify-between items-end mb-8 border-b border-slate-700 pb-6"
      >
        <div>
          <h1 class="text-4xl font-black tracking-tight text-cyan-400">
            MUJOCO MOJO
          </h1>
          <p class="text-slate-400">
            Job Owner: <span class="text-slate-200">{{ job.started_by }}</span>
          </p>
        </div>
        <div class="text-right text-sm text-slate-500">
          <p>Workdir: <span class="font-mono">{{ job.workdir }}</span></p>
        </div>
      </header>

      <section class="mb-12">
        <div class="flex justify-between mb-2 items-center">
          <span class="text-xl font-bold">Overall Progress</span>
          <span
            class="text-3xl font-black text-cyan-400"
            x-text="status.progress.toFixed(1) + '%'"
          ></span>
        </div>
        <div
          class="w-full bg-slate-800 rounded-full h-8 overflow-hidden border border-slate-700 shadow-2xl"
        >
          <div
            class="bg-gradient-to-r from-cyan-600 to-blue-500 h-full transition-all duration-500 ease-out shadow-[0_0_20px_rgba(6,182,212,0.5)]"
            :style="`width: ${status.progress}%`"
            :class="status.is_complete ? 'from-green-500 to-emerald-600' : ''"
          ></div>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <template x-for="stat in stats">
          <div
            class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg"
          >
            <p
              class="text-slate-400 text-sm uppercase tracking-wider mb-1"
              x-text="stat.label"
            ></p>
            <p
              class="text-3xl font-bold"
              :class="stat.color"
              x-text="stat.value"
            ></p>
          </div>
        </template>
      </div>
      <section class="mt-8" x-show="status.failure_tns.length > 0" x-cloak>
        <h2 class="text-xl font-bold text-rose-500 mb-4 flex items-center">
          <span class="mr-2">❌</span> Failed Trials
        </h2>
        <div
          class="bg-slate-800 border border-slate-700 rounded-xl p-4 max-h-60 overflow-y-auto shadow-inner"
        >
          <div class="flex flex-wrap gap-2">
            <template x-for="tn in status.failure_tns" :key="tn">
              <span
                class="px-3 py-1 bg-rose-900/30 border border-rose-500/50 text-rose-400 rounded-md font-mono text-sm"
                x-text="tn"
              >
              </span>
            </template>
          </div>
        </div>
      </section>
    </div>

    <audio
      id="chime"
      src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
    ></audio>

    <script>
      function dashboard() {
        return {
          status: {
            progress: 0,
            n_success: 0,
            n_failed: 0,
            failure_tns: [],
            time_remaining: "0:00:00",
            is_complete: false,
          },
          stats: [], // Added this to store the cards
          chimePlayed: false,

          // This is the missing piece!
          async init() {
            await this.update(); // Run once immediately
            setInterval(() => this.update(), 2000); // Then every 2 seconds
          },

          async update() {
            try {
              const resp = await fetch("/api/status");
              this.status = await resp.json();

              this.stats = [
                {
                  label: "Successes",
                  value: this.status.n_success,
                  color: "text-emerald-400",
                },
                {
                  label: "Failures",
                  value: this.status.n_failed,
                  color: "text-rose-500",
                },
                {
                  label: "Est. Remaining",
                  value: this.status.time_remaining,
                  color: "text-slate-200",
                },
              ];

              if (this.status.is_complete && !this.chimePlayed) {
                document.getElementById("chime").play();
                this.chimePlayed = true;
              }
            } catch (err) {
              console.error("Dashboard update failed:", err);
            }
          },
        };
      }
    </script>
  </body>
</html>
