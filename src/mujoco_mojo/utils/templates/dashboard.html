<!doctype html>
<html lang="en">
  <head>
    <title>MuJoCo Mojo Dashboard</title>
    <style>
      [x-cloak] {
        display: none !important;
      }
      html {
        background-color: #e2e8f0;
      }
      html.dark {
        background-color: #0f172a;
      }

      #header-logo {
        border: 1px solid #94a3b8;
        border-radius: 0.75rem;
        background-color: #ffffff;
        filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.07))
          drop-shadow(0 2px 2px rgba(0, 0, 0, 0.06));
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.dark #header-logo {
        border: 1px solid #334155;
        background-color: #1e293b;
        filter: none;
      }
      #header-logo:hover {
        transform: scale(1.1);
        border-color: #06b6d4;
        filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6)) !important;
        z-index: 10;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/static/tailwind.min.js"></script>
    <script src="/static/confetti.browser.min.js"></script>
    <script defer src="/static/alpine.min.js"></script>
    <script>
      tailwind.config = { darkMode: "class" };
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <link
      id="favicon"
      rel="icon"
      type="image/svg"
      href="/static/light-logo.svg"
    />
    <script>
      function syncMojoLogos() {
        const isDark = document.documentElement.classList.contains("dark");
        const favicon = document.getElementById("favicon");
        const headerLogo = document.getElementById("header-logo");
        if (isDark) {
          if (favicon) favicon.href = "/static/dark-logo.svg";
          if (headerLogo) headerLogo.src = "/static/dark-logo.svg";
        } else {
          if (favicon) favicon.href = "/static/light-logo.svg";
          if (headerLogo) headerLogo.src = "/static/light-logo.svg";
        }
      }
      window.addEventListener("DOMContentLoaded", syncMojoLogos);
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.attributeName === "class") syncMojoLogos();
        });
      });
      observer.observe(document.documentElement, { attributes: true });
    </script>
  </head>
  <body
    class="min-h-screen bg-slate-200 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-300"
    x-data="dashboard()"
    x-init="init()"
    x-effect="document.title = `(${status.progress.toFixed(1)}%) Mojo Dashboard`"
  >
    <div
      class="fixed top-0 left-0 w-full h-1 z-[100] bg-transparent pointer-events-none"
      x-show="isSyncing"
      x-transition:leave="transition opacity-100 duration-500"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      x-cloak
    >
      <div
        class="h-full transition-all duration-300 ease-out"
        :style="`
    width: ${syncProgress}%;
    background: linear-gradient(to right, transparent 0%, rgba(6, 182, 212, 0.4) 50%, #06b6d4 100%);
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
  `"
      ></div>
    </div>
    <div class="max-w-6xl mx-auto p-4 md:p-8 md:pb-0">
      <header
        class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b border-slate-400 dark:border-slate-700 pb-6 gap-6"
      >
        <div class="flex-1 min-w-0 w-full">
          <div class="flex items-center gap-4 mb-4">
            <a
              href="https://hydrowelder.github.io/mujoco-mojo/"
              target="_blank"
              rel="noopener noreferrer"
              class="transition-transform duration-300 hover:scale-110 active:scale-95"
              title="View Documentation"
            >
              <img
                id="header-logo"
                src="/static/light-logo.svg"
                alt="Mojo Logo"
                class="w-12 h-12 p-1 object-contain cursor-pointer"
              />
            </a>
            <h1 class="text-4xl font-black tracking-tight text-cyan-500">
              MUJOCO MOJO
            </h1>
          </div>

          <div
            class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-400 dark:border-slate-700 shadow-md transition-transform hover:scale-[1.01] space-y-2"
          >
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] uppercase font-black text-slate-500 dark:text-slate-400 w-16 shrink-0"
                >Owner</span
              >
              <p
                class="font-mono text-slate-600 dark:text-slate-300 text-xs truncate"
                title="{{ job.started_by }}"
              >
                {{ job.started_by }}
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] uppercase font-black text-slate-500 dark:text-slate-400 w-16 shrink-0"
                >Workdir</span
              >
              <p
                class="font-mono text-slate-600 dark:text-slate-300 text-xs truncate cursor-help"
                style="direction: rtl; text-align: left"
                title="{{ job.workdir }}"
              >
                &lrm;{{ job.workdir }}
              </p>
            </div>
          </div>
        </div>

        <div
          class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-start md:justify-end"
        >
          <div class="flex items-center h-9">
            <button
              @click="update()"
              class="h-full px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-l-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all hover:scale-110 active:scale-95 group flex items-center gap-2"
              title="Force Refresh Now"
            >
              <svg
                id="refresh-icon"
                class="w-4 h-4"
                :class="isLoading ? 'animate-spin' : ''"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                />
              </svg>
              <span
                class="text-[10px] font-black uppercase tracking-widest hidden sm:inline"
                >Refresh</span
              >
            </button>
            <button
              @click="toggleAutoRefresh()"
              class="h-full px-3 border-y border-r border-slate-300 dark:border-slate-700 rounded-r-lg transition-all hover:scale-105 active:scale-95 flex items-center gap-2"
              :class="isAutoRefresh ? 'bg-cyan-500 text-white border-cyan-600 shadow-inner' : 'bg-slate-100 dark:bg-slate-900 text-slate-400 border-slate-300 dark:border-slate-700'"
              :title="isAutoRefresh ? 'Disable Auto-refresh' : 'Enable Auto-refresh'"
            >
              <div
                class="w-2 h-2 rounded-full shrink-0"
                :class="isAutoRefresh ? 'bg-white animate-pulse shadow-[0_0_8px_white]' : 'bg-slate-400'"
              ></div>
              <span
                class="text-[10px] font-black uppercase tracking-widest hidden sm:inline-block w-10 text-center"
                x-text="isAutoRefresh ? 'Auto' : 'Off'"
              ></span>
            </button>
          </div>

          <button
            @click="isMuted = !isMuted; localStorage.setItem('mojo_muted', isMuted)"
            class="h-9 w-9 rounded-lg border transition-all duration-200 flex items-center justify-center hover:scale-105 active:scale-95"
            :class="isMuted ? 'bg-slate-200 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-400' : 'bg-cyan-50 dark:bg-cyan-900/20 border-cyan-500 text-cyan-500 shadow-sm'"
            :title="isMuted ? 'Unmute completion chime' : 'Mute completion chime'"
          >
            <svg
              x-show="isMuted"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"
              />
            </svg>
            <svg
              x-show="!isMuted"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              x-cloak
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
              />
            </svg>
          </button>

          <div
            x-data="{ theme: localStorage.theme || 'system', setTheme(val) { this.theme = val; if (val === 'system') { localStorage.removeItem('theme'); document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches); } else { localStorage.theme = val; document.documentElement.classList.toggle('dark', val === 'dark'); } } }"
            class="flex h-9 bg-slate-200 dark:bg-slate-800 p-1 rounded-lg border border-slate-300 dark:border-slate-700"
          >
            <button
              @click="setTheme('light')"
              class="px-2 rounded-md transition-all hover:scale-110 active:scale-90"
              :class="theme === 'light' ? 'bg-white shadow-sm text-amber-500' : 'text-slate-500'"
              title="Light Mode"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button
              @click="setTheme('system')"
              class="px-2 rounded-md transition-all hover:scale-110 active:scale-90"
              :class="theme === 'system' ? 'bg-white/50 dark:bg-slate-700 shadow-sm text-cyan-500' : 'text-slate-500'"
              title="Follow System Theme"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button
              @click="setTheme('dark')"
              class="px-2 rounded-md transition-all hover:scale-110 active:scale-90"
              :class="theme === 'dark' ? 'bg-slate-700 shadow-sm text-blue-400' : 'text-slate-500'"
              title="Dark Mode"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>
          </div>

          <a
            href="https://github.com/Hydrowelder/mujoco-mojo"
            target="_blank"
            title="GitHub Repository"
            class="h-9 flex items-center p-2 text-slate-500 hover:text-cyan-500 transition-all hover:scale-110 active:scale-90"
          >
            <svg class="w-7 h-7 fill-current" viewBox="0 0 256 256">
              <path
                d="M251.172245,116.593517 L139.398753,4.82845302 C132.966433,-1.60948434 122.525852,-1.60948434 116.085106,4.82845302 L92.8753863,28.0381721 L122.317995,57.4807809 C129.16041,55.1690784 137.005593,56.7195763 142.460425,62.1744081 C147.940536,67.6629464 149.479799,75.5755422 147.111919,82.4404282 L175.487156,110.815665 C182.352042,108.450594 190.273064,109.98143 195.755985,115.472777 C203.418591,123.132574 203.418591,135.547794 195.755985,143.213209 C188.09057,150.878624 175.67535,150.878624 168.007126,143.213209 C162.243319,137.443783 160.81922,128.977839 163.737639,121.877008 L137.275245,95.4146135 L137.272436,165.052198 C139.140337,165.979126 140.904309,167.212221 142.460425,168.762719 C150.123031,176.422516 150.123031,188.837736 142.460425,196.508768 C134.79501,204.171375 122.374173,204.171375 114.719993,196.508768 C107.057387,188.837736 107.057387,176.422516 114.719993,168.762719 C116.613174,166.872347 118.804095,165.442631 121.141077,164.481996 L121.141077,94.1955625 C118.804095,93.2405457 116.615983,91.8192558 114.719993,89.9148396 C108.914052,84.1173254 107.518042,75.5980132 110.492639,68.4690928 L81.4713611,39.4421974 L4.83125614,116.076685 C-1.60949009,122.52024 -1.60949009,132.960821 4.83125614,139.398759 L116.604747,251.166631 C123.039876,257.604569 133.477648,257.604569 139.921203,251.166631 L251.172245,139.9184 C257.61018,133.477654 257.61018,123.031455 251.172245,116.593517"
              />
            </svg>
          </a>
        </div>
      </header>

      <section class="mb-12">
        <div class="flex justify-between mb-2 items-center">
          <span class="text-slate-500 dark:text-slate-400 text-xl font-bold"
            >Overall Progress</span
          >
          <span
            class="text-3xl font-black text-cyan-500"
            x-text="status.progress.toFixed(1) + '%'"
          ></span>
        </div>

        <div
          class="w-full bg-white dark:bg-slate-800 rounded-full h-8 overflow-hidden border border-slate-400 dark:border-slate-700 shadow-md transition-all duration-300 hover:scale-[1.02] hover:shadow-lg cursor-default"
        >
          <div
            class="bg-gradient-to-r from-cyan-600 to-blue-500 h-full transition-all duration-500 shadow-[0_0_20px_rgba(6,182,212,0.3)]"
            :style="`width: ${status.progress}%`"
            :class="status.is_complete ? 'from-green-500 to-emerald-600' : ''"
          ></div>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <template x-for="(stat, index) in stats" :key="index">
          <div
            class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-400 dark:border-slate-700 shadow-md flex flex-col justify-between transition-transform hover:scale-[1.02]"
          >
            <div>
              <p
                class="text-slate-500 dark:text-slate-400 text-xs font-black uppercase tracking-widest mb-2"
                x-text="stat.label"
              ></p>
              <p
                class="text-3xl font-black"
                :class="stat.color"
                x-text="stat.value"
              ></p>
            </div>

            <div
              class="mt-4 border-t border-slate-100 dark:border-slate-700/50 pt-3 flex flex-col gap-1"
            >
              <template x-if="stat.subValue">
                <p
                  class="text-[10px] font-mono uppercase tracking-tighter text-slate-400"
                  x-text="stat.subValue"
                ></p>
              </template>
            </div>
          </div>
        </template>
      </div>

      <section class="mt-8" x-show="status.failure_tns.length > 0" x-cloak>
        <h2 class="text-xl font-bold text-rose-500 mb-4 flex items-center">
          <svg
            class="w-6 h-6 mr-2 stroke-current"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
          Failed Trials
        </h2>
        <div
          class="bg-white dark:bg-slate-800 border border-slate-400 dark:border-slate-700 rounded-xl p-4 max-h-60 overflow-y-auto shadow-md"
        >
          <div
            class="grid grid-cols-[repeat(auto-fill,minmax(3.5rem,1fr))] gap-3"
          >
            <template x-for="tn in status.failure_tns" :key="tn">
              <span
                class="inline-flex items-center justify-center px-2 py-1 bg-rose-50 dark:bg-rose-900/30 border border-rose-400 dark:border-rose-500/50 text-rose-600 dark:text-rose-400 rounded-md font-mono text-sm transition-all duration-200 cursor-default origin-center shadow-md hover:scale-110 hover:shadow-xl"
                x-text="tn"
              ></span>
            </template>
          </div>
        </div>
      </section>
    </div>

    <footer
      class="max-w-6xl mx-auto px-8 mt-6 py-6 border-t border-slate-400 dark:border-slate-800 flex flex-row-reverse justify-between items-center text-xs text-slate-400 font-mono"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center gap-2 bg-slate-200 dark:bg-slate-800/50 px-3 py-1 rounded-full border border-slate-300 dark:border-slate-700/50"
        >
          <span
            class="h-1.5 w-1.5 rounded-full"
            :class="status.is_complete ? 'bg-cyan-500' : (secondsSinceUpdate < 10 ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500')"
          ></span>
          <span
            x-text="status.is_complete ? 'Final Data' : `Sync: ${formatTimeAgo(secondsSinceUpdate)}`"
          ></span>
        </div>
        <div><span x-text="status.version || '0.0.0'"></span></div>
      </div>

      <div class="italic opacity-50 transition-opacity hover:opacity-100">
        <a
          href="https://www.david-gable.com/"
          target="_blank"
          class="text-inherit no-underline cursor-pointer hover:text-cyan-500 transition-colors"
          title="Visit david-gable.com"
        >
          &copy; 2026 David Gable
        </a>
      </div>
    </footer>

    <!-- mixkit-fantasy-game-success-notification-270 -->
    <audio id="chime" src="/static/chime.mp3" playsinline></audio>

    <script>
      function formatTimeAgo(seconds) {
        if (!seconds || seconds < 60) return `${seconds || 0}s ago`;
        const mins = Math.floor(seconds / 60);
        return mins < 60 ? `${mins}m ago` : `${Math.floor(mins / 60)}h ago`;
      }

      function dashboard() {
        return {
          status: {
            n_done: 0,
            n_success: 0,
            n_failed: 0,
            failure_tns: [],
            progress: 0,
          },
          stats: [],
          lastUpdate: null,
          secondsSinceUpdate: 0,
          timer: null,
          isLoading: false,
          isAutoRefresh: true,
          chimePlayed: false,
          isMuted: localStorage.getItem("mojo_muted") !== "false",

          // Top Progress Bar State
          syncProgress: 0,
          isSyncing: false,

          async init() {
            this.startPolling();
            // Update the "Seconds ago" timer every second
            setInterval(() => {
              if (this.lastUpdate)
                this.secondsSinceUpdate = Math.floor(
                  (Date.now() - this.lastUpdate) / 1000,
                );
            }, 1000);
            await this.update();
          },

          // Logic to transform the raw JSON status into UI-friendly stat cards
          refreshStats() {
            const totalDone = this.status.n_done || 0;
            const n_trial = this.status.n_trial || 1;
            const successPerc =
              totalDone > 0
                ? ((this.status.n_success / totalDone) * 100).toFixed(1)
                : 0;
            const failurePerc =
              totalDone > 0
                ? ((this.status.n_failed / totalDone) * 100).toFixed(1)
                : 0;
            const donePerc = ((totalDone / n_trial) * 100).toFixed(1);
            const lastFailure =
              this.status.failure_tns.length > 0
                ? this.status.failure_tns[this.status.failure_tns.length - 1]
                : "None";

            const finalETA = this.status.is_complete
              ? "Job Complete"
              : `ETA: ${this.status.end_time}`;
            const remainingVal = this.status.is_complete
              ? "00:00:00"
              : this.status.time_remaining;

            this.stats = [
              {
                label: "Successes",
                value: `${this.status.n_success} (${successPerc}%)`,
                color: "text-emerald-500",
                subValue: `Last: Trial ${this.status.last_success_tn || "None"}`,
              },
              {
                label: "Failures",
                value: `${this.status.n_failed} (${failurePerc}%)`,
                color: "text-rose-500",
                subValue: `Last Failure: Trial ${lastFailure}`,
              },
              {
                label: "Remaining",
                value: `${this.status.n_remaining} (${(100 - donePerc).toFixed(1)}%)`,
                color: "text-amber-500",
                subValue: `${this.status.throughput} trials/min (${this.status.avg_duration} per trial)`,
              },
              {
                label: "Time Elapsed",
                value: this.status.elapsed,
                color: "text-slate-500",
                subValue: `Started: ${this.status.start_time}`,
              },
              {
                label: "Total Done",
                value: `${totalDone}`,
                color: "text-cyan-500",
                subValue: `Target: ${n_trial} trials`,
              },
              {
                label: this.status.is_complete ? "Finished" : "Est. Remaining",
                value: remainingVal,
                color: "text-slate-500",
                subValue: finalETA,
              },
            ];
          },

          // Helper to generate the dynamic horizontal gradient string for the laser tail effect.
          // This is not dynamic because it is percentage based within the bar's width.
          // The bar itself grows, which stretches the gradient. This is the logic for a controllable percentage-based tail.
          // Adjust the first stop (0%) and the second stop (25%) to change the fade logic.
          getSyncGradient() {
            return "linear-gradient(to right, transparent 0%, #06b6d4 25%, #06b6d4 100%)";
          },

          async update() {
            if (this.isSyncing) return;

            const startTime = Date.now();
            this.isLoading = true;
            this.isSyncing = true;
            this.syncProgress = 0;

            // Listen to the SSE stream from the Python backend
            const source = new EventSource("/api/status/stream");

            source.onmessage = (event) => {
              const data = JSON.parse(event.data);

              // Update the Top Loader progress bar
              if (data.type === "progress") {
                this.syncProgress = data.value;
              }

              // When the server is done scanning, update the whole UI
              if (data.type === "final") {
                // 1. Update the data
                this.status = data.status;
                this.syncProgress = 100;

                // 2. CHECK FOR COMPLETION: Stop the timer if we are done
                if (this.status.is_complete) {
                  console.log("Mojo Job Finished. Stopping auto-refresh.");
                  this.stopPolling();

                  // Only fire celebration once
                  if (!this.chimePlayed) {
                    if (!this.isMuted) {
                      document
                        .getElementById("chime")
                        .play()
                        .catch(() => {});
                    }
                    this.fireConfetti();
                    this.chimePlayed = true;
                  }
                }

                // 3. The rest of your UI cleanup...
                this.$nextTick(() => {
                  this.refreshStats();
                  this.lastUpdate = Date.now();
                  this.secondsSinceUpdate = 0;

                  // 3. Add a purposeful delay to let the user "see" the 100% and the new data
                  setTimeout(() => {
                    this.isSyncing = false;
                    // Fade the spinny icon slightly later for a layered feel
                    setTimeout(() => {
                      this.isLoading = false;
                    }, 200);
                    source.close();
                  }, 400);
                });
              }
            };

            source.onerror = () => {
              console.warn("Mojo Sync Connection Interrupted");
              this.isLoading = false;
              this.isSyncing = false;
              source.close();
            };
          },

          startPolling() {
            this.stopPolling();
            if (!this.status.is_complete)
              this.timer = setInterval(() => this.update(), 5000);
          },

          stopPolling() {
            if (this.timer) {
              clearInterval(this.timer);
              this.timer = null;
            }
          },

          toggleAutoRefresh() {
            this.isAutoRefresh = !this.isAutoRefresh;
            this.isAutoRefresh
              ? (this.startPolling(), this.update())
              : this.stopPolling();
          },

          fireConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = {
              startVelocity: 30,
              spread: 360,
              ticks: 60,
              zIndex: 1000,
            };
            const randomInRange = (min, max) =>
              Math.random() * (max - min) + min;

            const interval = setInterval(function () {
              const timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              const particleCount = 50 * (timeLeft / duration);
              confetti({
                ...defaults,
                particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                colors: ["#06b6d4", "#3b82f6", "#22c55e"],
              });
              confetti({
                ...defaults,
                particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                colors: ["#06b6d4", "#3b82f6", "#22c55e"],
              });
            }, 250);
          },
        };
      }
    </script>
  </body>
</html>
