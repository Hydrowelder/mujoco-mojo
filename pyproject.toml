[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mujoco-mojo"
dynamic = ["version"]
description = "A complete MJCF lifecycle and trial orchestration suite for MuJoCo, powered by Pydantic v2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coacd>=1.0.7",
    "fastapi>=0.134.0",
    "fastparquet>=2025.12.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "mediapy>=1.2.6",
    "mujoco>=3.8.0",
    "numpy>=2.4.1",
    "numpydantic>=1.7.0",
    "pandas>=3.0.0",
    "pillow>=12.1.1",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pybind11-stubgen>=2.5.5",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "scipy>=1.17.0",
    "scipy-stubs[scipy]>=1.17.0.2",
    "stochas>=2.1.4",
    "sse-starlette>=3.3.4",
    "tabulate>=0.9.0",
    "trimesh>=4.11.2",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "optuna>=4.8.0",
    "joblib>=1.5.3",
    "optuna-dashboard>=0.20.0",
    "pint>=0.25.3",
    "python-fcl>=0.7.0.11",
    "rtree>=1.4.1",
    "filelock>=3.29.0",
    "pydantic-settings>=2.14.1",
    "tomli-w>=1.2.0",
    "pytransform3d>=3.15.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "David Gable", email = "dave.a.gable@gmail.com" }]
maintainers = [{ name = "David Gable", email = "dave.a.gable@gmail.com" }]
license = { text = "Apache-2.0" }

keywords = [
    "mujoco",
    "robotics",
    "simulation",
    "monte-carlo",
    "physics",
    "pydantic",
    "orchestration",
    "mjcf",
]

[project.optional-dependencies]
reloaded = ["mjviser>=0.0.11", "viser>=1.0.26", "watchfiles>=1.1.1"]
# sensai = ["pydantic-ai>=1.102.0", "requests>=2.32.5"]

[dependency-groups]
dev = [
    "griffe-pydantic>=1.2.0",
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.7.1",
    "mkdocs-open-in-new-tab>=1.0.8",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings[python]>=1.0.2",
    "pyright[nodejs]>=1.1.410",
    "pytest>=9.0.2",
    "ruff>=0.15.17",
    "tabulate>=0.9.0",
    "watchfiles>=1.1.1",
    "zensical>=0.0.36",
]

[project.scripts]
mujoco-mojo = "mujoco_mojo.utils.layers.cli:cli_app"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_mojo"]

[tool.ruff]
exclude = ["typings", "scripts/templating/sensor_template.py"]

[tool.ruff.lint]
select = ["D", "RUF", "E", "F", "W", "UP"] # some suggest using "ALL"

ignore = [
    # modules
    "ANN", # flake8-annotations
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DJ",  # django
    "EXE", # flake8-executable
    "T10", # debugger
    "TID", # flake8-tidy-imports

    # specific rules
    "D100",   # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D203",
    "D205",
    "D212",
    "D400",
    "D401",
    "D404",
    "D415",
    "E402",   # false positives for local imports
    "E501",   # line too long
    "TRY003", # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002", # too verbose descriptions of todos
]

[tool.pyright]
stubPath = "./typings"
venvPath = ".."
venv = ".venv"
ignore = ["typings", "scripts/templating/sensor_template.py"]

[project.urls]
Homepage = "https://github.com/Hydrowelder/mujoco-mojo"
Documentation = "https://hydrowelder.github.io/mujoco-mojo/"
Repository = "https://github.com/Hydrowelder/mujoco-mojo"
Issues = "https://github.com/Hydrowelder/mujoco-mojo/issues"
Discussions = "https://github.com/Hydrowelder/mujoco-mojo/discussions"
